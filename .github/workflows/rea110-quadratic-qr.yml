name: REA-110 quadratic weighted QR regression
on:
  push:
    paths:
      - 'calculator/js/stat-regression.js'
      - 'calculator/fx991_fresh_standalone.html'
      - 'calculator/reference/rea-110/**'
      - 'calculator/reference/rea-109/test_quadratic_roots.js'
      - 'calculator/tools/build_standalone.py'
      - '.github/workflows/rea110-quadratic-qr.yml'
  pull_request:
    paths:
      - 'calculator/js/stat-regression.js'
      - 'calculator/fx991_fresh_standalone.html'
      - 'calculator/reference/rea-110/**'
      - 'calculator/reference/rea-109/test_quadratic_roots.js'
      - 'calculator/tools/build_standalone.py'
jobs:
  quadratic-qr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and test syntax
        run: |
          node --check calculator/js/stat-regression.js
          node --check calculator/reference/rea-110/test_quadratic_qr.js
      - name: Check weighted QR and previous regression suites
        run: |
          node calculator/reference/rea-110/test_quadratic_qr.js
          node calculator/reference/rea-109/test_quadratic_roots.js
          node calculator/reference/rea-108/test_linear_regression.js
          node calculator/reference/rea-107/test_paired_stat.js
      - name: Check standalone determinism
        run: python3 calculator/tools/build_standalone.py --check

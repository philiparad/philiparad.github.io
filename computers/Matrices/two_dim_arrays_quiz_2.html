<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>אלכסונים במערכים דו־ממדיים</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg1: #f0f9ff;
      --bg2: #eef2ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --line: #dbe3ef;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --correct-bg: #ecfdf5;
      --correct-text: #047857;
      --correct-border: #10b981;
      --wrong-bg: #fef2f2;
      --wrong-text: #b91c1c;
      --wrong-border: #ef4444;
      --code-bg: #f8fafc;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 20px;
    }

    .screen.center {
      align-items: center;
    }

    .card {
      width: min(860px, 100%);
      background: var(--card);
      border: 2px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px;
    }

    .landing-card,
    .result-card {
      width: min(620px, 100%);
      text-align: center;
    }

    .hero-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(28px, 5vw, 38px);
    }

    h2 {
      margin: 0 0 18px;
      font-size: clamp(22px, 4vw, 30px);
      text-align: right;
    }

    p {
      line-height: 1.7;
    }

    .subtitle {
      color: var(--muted);
      font-size: 18px;
      margin: 0 0 26px;
    }

    .progress-wrap {
      margin-bottom: 24px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0;
      transition: width 0.25s ease;
    }

    .question {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 18px;
      text-align: right;
    }

    pre {
      direction: ltr;
      text-align: left;
      unicode-bidi: plaintext;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--code-bg);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin: 0 0 22px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-x: auto;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      text-align: right;
      padding: 15px 18px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .option:hover:not(:disabled) {
      border-color: #818cf8;
      transform: translateY(-1px);
    }

    .option:disabled {
      cursor: default;
    }

    .option.correct {
      border-color: var(--correct-border);
      background: var(--correct-bg);
    }

    .option.wrong {
      border-color: var(--wrong-border);
      background: var(--wrong-bg);
    }

    .feedback {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 16px;
      border: 2px solid transparent;
      line-height: 1.65;
    }

    .feedback.correct {
      background: var(--correct-bg);
      color: var(--correct-text);
      border-color: #a7f3d0;
    }

    .feedback.wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
      border-color: #fecaca;
    }

    .feedback-title {
      font-weight: 800;
      margin-bottom: 8px;
    }

    .correct-explanation {
      margin-top: 8px;
      color: #374151;
      font-size: 14px;
    }

    .actions {
      display: flex;
      justify-content: flex-start;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 12px 22px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn:disabled {
      background: #c7d2fe;
      color: #fff;
      cursor: not-allowed;
      transform: none;
    }

    .score {
      font-size: 23px;
      margin: 10px 0 24px;
      color: #374151;
    }

    .score strong {
      color: var(--primary);
    }

    .validation {
      margin-top: 16px;
      color: #b91c1c;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    bdi, code, .ltr {
      direction: ltr;
      unicode-bidi: isolate;
    }

    @media (max-width: 640px) {
      .screen {
        padding: 20px 12px;
      }
      .card {
        padding: 22px 16px;
        border-radius: 18px;
      }
      .question {
        font-size: 18px;
      }
      .option {
        padding: 14px;
      }
    }
  </style>
</head>
<body>

      explanation: {
        0: "סכום ראשי=15, משני=7+5+3=15? לא, 3+5+7=15, אז ההפרש 0 רק אם סימטרי.",
        1: "סימן לא נכון.",
        2: "main=15, sec=15 → ההפרש 0 — נבדוק: טעות! למעשה שניהם שווים, אבל עבור מטריצה לא סימטרית ההפרש עשוי להשתנות. פה 15-15=0 — אם ההפרש היה מוחלט ההבדל 0. לשאלה יש כוונה לבדוק הבנה של לולאה."
      }
    },
    {
      id: 22,
      question: "מה תנאי לבדיקה אם כל האיברים באלכסון הראשי הם חיוביים?",
      code: `bool allPositive=true;
for(int i=0;i<n;i++)
  if(m[i,i]<=0) allPositive=false;`,
      options: ["m[i,i]>0 לכל i", "m[i,i]>=0 לכל i", "m[i,i]<0 לכל i"],
      correct: 0,
      explanation: {
        0: "זהו התנאי המדויק לבדוק חיוביות.",
        1: "מאפשר אפסים, לא חיובי בלבד.",
        2: "הפוך בתנאי."
      }
    },
    {
      id: 23,
      question: "מה יודפס אם נחשב סכום האלכסון הראשי לאחר החלפת שורה 0 ו‑שורה 2?",
      code: `int[,] m={{1,2,3},{4,5,6},{7,8,9}};
int[] temp={m[0,0],m[0,1],m[0,2]};
for(int j=0;j<3;j++){m[0,j]=m[2,j];m[2,j]=temp[j];}
int sum=0;
for(int i=0;i<3;i++) sum+=m[i,i];
Console.WriteLine(sum);`,
      options: ["15", "11", "13"],
      correct: 2,
      explanation: {
        0: "לא נשמר האלכסון המקורי.",
        1: "חישוב שגוי.",
        2: "לאחר ההחלפה האלכסון הראשי מכיל 7,5,1 → 13."
      }
    },
    {
      id: 24,
      question: "במטריצה ריבועית n×n, כמה איברים יש מעל האלכסון הראשי (לא כולל האלכסון)?",
      options: ["n*(n-1)/2", "n^2/2", "n-1"],
      correct: 0,
      explanation: {
        0: "יש n(n-1)/2 איברים מעל האלכסון.",
        1: "זה חצי מהמטריצה, לא מדויק.",
        2: "לא רק אחד לכל שורה."
      }
    },
    {
      id: 25,
      question: "מה יודפס אם נחזיר את סכום האלכסון הראשי באמצעות פעולה רקורסיבית?",
      code: `int SumDiag(int[,] m,int i){
  if(i==m.GetLength(0)) return 0;
  return m[i,i]+SumDiag(m,i+1);
}
int[,] m={{2,0,0},{0,3,0},{0,0,4}};
Console.WriteLine(SumDiag(m,0));`,
      options: ["9", "5", "6"],
      correct: 0,
      explanation: {
        0: "2+3+4=9 — סכום האלכסון הראשי ברקורסיה.",
        1: "חישוב חסר.",
        2: "שגוי."
      }
    }
  ];

    let page = "landing";
    let qIndex = 0;
    const answers = {};

    const app = document.getElementById("app");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatInlineBiDi(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(
        /([A-Za-z_][A-Za-z0-9_]*&lt;[^&]+&gt;)/g,
        '<bdi dir="ltr" class="ltr">$1</bdi>'
      );
    }

    function validateQuestions() {
      const issues = [];

      if (questions.length !== 25) {
        issues.push(`צפויות 25 שאלות, בפועל: ${questions.length}`);
      }

      const ids = new Set();
      const seen = [];

      questions.forEach((q) => {
        if (ids.has(q.id)) issues.push(`מזהה שאלה כפול: id=${q.id}`);
        ids.add(q.id);
        seen.push(q.id);

        if (!Array.isArray(q.options) || q.options.length !== 3) {
          issues.push(`שאלה id=${q.id} צריכה 3 אפשרויות`);
        }

        if (!(Number.isInteger(q.correct) && q.correct >= 0 && q.correct < q.options.length)) {
          issues.push(`אינדקס תשובה נכונה מחוץ לטווח בשאלה id=${q.id}`);
        }

        q.options.forEach((_, i) => {
          if (!q.explanation || typeof q.explanation[i] !== "string" || q.explanation[i].length === 0) {
            issues.push(`חסר הסבר לאפשרות ${i} בשאלה id=${q.id}`);
          }
        });

        if (q.code !== undefined && String(q.code).trim().length === 0) {
          issues.push(`שדה code ריק בשאלה id=${q.id}`);
        }
      });

      [...seen].sort((a, b) => a - b).forEach((id, i) => {
        if (id !== i + 1) issues.push(`מזהה שאלה אינו רציף: ציפיתי ל-${i + 1} בפועל ${id}`);
      });

      if (issues.length) {
        console.warn("QUIZ TESTS FAILED:", issues);
      } else {
        console.info("QUIZ TESTS PASSED ✔");
      }

      return issues;
    }

    const validationIssues = validateQuestions();

    function getCorrectCount() {
      return Object.keys(answers).filter((key) => {
        const index = Number(key);
        return questions[index].correct === answers[index];
      }).length;
    }

    function render() {
      if (page === "landing") {
        renderLanding();
      } else if (page === "result") {
        renderResult();
      } else {
        renderQuiz();
      }
    }

    function renderLanding() {
      app.innerHTML = `
        <section class="screen center">
          <div class="card landing-card">
            <div class="hero-icon" aria-hidden="true">📊</div>
            <h1>אלכסונים במערכים דו־ממדיים</h1>
            <p class="subtitle">שאלות תיאורטיות ומעשיות על אלכסון ראשי ואלכסון משני במטריצה.</p>
            ${validationIssues.length ? `<div class="validation">יש בעיות בתיקוף השאלות (${validationIssues.length}). פרטים בקונסול.</div>` : ""}
            <div class="actions" style="justify-content:center">
              <button class="btn btn-primary" id="startBtn">🚀 התחל מבדק</button>
            </div>
          </div>
        </section>
      `;

      document.getElementById("startBtn").addEventListener("click", () => {
        page = "quiz";
        qIndex = 0;
        render();
      });
    }

    function renderQuiz() {
      const current = questions[qIndex];
      const answered = answers[qIndex] !== undefined;
      const selected = answers[qIndex];
      const progress = ((qIndex + 1) / questions.length) * 100;

      const optionsHtml = current.options.map((opt, i) => {
        let cls = "option";
        if (answered) {
          if (i === current.correct) cls += " correct";
          else if (i === selected) cls += " wrong";
        }

        return `
          <button class="${cls}" data-option="${i}" ${answered ? "disabled" : ""}>
            ${formatInlineBiDi(opt)}
          </button>
        `;
      }).join("");

      let feedbackHtml = "";
      if (answered) {
        const isCorrect = selected === current.correct;
        if (isCorrect) {
          feedbackHtml = `
            <div class="feedback correct" aria-live="polite">
              <div class="feedback-title">תשובה נכונה ✅</div>
            </div>
          `;
        } else {
          feedbackHtml = `
            <div class="feedback wrong" aria-live="polite">
              <div class="feedback-title">תשובה שגויה ❌</div>
              <div>${formatInlineBiDi(current.explanation[selected])}</div>
              <div class="correct-explanation">
                <strong>הסבר לתשובה הנכונה:</strong>
                ${formatInlineBiDi(current.explanation[current.correct])}
              </div>
            </div>
          `;
        }
      }

      app.innerHTML = `
        <section class="screen">
          <div class="card">
            <div class="progress-wrap">
              <div class="progress-text">
                <span>שאלה ${qIndex + 1} מתוך ${questions.length}</span>
                <span>${Math.round(progress)}%</span>
              </div>
              <div class="progress" aria-label="התקדמות במבדק">
                <div class="progress-bar" style="width:${progress}%"></div>
              </div>
            </div>

            <h2>שאלה ${qIndex + 1}</h2>
            <div class="question">${formatInlineBiDi(current.question)}</div>

            ${current.code !== undefined ? `<pre><code>${escapeHtml(current.code)}</code></pre>` : ""}

            <div class="options">
              ${optionsHtml}
            </div>

            ${feedbackHtml}

            <div class="actions">
              <button class="btn btn-primary" id="nextBtn" ${answered ? "" : "disabled"}>
                ${qIndex === questions.length - 1 ? "סיום" : "לשאלה הבאה"}
              </button>
            </div>
          </div>
        </section>
      `;

      document.querySelectorAll("[data-option]").forEach((button) => {
        button.addEventListener("click", () => {
          if (answers[qIndex] !== undefined) return;
          answers[qIndex] = Number(button.dataset.option);
          render();
        });
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        if (answers[qIndex] === undefined) return;

        if (qIndex < questions.length - 1) {
          qIndex += 1;
          render();
        } else {
          page = "result";
          render();
        }
      });
    }

    function renderResult() {
      const correctCount = getCorrectCount();

      app.innerHTML = `
        <section class="screen center">
          <div class="card result-card">
            <div class="hero-icon" aria-hidden="true">⭐</div>
            <h1>תוצאות</h1>
            <p class="score">ענית נכון על <strong>${correctCount}</strong> מתוך <strong>${questions.length}</strong> שאלות.</p>
            <div class="actions" style="justify-content:center">
              <button class="btn btn-primary" id="restartBtn">🔁 התחל מחדש</button>
            </div>
          </div>
        </section>
      `;

      document.getElementById("restartBtn").addEventListener("click", () => {
        for (const key of Object.keys(answers)) delete answers[key];
        qIndex = 0;
        page = "quiz";
        render();
      });
    }

    render();
  </script>
</body>
</html>

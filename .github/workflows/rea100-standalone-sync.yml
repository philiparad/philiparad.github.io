            echo "- PASS: Verify PLUS-only arithmetic, model identity and key contracts" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.plus038_check_05.outcome }}" != "success" ]; then
            echo "- FAIL or SKIP: PLUS-028 ALT manufacturer-reference conformance report" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "- PASS: PLUS-028 ALT manufacturer-reference conformance report" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.plus038_check_06.outcome }}" != "success" ]; then
            echo "- FAIL or SKIP: Verify modular and standalone keypad, model and result behavior" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "- PASS: Verify modular and standalone keypad, model and result behavior" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.plus038_check_07.outcome }}" != "success" ]; then
            echo "- FAIL or SKIP: Verify PLUS arithmetic precedence using actual browser keypad" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "- PASS: Verify PLUS arithmetic precedence using actual browser keypad" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.plus038_check_08.outcome }}" != "success" ]; then
            echo "- FAIL or SKIP: Verify live STAT summary and protected Sum fields in both publications" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "- PASS: Verify live STAT summary and protected Sum fields in both publications" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.plus038_check_09.outcome }}" != "success" ]; then
            echo "- FAIL or SKIP: Verify PLUS physical MODE keys and EQN types 1-4" >> "$GITHUB_STEP_SUMMARY"
            failed=1

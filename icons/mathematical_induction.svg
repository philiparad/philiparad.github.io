<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Mathematical induction icon with falling dominoes">
  <style>
    .outline { stroke:#243447; stroke-width:12; stroke-linecap:round; stroke-linejoin:round; }
    .arrow { fill:none; stroke:#243447; stroke-width:12; stroke-linecap:round; stroke-linejoin:round; }
    .dot { fill:#243447; }
  </style>

  <!-- curved implication arrow -->
  <path d="M120 110 C220 65, 310 68, 402 115" class="arrow"/>
  <path d="M388 92 L408 117 L376 121" class="arrow"/>

  <!-- start spark / base case -->
  <g>
    <circle cx="98" cy="118" r="10" fill="#ffffff" class="outline"/>
    <path d="M98 84 V63 M98 173 V152 M64 118 H43 M153 118 H132 M74 94 L59 79 M122 94 L137 79 M74 142 L59 157 M122 142 L137 157" class="arrow" stroke-width="8"/>
  </g>

  <!-- baseline -->
  <path d="M70 416 H444" class="arrow" opacity="0.20"/>

  <!-- domino 1 -->
  <g>
    <rect x="90" y="176" width="78" height="204" rx="18" ry="18" fill="#9fd8cf" class="outline"/>
    <line x1="106" y1="278" x2="152" y2="278" class="arrow" opacity="0.75"/>
    <circle cx="129" cy="230" r="9" class="dot"/>
    <circle cx="129" cy="328" r="9" class="dot"/>
  </g>

  <!-- domino 2 -->
  <g transform="rotate(-12 238 278)">
    <rect x="199" y="176" width="78" height="204" rx="18" ry="18" fill="#f6d79a" class="outline"/>
    <line x1="215" y1="278" x2="261" y2="278" class="arrow" opacity="0.75"/>
    <circle cx="227" cy="232" r="9" class="dot"/>
    <circle cx="249" cy="324" r="9" class="dot"/>
  </g>

  <!-- domino 3 -->
  <g transform="rotate(-25 340 292)">
    <rect x="301" y="190" width="78" height="204" rx="18" ry="18" fill="#b8c8f0" class="outline"/>
    <line x1="317" y1="292" x2="363" y2="292" class="arrow" opacity="0.75"/>
    <circle cx="328" cy="244" r="9" class="dot"/>
    <circle cx="350" cy="244" r="9" class="dot"/>
    <circle cx="328" cy="340" r="9" class="dot"/>
  </g>

  <!-- domino 4 -->
  <g transform="rotate(-42 428 332)">
    <rect x="389" y="230" width="78" height="204" rx="18" ry="18" fill="#f5b7a8" class="outline"/>
    <line x1="405" y1="332" x2="451" y2="332" class="arrow" opacity="0.75"/>
    <circle cx="416" cy="284" r="9" class="dot"/>
    <circle cx="438" cy="284" r="9" class="dot"/>
    <circle cx="416" cy="380" r="9" class="dot"/>
    <circle cx="438" cy="380" r="9" class="dot"/>
  </g>
</svg>

name: REA-077 CALC variable substitution and replay
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/calc-substitution.js'
      - 'calculator/js/app.js'
      - 'calculator/js/complex-engine.js'
      - 'calculator/js/math-engine.js'
      - 'calculator/index.html'
      - 'calculator/tests/rea077-calc-substitution.cjs'
      - 'calculator/reference/rea-077/**'
      - '.github/workflows/rea077-calc-substitution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CALC scanner, memory, multi-statement and CMPLX checks
        run: node calculator/tests/rea077-calc-substitution.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run original, PLUS and PLUS C keypad sequences
        run: python calculator/reference/rea-077/test_calc_browser.py

name: REA-073 Natural MathIO structured editor
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/structured-editor.js'
      - 'calculator/js/keyboard.js'
      - 'calculator/js/app.js'
      - 'calculator/js/lcd-viewport.js'
      - 'calculator/js/display.js'
      - 'calculator/js/math-engine.js'
      - 'calculator/index.html'
      - 'calculator/tests/rea073-structured-editor.cjs'
      - 'calculator/reference/rea-073/**'
      - '.github/workflows/rea073-structured-editor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mathio-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run nested textbook-template and undo checks
        run: node calculator/tests/rea073-structured-editor.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test physical DOM keys and natural MathIO screen
        run: python calculator/reference/rea-073/test_editor_browser.py

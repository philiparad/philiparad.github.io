name: Build Android Digital Clock APK
on:
  workflow_dispatch:
  push:
    paths:
      - clock.html
      - .github/workflows/clock-android.yml
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK packages
        run: |
          sdkmanager --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Prepare Android project
        shell: bash
        run: |
          set -eu
          mkdir -p /tmp/clock-android/app/src/main/{assets,java/com/philiparad/clock,res/drawable}
          cp clock.html /tmp/clock-android/app/src/main/assets/clock.html
          cd /tmp/clock-android
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'DigitalClock'
          include ':app'
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.6.1' }
          android {
            namespace 'com.philiparad.clock'
            compileSdk 35
            defaultConfig {
              applicationId 'com.philiparad.clock'
              minSdk 26
              targetSdk 34
              versionCode 2
              versionName '1.1'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="Digital Clock" android:icon="@drawable/clock_icon" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/clock_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#A6DCEF" android:strokeColor="#193B5B" android:strokeWidth="12" android:pathData="M86,270 A170,170 0,1 0,426 270 A170,170 0,1 0,86 270 Z"/>
            <path android:fillColor="#FFFDF8" android:strokeColor="#193B5B" android:strokeWidth="8" android:pathData="M118,270 A138,138 0,1 0,394 270 A138,138 0,1 0,118 270 Z"/>
            <path android:strokeColor="#193B5B" android:strokeWidth="16" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M256,180 V270 L321,312"/>
            <path android:fillColor="#76BED6" android:strokeColor="#193B5B" android:strokeWidth="7" android:pathData="M244,270 A12,12 0,1 0,268 270 A12,12 0,1 0,244 270 Z"/>
            <path android:strokeColor="#193B5B" android:strokeWidth="10" android:strokeLineCap="round" android:pathData="M199,81 Q256,42 313,81"/>
            <path android:strokeColor="#193B5B" android:strokeWidth="9" android:strokeLineCap="round" android:pathData="M220,100 Q256,75 292,100"/>
            <path android:fillColor="#FFE3A3" android:strokeColor="#193B5B" android:strokeWidth="10" android:pathData="M349,136 A36,36 0,1 0,421 136 A36,36 0,1 0,349 136 Z"/>
            <path android:strokeColor="#193B5B" android:strokeWidth="8" android:strokeLineCap="round" android:pathData="M385,119 V138"/>
            <path android:fillColor="#193B5B" android:pathData="M381,151 A4,4 0,1 0,389 151 A4,4 0,1 0,381 151 Z"/>
          </vector>
          EOF
          cat > app/src/main/java/com/philiparad/clock/MainActivity.java <<'EOF'
          package com.philiparad.clock;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          public class MainActivity extends Activity {
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              WebView view = new WebView(this);
              view.getSettings().setJavaScriptEnabled(true);
              view.getSettings().setDomStorageEnabled(true);
              view.getSettings().setAllowFileAccess(false);
              view.getSettings().setAllowContentAccess(false);
              view.getSettings().setMediaPlaybackRequiresUserGesture(false);
              view.setWebViewClient(new WebViewClient() {
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) { return true; }
              });
              setContentView(view);
              view.loadUrl("file:///android_asset/clock.html");
            }
          }
          EOF
      - name: Build signed debug APK
        run: |
          gradle -p /tmp/clock-android :app:assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          cp /tmp/clock-android/app/build/outputs/apk/debug/app-debug.apk dist/DigitalClock.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/DigitalClock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DigitalClock-Android
          path: dist/DigitalClock.apk
          if-no-files-found: error

name: REA-083 sexagesimal entry arithmetic and conversion
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/sexagesimal.js'
      - 'calculator/js/app.js'
      - 'calculator/js/math-engine.js'
      - 'calculator/tests/rea083-sexagesimal.cjs'
      - 'calculator/reference/rea-083/**'
      - '.github/workflows/rea083-sexagesimal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sexagesimal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sexagesimal arithmetic and keypad state
        run: node calculator/tests/rea083-sexagesimal.cjs
      - name: Check previous DRG angle converter
        run: node calculator/tests/rea082-drg-angle.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Three-model DMS physical-key and conversion browser regression
        run: python calculator/reference/rea-083/test_dms_browser.py

name: Cross-browser acceptance — M42
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'styles.css'
      - 'index.html'
      - 'tools/**'
      - '.github/workflows/review-browser-artifacts.yml'
      - '.github/workflows/browser-acceptance.yml'
permissions:
  contents: read
jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local calculator regression suite
        run: node tests/run-node.cjs
      - name: Validate browser evidence gate
        run: python -m unittest discover -s tools/tests -v
      - name: Record available CI environment before installing Playwright
        if: always()
        continue-on-error: true
        run: python tools/ci_environment.py --stage before-install --out release-evidence/ci-environment-before.json --markdown release-evidence/ci-environment-before.md
      - name: Install browser testing dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Inspect Playwright/browser installation (must have three browser engines)
        if: always()
        run: |
          python tools/ci_environment.py --stage after-install --out release-evidence/ci-environment.json --markdown release-evidence/ci-environment.md
      - name: Publish environment diagnostics to GitHub Actions summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f release-evidence/ci-environment.md ]; then
            cat release-evidence/ci-environment.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Browser environment preflight did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate release candidate source inventory
        run: python tools/release_gate.py verify
      - name: Run actual browser matrix
        run: python tools/browser_matrix.py --out browser-evidence
      - name: Run native end-to-end interactions in Chromium Firefox WebKit
        if: always()
        run: python tools/browser_interaction_probe.py --out browser-evidence
      - name: Render browser matrix status for GitHub Actions summary
        if: always()
        continue-on-error: true
        run: |
          python tools/ci_matrix_summary.py --matrix browser-evidence/matrix-run.json --out release-evidence/ci-matrix-summary.json --markdown release-evidence/ci-matrix-summary.md
          cat release-evidence/ci-matrix-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Audit captured browser evidence against this checkout
        if: always()
        run: python tools/evidence_review.py browser-evidence --out browser-evidence/evidence-review.json
      - name: Generate a human-readable fail-closed release decision
        if: always()
        run: python tools/release_report.py --evidence browser-evidence --out release-evidence
      - name: Generate actionable CI diagnostics even if evidence is missing
        if: always()
        run: python tools/ci_diagnostics.py --matrix browser-evidence/matrix-run.json --decision release-evidence/release-decision.json --out release-evidence/ci-diagnostics.json
      - name: Verify release report module unit tests
        if: always()
        run: python -m unittest discover -s tools/tests -v
      - name: Create a portable GitHub Actions evidence bundle
        if: always()
        run: |
          mkdir -p browser-evidence release-evidence artifact-upload
          zip -q -r artifact-upload/actions-evidence.zip browser-evidence release-evidence
      - name: Inspect the portable evidence bundle (diagnostic, never an approval)
        if: always()
        continue-on-error: true
        run: |
          python tools/actions_artifact_inspector.py artifact-upload/actions-evidence.zip --out release-evidence/artifact-inspection.json
      - name: Upload browser run evidence, even when blocked or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            browser-evidence/
            release-evidence/
          if-no-files-found: warn

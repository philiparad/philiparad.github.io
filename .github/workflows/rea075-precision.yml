name: REA-075 numeric precision and Fix Sci Norm
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/number-format.js'
      - 'calculator/js/decimal-core.js'
      - 'calculator/js/math-engine.js'
      - 'calculator/js/app.js'
      - 'calculator/js/setup.js'
      - 'calculator/tests/rea075-precision.cjs'
      - 'calculator/reference/rea-075/**'
      - '.github/workflows/rea075-precision.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precision:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic precision and formatting suite
        run: node calculator/tests/rea075-precision.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check browser MODE SETUP and number displays
        run: python calculator/reference/rea-075/test_precision_browser.py

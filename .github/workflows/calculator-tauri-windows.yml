name: Calculator — Windows desktop (Tauri 2)

on:
  workflow_dispatch:
  push:
    paths:
      - 'calculator/desktop/**'
      - 'calculator/index.html'
      - 'calculator/styles.css'
      - 'calculator/js/**'
      - 'calculator/tests/test_lcd_symbols.cjs'
      - 'calculator/tests/test_lcd_enhanced.cjs'
      - 'calculator/tests/test_lcd_all_screens.cjs'
      - 'calculator/tests/test_faceplate.cjs'
      - 'calculator/tests/test_lcd_visual.cjs'
      - 'calculator/tests/test_lcd_chromium_parity.cjs'
      - 'calculator/tests/compare_lcd_cross_engine.py'
      - 'calculator/tests/test_compare_lcd_cross_engine.py'
      - 'calculator/reference/**'
      - '.github/workflows/calculator-tauri-windows.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: calculator/desktop
    steps:
      - name: Check out calculator
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: calculator/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and stage calculator assets
        run: npm run check

      - name: Install Chromium for LCD screenshot checks
        run: npx playwright install chromium

      - name: Capture LCD screenshots across display scales
        run: npm run test:lcd-visual

      - name: Upload LCD visual review gallery
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calculator-lcd-visual-regression
          if-no-files-found: warn
          path: calculator/desktop/lcd-screenshots/
          retention-days: 30

      # CAL-012: use the staged offline assets in BOTH real WebView2 and
      # Chromium; compare their LCD screenshots at 1/1.25/1.5/2 DPR.
      - name: Stage CAL-012 test fixture (not packaged in installers)
        shell: pwsh
        run: Copy-Item visual-acceptance/fixture.html dist/visual-fixture.html

      - name: Install .NET 8 for native WebView2 acceptance
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Capture Chromium cross-engine reference frames
        run: node ../tests/test_lcd_chromium_parity.cjs

      - name: Capture LCD frames in real Windows WebView2
        run: dotnet run --project visual-acceptance/WebView2Capture/WebView2Capture.csproj --configuration Release -- dist lcd-cross-engine/webview2

      - name: Set up Python for image comparison
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image comparison dependency
        run: python -m pip install Pillow==11.3.0

      - name: Validate CAL-012 comparator rejects corrupted screenshots
        run: python ../tests/test_compare_lcd_cross_engine.py

      - name: Compare WebView2 and Chromium LCD appearance
        run: python ../tests/compare_lcd_cross_engine.py lcd-cross-engine

      - name: Upload CAL-012 cross-engine captures and differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-lcd-webview2-chromium-parity
          path: calculator/desktop/lcd-cross-engine/
          if-no-files-found: warn
          retention-days: 30

      - name: Build Windows NSIS and MSI installers
        run: npm run build

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fx991es-plus-windows-installers
          if-no-files-found: error
          path: |
            calculator/desktop/src-tauri/target/release/bundle/nsis/*.exe
            calculator/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

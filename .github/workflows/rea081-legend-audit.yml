name: REA-081 key legends and mode screen modifier inventory
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/keypad.js'
      - 'calculator/js/legend-audit.js'
      - 'calculator/js/model-profiles.js'
      - 'calculator/js/app.js'
      - 'calculator/styles.css'
      - 'calculator/index.html'
      - 'calculator/tests/rea081-legend-audit.cjs'
      - 'calculator/reference/rea-081/**'
      - '.github/workflows/rea081-legend-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate every physical key/legend/mode/screen combination
        run: node calculator/tests/rea081-legend-audit.cjs
      - name: Generate machine-readable JSON artifact
        run: node calculator/reference/rea-081/generate_inventory.cjs
      - name: Publish full 34650-row legend inventory as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rea081-modifier-key-inventory
          path: calculator/reference/rea-081/rea081-inventory.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify interactive modifier hints and key routing in Chromium
        run: python calculator/reference/rea-081/test_legends_browser.py

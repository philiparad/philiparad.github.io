            async function render(focus=true){if(busy)return;busy=true;try{clearBoard();if(window.MathJax?.typesetClear)MathJax.typesetClear([stage]);side();if(current===qs.length){summary();await typeset(stage);return;}let q=qs[current],s=states[current],done=complete(s),open=q.question_type==='short_answer'||q.question_type==='written';
                let o=options(q),choices=o.length?`<div class="choices" role="group" aria-label="אפשרויות תשובה">${o.map(([key,value],i)=>`<button type="button" class="choice" data-answer="${key}" aria-pressed="${s.selected===key}" ${done||s.review?'disabled':''}><bdi class="letter" dir="ltr">${q.question_type==='choice'?'ABCD'[i]:i+1}</bdi><span>${value}</span></button>`).join('')}</div>`: `<label class="answer-label" for="answer">${open?'כתבו את הנימוק שלכם':'כתבו תשובה'}</label>${open?'<textarea id="answer" maxlength="2000" placeholder="כתבו כאן את דרך החשיבה שלכם"></textarea>':'<input type="text" id="answer" maxlength="40" inputmode="numeric" dir="ltr" autocomplete="off">'}${open?'<p class="small">תשובה פתוחה נבדקת בהשוואה עצמית לפתרון, ולא באמצעות ציון אוטומטי.</p>':''}`;
                stage.innerHTML=`<span class="tag">שאלה ${current+1} מתוך ${qs.length}</span> <span class="tag">${{easy:'בסיסית',medium:'בינונית',hard:'מתקדמת'}[q.difficulty]}</span><h2 id="qTitle">${q.topic}</h2><p class="small">${data.objectives.find(o=>o.id===q.objective_id).title}</p><div class="question">${q.question}</div>${q.visual?graphMarkup(q,'activeGraph',true):''}${choices}<div class="actions">${button(open?'השוואה לפתרון':'בדיקת תשובה','check','primary')}${button('רמז נוסף','hintBtn')}${button('הצגת פתרון','reveal')}${button('ממשיכים','next','primary')}</div><div id="messages" aria-live="polite"></div>`;
                const input=$('answer');if(input){input.value=s.input;input.disabled=done||s.review;input.oninput=()=>{s.input=input.value;};input.onkeydown=e=>{if(e.key==='Enter'&&!open){e.preventDefault();submit();}};}
                stage.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{s.selected=b.dataset.answer;stage.querySelectorAll('[data-answer]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));});
                $('check').disabled=done||s.review;$('hintBtn').disabled=done||s.review||s.hints>=q.hints.length;$('reveal').disabled=done||s.review;$('next').disabled=!done;
                $('check').onclick=submit;$('hintBtn').onclick=()=>{if(busy||done||s.review||s.hints>=q.hints.length)return;s.hints++;render(false);};$('reveal').onclick=()=>{if(busy||done||s.review)return;s.revealed=true;s.status='assisted';s.feedback='הפתרון נחשף. השאלה אינה נחשבת הצלחה עצמאית.';s.kind='hint';render(false);};$('next').onclick=()=>{if(!busy&&complete(s)){current++;render();}};
                let msgs=$('messages');msgs.innerHTML=s.hints?`<div class="box hint"><h3><img class="icon" alt="" src="https://philiparad.github.io/icons/remember.png">רמזים</h3>${q.hints.slice(0,s.hints).map((h,i)=>`<p><strong>${i+1}.</strong> ${h}</p>`).join('')}</div>`:'';
                if(s.feedback)msgs.innerHTML+=`<div class="box ${s.kind}" role="status">${s.feedback}</div>`;
                if(done||s.review){msgs.innerHTML+=`<div class="box good"><h3><img class="icon" alt="" src="https://philiparad.github.io/icons/worked-example.png">פתרון מלא</h3><ol>${q.solution_steps.map(x=>`<li>${x}</li>`).join('')}</ol>${s.review?`<p>השוו כל רכיב לתשובה שלכם. אין כאן בדיקה אוטומטית.</p><ul>${(q.rubric||[]).map(r=>`<li>${r.criterion}</li>`).join('')}</ul>${button('סיימתי להשוות','reviewDone')}${button('אנסה שוב','retryOpen')}`:''}</div>`;if(s.review){$('reviewDone').onclick=()=>{if(busy)return;s.review=false;s.status='pending';s.feedback='הושלמה השוואה עצמית; התשובה לא נבדקה בידי מנוע הערכה.';s.kind='hint';render(false);};$('retryOpen').onclick=()=>{if(busy)return;s.review=false;s.revealed=true;s.feedback='הפתרון כבר נחשף; ניסיון זה נעשה בסיוע.';s.kind='hint';render(false);};}}
                if(q.visual&&window.JXG){board=makeBoard('activeGraph',q.visual,true,s.angle??q.angle??45);if($('angle')){$('angle').value=s.angle??q.angle??45;$('angleText').value=(s.angle??q.angle??45)+'°';}$('gReset').onclick=()=>{board.setBoundingBox(board.initialBox,q.visual==='circle');if(board.angleValue){s.angle=q.angle??45;board.angleValue.value=s.angle*Math.PI/180;$('angle').value=s.angle;$('angleText').value=s.angle+'°';board.update();}};$('gIn').onclick=()=>board.zoomIn();$('gOut').onclick=()=>board.zoomOut();$('gCenter').onclick=()=>board.setBoundingBox(board.initialBox,q.visual==='circle');if($('angle'))$('angle').oninput=e=>{s.angle=Number(e.target.value);board.angleValue.value=s.angle*Math.PI/180;$('angleText').value=e.target.value+'°';board.update();};}
                await typeset(stage);
            }catch(e){$('libStatus').hidden=false;$('libStatus').textContent='תקלה בהצגת השאלה. נסו לטעון מחדש.';console.error(e);}finally{busy=false;}}
            function submit(){if(busy||current>=qs.length)return;let q=qs[current],s=states[current];if(complete(s)||s.review)return;let open=['short_answer','written'].includes(q.question_type),v=options(q).length?s.selected:s.input.trim();if(!v){s.feedback='יש לבחור או להקליד תשובה לפני בדיקה.';s.kind='hint';render(false);return;}if(open){s.attempts.push({id:s.attempts.length+1,answer:v,result:'pending_review',hints:s.hints});s.review=true;s.revealed=true;s.feedback='התשובה התקבלה להשוואה עצמית.';s.kind='hint';render(false);return;}
                let ok=correct(q,v);s.attempts.push({id:s.attempts.length+1,answer:v,result:ok?'correct':'incorrect',hints:s.hints});if(ok){s.status=s.attempts.length===1&&s.hints===0&&!s.revealed?'independent':'assisted';s.feedback='נכון! קראו את ההסבר כדי להבין מדוע.';s.kind='good';}else{s.status='incorrect';s.feedback=q.distractor_feedback[v]||q.distractor_feedback.unknown||'בדקו שוב את העיקרון.';s.kind='bad';}render(false);
            }
            function summary(){let n=states.filter(s=>s.status==='independent').length, assisted=states.filter(s=>s.status==='assisted').length,pending=states.filter(s=>s.status==='pending').length;stage.innerHTML=`<h2 id="qTitle">סיימתם את מסלול התרגול!</h2><p>השלמתם 20 שאלות. סיכום זה הוא מדד לתרגול, לא הוכחה לשליטה מלאה.</p><div class="metrics"><div class="metric"><strong>${n}</strong>נכון בניסיון ראשון ללא רמז</div><div class="metric"><strong>${assisted}</strong>השלמה בסיוע</div><div class="metric"><strong>${pending}</strong>תשובות בהשוואה עצמית</div><div class="metric"><strong>${states.reduce((a,s)=>a+s.attempts.filter(t=>t.result==='incorrect').length,0)}</strong>ניסיונות שגויים</div></div><h3>המלצה לחזרה ממוקדת</h3><table class="score-table"><thead><tr><th>נושא</th><th>ראיות מתרגול</th><th>המלצה</th></tr></thead><tbody>${data.objectives.map(o=>{let a=qs.map((q,i)=>q.objective_id===o.id?states[i]:null).filter(Boolean);return `<tr><td>${o.title}</td><td>${a.filter(s=>s.status==='independent').length}/${a.length} עצמאית</td><td>${a.every(s=>s.status==='independent')?'תרגול העברה נוסף':'חזרה ממוקדת'}</td></tr>`;}).join('')}</tbody></table><p class="small">לחצו על נושא במסלול כדי לחזור להסבר ולפתרון, או התחילו מחדש לתרגול עצמאי.</p>`;}
            async function printQuiz(){if(busy||printing)return;printing=true;$('print').disabled=true;try{let a=$('printArea');if(window.MathJax?.typesetClear)MathJax.typesetClear([a]);printBoards.forEach(b=>JXG.JSXGraph.freeBoard(b));printBoards=[];a.innerHTML=qs.map((q,i)=>`<section class="print-sheet"><p class="small">פונקציות טריגונומטריות | שאלון תלמיד | טיוטה לבקרה</p><h2>שאלה ${i+1} - ${q.topic}</h2><p class="question">${q.question}</p>${q.visual?graphMarkup(q,'pg'+i,false):''}${options(q).length?`<div class="choices">${options(q).map(([k,v],j)=>`<div class="choice"><bdi dir="ltr">${q.question_type==='choice'?'ABCD'[j]:j+1}</bdi> ${v}</div>`).join('')}</div>`:''}<h3>מקום לתשובה ולדרך פתרון</h3><div class="lines"></div></section>`).join('');a.style.cssText='display:block;position:absolute;left:-10000px;top:0;width:182mm';if(window.JXG)qs.forEach((q,i)=>{if(q.visual)printBoards.push(makeBoard('pg'+i,q.visual,false,q.angle??45));});await typeset(a);a.style.cssText='';window.print();}catch(e){console.error(e);alert('לא ניתן להכין את ההדפסה.');}finally{printing=false;$('print').disabled=false;}}
            $('restart').onclick=()=>{if(!busy&&confirm('לאפס את כל התשובות וההתקדמות?'))reset();};$('print').onclick=printQuiz;
            window.addEventListener('DOMContentLoaded',()=>{if(!window.MathJax?.startup||!window.JXG){$('libStatus').hidden=false;$('libStatus').textContent='ספריות התצוגה לא נטענו. נוסחאות או גרפים עלולים להיות חסרים. בדקו את החיבור.';}reset();});
        </script>
    </body>
</html>

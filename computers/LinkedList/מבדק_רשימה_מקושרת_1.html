        const $ = (id) => document.getElementById(id);
        let index = 0;
        let correctCount = 0;
        let answered = false;
        let order = [];
        let currentOptions = [];
        let mathVersion = 0;

        // Match individual English/code terms without changing neighboring Hebrew text.
        const CODE_TERMS = /(?:Node<[^<>]+>|PrintLinkedList<[^<>]+>|GetNext\(\)|GetValue\(\)|SetNext\(\)|SetValue\(\)|HasNext\(\)|ToString\(\)|current\s*=\s*current\.GetNext\(\)|head\s*==\s*null|head\s*!=\s*null|next\s*!=\s*null|this\.[a-zA-Z]+\s*=\s*null|[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*(?:\([^()]*\))?|\bnull\b|\btrue\b|\bfalse\b)/g;
        function texEscape(s) {
            return s.replace(/\\/g, '\\\\').replace(/([{}%$#&_])/g, '\\$1');
        }
        function addMixedText(el, value) {
            const text = String(value);
            CODE_TERMS.lastIndex = 0;
            let cursor = 0;
            for (const match of text.matchAll(CODE_TERMS)) {
                if (match.index > cursor) el.appendChild(document.createTextNode(text.slice(cursor, match.index)));
                const span = document.createElement('span');
                span.className = 'inline-code';
                span.dir = 'ltr';
                span.textContent = '\\(\\text{' + texEscape(match[0]) + '}\\)';
                el.appendChild(span);
                cursor = match.index + match[0].length;
            }
            if (cursor < text.length) el.appendChild(document.createTextNode(text.slice(cursor)));
        }
        // Dynamic question content is typeset only after the MathJax library is ready.
        function mathRender() {
            const version = ++mathVersion;
            if (!window.MathJax || !window.MathJax.startup) return;
            window.MathJax.startup.promise.then(() => {
                if (version !== mathVersion || !window.MathJax.typesetPromise) return;
                return window.MathJax.typesetPromise([$('quiz')]);
            }).catch(err => console.warn('MathJax:', err));
        }
        function clearMath() {
            if (window.MathJax && window.MathJax.typesetClear) {
                window.MathJax.typesetClear([$('quiz')]);
            }
        }
        function shuffle(a) {
            const copy = a.slice();
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }
        function screen(name) {
            ['landing', 'quiz', 'result'].forEach(id => $(id).hidden = id !== name);
            window.scrollTo(0, 0);
        }
        function begin() {
            index = 0;
            correctCount = 0;
            order = shuffle(QUESTIONS.map((_, i) => i));
            screen('quiz');
            showQuestion();
        }
        function showQuestion() {
            clearMath();
            answered = false;
            const q = QUESTIONS[order[index]];
            $('counter').textContent = `שאלה ${index + 1} מתוך ${QUESTIONS.length}`;
            $('answeredCount').textContent = `${index} שאלות הושלמו`;
            $('bar').style.width = `${100 * index / QUESTIONS.length}%`;
            $('question').replaceChildren();
            addMixedText($('question'), q.question);
            const code = $('code');
            if (Array.isArray(q.code) && q.code.length > 1) {
                code.hidden = false;
                code.textContent = q.code.join('\n');
            } else if (Array.isArray(q.code) && q.code.length === 1) {
                code.hidden = true;
                // One-line code belongs in a separate inline/compact snippet.
                const line = document.createElement('span');
                line.className = 'inline-code';
                addMixedText(line, q.code[0]);
                $('question').appendChild(document.createTextNode(' '));
                $('question').appendChild(line);
            } else { code.hidden = true; code.textContent = ''; }
            $('options').replaceChildren();
            currentOptions = shuffle(q.options.map((text, originalIndex) => ({text, originalIndex})));
            currentOptions.forEach((option, i) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.type = 'button';
                btn.dataset.original = option.originalIndex;
                addMixedText(btn, option.text);
                btn.addEventListener('click', () => select(i));
                $('options').appendChild(btn);
            });
            $('feedback').hidden = true;
            $('feedback').replaceChildren();
            $('feedback').classList.remove('bad');
            $('nextBtn').disabled = true;
            $('nextBtn').textContent = index === QUESTIONS.length - 1 ? 'סיום והצגת הציון' : 'לשאלה הבאה ←';
            mathRender();
        }
        function select(pickedIndex) {
            if (answered) return;
            answered = true;
            const q = QUESTIONS[order[index]];
            const picked = currentOptions[pickedIndex].originalIndex;
            const isCorrect = picked === q.correct;
            if (isCorrect) correctCount++;
            [...$('options').children].forEach((btn, i) => {
                btn.disabled = true;
                if (currentOptions[i].originalIndex === q.correct) btn.classList.add('correct');
                if (i === pickedIndex && !isCorrect) btn.classList.add('incorrect');
            });
            const fb = $('feedback');
            fb.hidden = false;
            fb.classList.toggle('bad', !isCorrect);
            const heading = document.createElement('strong');
            heading.textContent = isCorrect ? '✅ תשובה נכונה' : '❌ תשובה שגויה';
            fb.appendChild(heading);
            const explanation = document.createElement('div');
            explanation.style.marginTop = '6px';
            addMixedText(explanation, q.explanation[picked] || '');
            fb.appendChild(explanation);
            if (!isCorrect) {
                const correctExplain = document.createElement('div');
                correctExplain.style.marginTop = '8px';
                const b = document.createElement('strong');
                b.textContent = 'הסבר לתשובה הנכונה: ';
                correctExplain.appendChild(b);
                addMixedText(correctExplain, q.explanation[q.correct] || '');
                fb.appendChild(correctExplain);
            }
            $('nextBtn').disabled = false;
            mathRender();
        }
        function next() {
            if (!answered) return;
            if (++index < QUESTIONS.length) return showQuestion();
            screen('result');
            const pct = Math.round(100 * correctCount / QUESTIONS.length);
            $('score').textContent = pct + '%';
            $('resultText').textContent = `ענית נכון על ${correctCount} מתוך ${QUESTIONS.length} שאלות.`;
        }
        $('totalLabel').textContent = `${QUESTIONS.length} שאלות, 3 אפשרויות בכל שאלה, משוב והסבר אחרי כל תשובה.`;
        $('startBtn').addEventListener('click', begin);
        $('restartBtn').addEventListener('click', begin);
        $('nextBtn').addEventListener('click', next);
    </script>

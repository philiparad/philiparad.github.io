<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#147d92">
  <meta name="description" content="Philip's personal teaching whiteboard">
  <title>Philip's Teaching Board</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="#/">▦ <span>Teaching Board<small>Philip's lesson workspace</small></span></a><span class="badge">Stage 1 · Foundation</span></header>
  <main id="app" aria-busy="true"><p>Opening your workspace…</p></main>
  <p id="status" role="status" aria-live="polite"></p>
  <noscript>This teaching application requires JavaScript.</noscript>
  <dialog id="name-dialog"><form method="dialog"><h2 id="dialog-title">Name your lesson</h2><label>Lesson title<input id="lesson-name" dir="auto" maxlength="200" required autocomplete="off"></label><div class="actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="save">Save</button></div></form></dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
</body>
</html>

name: Calculator — Windows desktop (Tauri 2)

on:
  workflow_dispatch:
  push:
    paths:
      - 'calculator/desktop/**'
      - 'calculator/index.html'
      - 'calculator/styles.css'
      - 'calculator/js/**'
      - 'calculator/reference/**'
      - '.github/workflows/calculator-tauri-windows.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: calculator/desktop
    steps:
      - name: Check out calculator
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: calculator/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and stage calculator assets
        run: npm run check

      - name: Build Windows NSIS and MSI installers
        run: npm run build

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fx991es-plus-windows-installers
          if-no-files-found: error
          path: |
            calculator/desktop/src-tauri/target/release/bundle/nsis/*.exe
            calculator/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

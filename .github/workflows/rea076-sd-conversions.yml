name: REA-076 S-D conversion and fraction states
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/result-format.js'
      - 'calculator/js/app.js'
      - 'calculator/js/exact-symbolic.js'
      - 'calculator/js/special-arithmetic.js'
      - 'calculator/js/setup.js'
      - 'calculator/tests/rea076-sd-conversions.cjs'
      - 'calculator/reference/rea-076/**'
      - '.github/workflows/rea076-sd-conversions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check symbolic/decimal/mixed fraction conversion transitions
        run: node calculator/tests/rea076-sd-conversions.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test physical DOM-key S-D transitions
        run: python calculator/reference/rea-076/test_sd_browser.py

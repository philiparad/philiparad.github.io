name: REA-100 standalone calculator release parity
on:
  push:
    branches: [main]
    paths:
      - 'calculator/index.html'
      - 'calculator/styles.css'
      - 'calculator/js/**'
      - 'calculator/reference/rea-008/capabilities.json'
      - 'calculator/fx991_fresh_standalone.html'
      - 'calculator/tools/build_standalone.py'
      - 'calculator/tests/test_rea100_standalone.py'
      - 'calculator/tests/rea100_browser_parity.py'
      - 'calculator/tests/rea097-stack-precedence.cjs'
      - 'calculator/tests/rea105-decimal-precedence.cjs'
      - 'calculator/tests/rea105_browser_precedence.py'
      - 'calculator/tests/rea106-stat-stability.cjs'
      - 'calculator/tests/rea106_browser_stat_stability.py'
      - 'calculator/tests/rea113-key-screen-contract.cjs'
      - 'calculator/tests/rea113_browser_mode_keys.py'
      - 'calculator/tests/plus003-mode-transitions.py'
      - 'calculator/tests/plus004-shift-menu-keys.py'
      - 'calculator/tests/plus005-alpha-key-actions.py'
      - 'calculator/tests/plus006-eqn-expressions.cjs'
      - 'calculator/tests/plus006-eqn-browser.py'
      - 'calculator/tests/plus007-error-contract.cjs'
      - 'calculator/tests/plus007-error-browser.py'
      - 'calculator/tests/plus008-stat-format.cjs'
      - 'calculator/tests/plus008-stat-browser.py'
      - 'calculator/tests/plus001-single-model.cjs'
      - 'calculator/tests/plus002-no-retired-runtime.cjs'
      - '.github/workflows/rea100-standalone-sync.yml'
  pull_request:
    paths:
      - 'calculator/index.html'
      - 'calculator/styles.css'
      - 'calculator/js/**'
      - 'calculator/reference/rea-008/capabilities.json'
      - 'calculator/fx991_fresh_standalone.html'
      - 'calculator/tools/build_standalone.py'
      - 'calculator/tests/test_rea100_standalone.py'
      - 'calculator/tests/rea100_browser_parity.py'
      - 'calculator/tests/rea097-stack-precedence.cjs'
      - 'calculator/tests/rea105-decimal-precedence.cjs'
      - 'calculator/tests/rea105_browser_precedence.py'
      - 'calculator/tests/rea106-stat-stability.cjs'
      - 'calculator/tests/rea106_browser_stat_stability.py'
      - 'calculator/tests/rea113-key-screen-contract.cjs'
      - 'calculator/tests/rea113_browser_mode_keys.py'
      - 'calculator/tests/plus003-mode-transitions.py'
      - 'calculator/tests/plus004-shift-menu-keys.py'
      - 'calculator/tests/plus005-alpha-key-actions.py'
      - 'calculator/tests/plus006-eqn-expressions.cjs'
      - 'calculator/tests/plus006-eqn-browser.py'
      - 'calculator/tests/plus007-error-contract.cjs'
      - 'calculator/tests/plus007-error-browser.py'
      - 'calculator/tests/plus008-stat-format.cjs'
      - 'calculator/tests/plus008-stat-browser.py'
      - 'calculator/tests/plus001-single-model.cjs'
      - 'calculator/tests/plus002-no-retired-runtime.cjs'
      - '.github/workflows/rea100-standalone-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile release scripts
        run: |
          python -m py_compile calculator/tools/build_standalone.py calculator/tests/test_rea100_standalone.py calculator/tests/rea100_browser_parity.py calculator/tests/rea105_browser_precedence.py calculator/tests/rea106_browser_stat_stability.py calculator/tests/rea113_browser_mode_keys.py calculator/tests/plus003-mode-transitions.py calculator/tests/plus004-shift-menu-keys.py calculator/tests/plus005-alpha-key-actions.py calculator/tests/plus006-eqn-browser.py calculator/tests/plus007-error-browser.py calculator/tests/plus008-stat-browser.py
      - name: Fail on stale standalone, missing modules, CSS or manifest drift
        run: |
          python calculator/tools/build_standalone.py --check
          python -m unittest discover -v -s calculator/tests -p 'test_rea100_standalone.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PLUS-only arithmetic, model identity and key contracts
        run: |
          node calculator/tests/plus008-stat-format.cjs
          node calculator/tests/plus007-error-contract.cjs
          node calculator/tests/plus006-eqn-expressions.cjs
          node calculator/tests/plus001-single-model.cjs
          node calculator/tests/plus002-no-retired-runtime.cjs
          node calculator/tests/rea097-stack-precedence.cjs
          node calculator/tests/rea105-decimal-precedence.cjs
          node calculator/tests/rea106-stat-stability.cjs
          node calculator/tests/rea113-key-screen-contract.cjs
      - name: Install Chromium and browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify modular and standalone keypad, model and result behavior
        run: python calculator/tests/rea100_browser_parity.py
      - name: Verify PLUS arithmetic precedence using actual browser keypad
        run: python calculator/tests/rea105_browser_precedence.py
      - name: Verify live STAT summary and protected Sum fields in both publications
        run: python calculator/tests/rea106_browser_stat_stability.py
      - name: Verify PLUS physical MODE keys and EQN types 1-4
        run: python calculator/tests/rea113_browser_mode_keys.py
      - name: PLUS-003 eight-mode selection, editor return, cancel and SETUP
        run: python calculator/tests/plus003-mode-transitions.py
      - name: PLUS-004 shifted numeric key menus and mode stability
        run: python calculator/tests/plus004-shift-menu-keys.py
      - name: PLUS-005 ALPHA key and input-context restrictions
        run: python calculator/tests/plus005-alpha-key-actions.py
      - name: PLUS-006 mathematical EQN coefficient input and cursor editing
        run: python calculator/tests/plus006-eqn-browser.py
      - name: PLUS-007 error messages and caret recovery with physical keys
        run: python calculator/tests/plus007-error-browser.py
      - name: PLUS-008 STAT FREQ clearing and regression-type retention
        run: python calculator/tests/plus008-stat-browser.py

const sections=[

 ['משולש — סכום זוויות','סכום הזוויות הפנימיות בכל משולש הוא \\(180^\\circ\\).','חשוב'],
 ['משולש שווה שוקיים','זוויות הבסיס שוות. גם ההפך נכון: אם שתי זוויות שוות — הצלעות שמולן שוות.'],
 ['ישרים מקבילים','זוויות מתאימות ומתחלפות שוות; זוויות חד־צדדיות משלימות ל־\\(180^\\circ\\).','חשוב'],
 ['מקבילית','שני זוגות של צלעות נגדיות מקבילות. צלעות וזוויות נגדיות שוות; האלכסונים חוצים זה את זה.'],
 ['מלבן','מקבילית שכל זוויותיה ישרות; אלכסוניה שווים וחוצים זה את זה.'],

 ['טרפז — הגדרה','מרובע שבו בדיוק זוג אחד של צלעות נגדיות מקבילות. אלה הן הבסיסים; שתי הצלעות האחרות הן השוקיים.','חשוב'],
 ['טרפז — זוויות','סכום שתי הזוויות הסמוכות לאותה שוק הוא \\(180^\\circ\\), מפני שהבסיסים מקבילים.'],
 ['טרפז שווה שוקיים','השוקיים שוות, כל זוג זוויות ליד אותו בסיס שוות, והאלכסונים שווים.','חשוב'],
 ['טרפז ישר זווית','שוק אחת מאונכת לבסיסים, ולכן יש בטרפז שתי זוויות ישרות.'],
 ['גובה הטרפז','הגובה הוא המרחק המאונך בין שני הבסיסים המקבילים — לא בהכרח אורך של שוק.','טעות נפוצה'],
 ['אלכסונים בטרפז','אלכסוני טרפז כללי אינם בהכרח שווים ואינם בהכרח חוצים זה את זה.','טעות נפוצה']
 ]},
 {id:'midtri',title:'02 · קטע אמצעים במשולש',subtitle:'כרך א׳, עמודים 438–446',notes:[
 ['הגדרת קטע אמצעים','קטע המחבר את אמצעי שתי צלעות במשולש.'],
 ['משפט קטע האמצעים','קטע האמצעים מקביל לצלע השלישית, ואורכו מחצית ממנה: \\(DE\\parallel BC,\\quad DE=\\frac{BC}{2}\\).','חשוב'],
 ['המשפט ההפוך','ישר העובר באמצע צלע אחת ומקביל לצלע שנייה — חותך את הצלע השלישית באמצעה.','חשוב'],
 ['זיהוי נכון','מקבילות לבדה אינה מוכיחה שקיים קטע אמצעים; צריך גם נתון על נקודת אמצע.','טעות נפוצה']
 ]},
 {id:'midtrap',title:'03 · קטע אמצעים בטרפז',subtitle:'כרך א׳, עמודים 447–451',notes:[
 ['הגדרת קטע אמצעים','קטע המחבר בין אמצעי שתי השוקיים של הטרפז.'],
 ['מקבילות לבסיסים','קטע האמצעים בטרפז מקביל לשני הבסיסים.','חשוב'],
 ['אורך קטע האמצעים','אורכו הוא ממוצע אורכי הבסיסים: \\[m=\\frac{a+b}{2}\\]','חשוב'],
 ['לא מחצית ההפרש','בטרפז משתמשים ב<strong>מחצית סכום</strong> הבסיסים, ולא במחצית הפרשם.','טעות נפוצה']
 ]},
 {id:'medians',title:'04 · מפגש התיכונים במשולש',subtitle:'כרך א׳, עמוד 452 ואילך',notes:[
 ['תיכון במשולש','קטע המחבר קודקוד עם אמצע הצלע שמולו.'],
 ['שלושת התיכונים','שלושת התיכונים במשולש נפגשים בנקודה אחת, הנקראת מרכז הכובד.','חשוב'],
 ['יחס החלוקה','מרכז הכובד מחלק כל תיכון ביחס \\(2:1\\) מן הקודקוד: \\[AG:GD=2:1\\]','חשוב'],
 ['תיכון אינו בהכרח גובה','תיכון מחלק את הצלע שמולו לשניים; הוא אינו בהכרח מאונך לה.','טעות נפוצה']
 ]},
 {id:'graph',title:'05 · קדם־אנליזה — שרטוט גרף לפי נתונים',subtitle:'חוברת קדם־אנליזה, עמוד 18 ואילך',notes:[
 ['נקודת חיתוך עם ציר \\(y\\)','מציבים \\(x=0\\) ומוצאים את הנקודה \\((0,f(0))\\).'],
 ['חיתוך עם ציר \\(x\\)','פותרים \\(f(x)=0\\). כל פתרון ממשי מייצג נקודת חיתוך או השקה לציר.','חשוב'],
 ['עלייה וירידה','בעלייה, כאשר \\(x\\) גדל גם \\(f(x)\\) גדל; בירידה, כאשר \\(x\\) גדל \\(f(x)\\) קטן.'],
 ['נקודות קיצון','במקסימום מקומי הגרף עובר מעלייה לירידה; במינימום מקומי מירידה לעלייה.'],
 ['חיוביות ושליליות','\\(f(x)>0\\) כשגרף הפונקציה מעל ציר \\(x\\), ו־\\(f(x)<0\\) כשהוא מתחתיו.','חשוב'],
 ['שרטוט לפי נתונים','מסמנים חיתוכים וקיצון, בודקים תחומי עלייה/ירידה וסימן, ואז מחברים בהתאם לנתונים.'],
 ['נקודת אפס לעומת קיצון','לא כל נקודת אפס היא קיצון, ולא כל נקודת קיצון נמצאת על ציר \\(x\\).','טעות נפוצה']
 ]},
 {id:'powers',title:'06 · קדם־אנליזה — פונקציות עם מעריך טבעי',subtitle:'הרחבה לימודית: פונקציות חזקה מהצורה \(f(x)=x^n\)',notes:[
 ['הגדרת פונקציית חזקה','פונקציה מהצורה \(f(x)=x^n\), כאשר \(n\) מספר טבעי חיובי: \(1,2,3,\ldots\).','חשוב'],
 ['תחום ההגדרה','לכל מעריך טבעי חיובי \(n\), הפונקציה \(f(x)=x^n\) מוגדרת לכל \(x\) ממשי.'],
 ['מעריך זוגי — סימטריה','אם \(n\) זוגי, אז \(f(-x)=f(x)\): הגרף סימטרי לציר \(y\).','חשוב'],
 ['מעריך אי־זוגי — סימטריה','אם \(n\) אי־זוגי, אז \(f(-x)=-f(x)\): הגרף סימטרי לראשית הצירים.','חשוב'],
 ['מעריך זוגי — סימן וקיצון','עבור \(n\) זוגי: \(x^n\ge 0\) לכל \(x\). בראשית \((0,0)\) יש מינימום מוחלט.'],
 ['מעריך אי־זוגי — סימן','עבור \(n\) אי־זוגי: סימן \(x^n\) זהה לסימן \(x\); הגרף עובר דרך הראשית ומחליף בה סימן.'],
 ['תחומי עלייה וירידה','כש־\(n\) זוגי, הפונקציה יורדת עבור \(x<0\) ועולה עבור \(x>0\). כש־\(n\) אי־זוגי, היא עולה בכל התחום.','חשוב'],
 ['נקודות משותפות','כל הגרפים \(y=x^n\), עבור \(n\ge1\), עוברים דרך \((0,0)\) ו־\((1,1)\). גם \((-1,1)\) כאשר \(n\) זוגי, או \((-1,-1)\) כאשר \(n\) אי־זוגי.'],
 ['השוואת חזקות','כאשר \(0<x<1\), הגדלת \(n\) מקטינה את \(x^n\); כאשר \(x>1\), הגדלת \(n\) מגדילה את \(x^n\).'],
 ['מעריך לעומת בסיס','\(x^n\) היא פונקציית חזקה; \(n^x\) היא פונקציה מעריכית — אלה שתי משפחות שונות.','טעות נפוצה'],
 ['לא כל החזקות נראות כמו פרבולה','\(x^2\) ו־\(x^4\) סימטריות לציר \(y\), אך אינן אותו גרף. \(x^3\) אינה פרבולה.','טעות נפוצה']
 ]},
 {id:'poly',title:'07 · קדם־אנליזה — פולינום',subtitle:'חוברת קדם־אנליזה, עמוד 32 ואילך',notes:[
 ['מהו פולינום?','סכום סופי של חזקות שלמות אי־שליליות של \\(x\\): \\[p(x)=a_nx^n+\\cdots+a_1x+a_0\\]'],
 ['מעלת הפולינום','המעריך הגדול ביותר בעל מקדם שאינו אפס. למשל, המעלה של \\(3x^4-2x+1\\) היא \\(4\\).'],
 ['תחום הגדרה','כל פולינום מוגדר לכל מספר ממשי: \\(x\\in\\mathbb{R}\\).','חשוב'],
 ['אפסי פולינום','שורשים הם ערכי \\(x\\) המקיימים \\(p(x)=0\\). אם \\(p(x)=(x-a)q(x)\\), אז \\(a\\) הוא שורש.'],
 ['התנהגות בקצוות','האיבר בעל החזקה הגבוהה ביותר קובע את התנהגות הפולינום כש־\\(x\\) גדול מאוד בערכו המוחלט.','חשוב'],
 ['שורש כפול','למשל \\(p(x)=(x-2)^2\\): הגרף נוגע בציר \\(x\\) ב־\\(x=2\\), ואינו מחליף סימן שם.'],
 ['כלל חשוב לשרטוט','גרף פולינום רציף: אין בו קפיצות, חורים או אסימפטוטות אנכיות.']
 ]},
 {id:'shift',title:'08 · קדם־אנליזה — הזזה אנכית',subtitle:'חוברת קדם־אנליזה, עמוד 64 ואילך',notes:[
 ['הזזה למעלה','אם \\(g(x)=f(x)+c\\) ו־\\(c>0\\), הגרף של \\(g\\) מתקבל מהזזת \\(f\\) למעלה ב־\\(c\\) יחידות.','חשוב'],
 ['הזזה למטה','אם \\(g(x)=f(x)-c\\) ו־\\(c>0\\), הגרף של \\(g\\) מתקבל מהזזת \\(f\\) למטה ב־\\(c\\) יחידות.'],
 ['שינוי הקואורדינטות','כל נקודה \\((x,y)\\) עוברת ל־\\((x,y+c)\\) תחת \\(g(x)=f(x)+c\\).'],
 ['מה אינו משתנה?','ערכי \\(x\\) של נקודות הקיצון ותחומי העלייה והירידה נשארים זהים בהזזה אנכית.','חשוב'],
 ['נקודות חיתוך חדשות','חיתוך עם ציר \\(y\\) משתנה ל־\\((0,f(0)+c)\\); חיתוך עם ציר \\(x\\) מחייב לפתור \\(f(x)+c=0\\).'],

if(search)search.addEventListener('input',renderBoard);if(clearBtn&&search)clearBtn.addEventListener('click',()=>{search.value='';active='all';makeTabs();renderBoard();search.focus()});window.renderBoard=renderBoard;makeTabs();renderBoard();

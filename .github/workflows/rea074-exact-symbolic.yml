name: REA-074 exact radical and pi expression results
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/exact-symbolic.js'
      - 'calculator/js/result-format.js'
      - 'calculator/js/math-engine.js'
      - 'calculator/js/rational.js'
      - 'calculator/js/app.js'
      - 'calculator/index.html'
      - 'calculator/tests/rea074-exact-symbolic.cjs'
      - 'calculator/reference/rea-074/**'
      - '.github/workflows/rea074-exact-symbolic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-mathio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact radical and pi source-based arithmetic regression
        run: node calculator/tests/rea074-exact-symbolic.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Physical DOM key path and display conversion checks
        run: python calculator/reference/rea-074/test_exact_browser.py

דעת איך המחלקה בנויה מבפנים.", "queue": null, "code": null, "challenge": false}, {"title": "אתגר: רצף פעולות", "topic": "יישום עצמאי", "page": 7, "explain": "כעת תשתמש במה שלמדת. חשוב לעקוב אחרי מצב התור <b>לאחר כל פקודה<\/b>.", "question": "מהו הערך שיודפס?", "options": [["a", "10"], ["b", "20"], ["c", "30"]], "right": "b", "hint": "אחרי Remove הראשונה הראש משתנה. Head בודקת את הראש החדש.", "wrong": "לאחר הוצאת 10, הראש החדש הוא 20; לכן Head מחזירה 20.", "good": "נכון. 20 הוא כעת ראש התור.", "queue": [10, 20, 30], "code": "q.Insert(10);\nq.Insert(20);\nq.Insert(30);\nq.Remove();\nConsole.WriteLine(q.Head());", "challenge": true}, {"title": "אתגר: מתי התור ריק?", "topic": "יישום עצמאי", "page": 6, "explain": "הפעולה <code dir=\"ltr\">IsEmpty()<\/code> מושפעת מהפעולות הקודמות על התור. חשוב לעקוב אחרי מספר האיברים.", "question": "מה תהיה התוצאה של IsEmpty בסוף?", "options": [["a", "true"], ["b", "false"], ["c", "לא ניתן לדעת"]], "right": "a", "hint": "הוספת איבר אחד והוצאת איבר אחד משאירות כמה איברים?", "wrong": "לאחר הכנסת 6 והוצאתו אין בתור איברים, ולכן התוצאה true.", "good": "נכון. התור חזר להיות ריק.", "queue": [], "code": "Queue<int> q = new Queue<int>();\nq.Insert(6);\nq.Remove();\nConsole.WriteLine(q.IsEmpty());", "challenge": true}, {"title": "אתגר סיום: מי נשאר ראשון?", "topic": "יישום עצמאי", "page": 7, "explain": "במבחן הסיום הקצר, שלב בין פעולות <code dir=\"ltr\">Insert<\/code>, <code dir=\"ltr\">Remove<\/code> ו־<code dir=\"ltr\">Head<\/code>.", "question": "מה יודפס בשורה האחרונה?", "options": [["a", "4"], ["b", "7"], ["c", "9"]], "right": "b", "hint": "עקוב אחרי התור: אחרי הוצאת 4, מי יהיה בראש? הוספה חדשה מתבצעת רק בסוף.", "wrong": "Remove מוציאה את 4. הוספת 9 אינה משנה את הראש; 7 נשאר ראשון.", "good": "נכון. התוצאה היא 7 — הבנת את סדר הפעולות של התור.", "queue": null, "code": "q.Insert(4);\nq.Insert(7);\nq.Remove();\nq.Insert(9);\nConsole.WriteLine(q.Head());", "challenge": true}]</script>
        <script>
            (() => {
                'use strict';
                const stages = JSON.parse(document.getElementById('stageData').textContent);
                let stage = 0;
                let answered = false;
                let mistakes = 0;
                let hints = 0;
                let firstTry = 0;
                let usedHelp = false;
                let stepWrong = false;
                const $ = id => document.getElementById(id);
                const typeset = () => { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise().catch(() => {}); };
                function make(tag, className, content) {
                    const element = document.createElement(tag);
                    if (className) element.className = className;
                    if (content !== undefined) element.textContent = content;
                    return element;
                }
                function renderQueue(values) {
                    const d = make('div', 'diagram');
                    if (values.length === 0) {
                        d.append(make('div','empty','∅ התור ריק — אין איברים'));
                        return d;
                    }
                    const caps = make('div', 'end-labels');
                    caps.append(make('span','','ראש התור — first / Remove'),make('span','','סוף התור — last / Insert'));
                    const cells = make('div','queue-cells');
                    values.forEach((v,i) => {
                        if(i) cells.append(make('span','qarr','→'));
                        cells.append(make('div','qcell',String(v)));
                    });
                    d.append(caps,cells);
                    d.setAttribute('role','img');
                    d.setAttribute('aria-label', 'תור מראש לסוף: '+values.join(', '));
                    return d;
                }
                function show() {
                    answered=false; usedHelp=false; stepWrong=false;
                    $('feedback').className='feedback hide';
                    $('feedback').textContent='';
                    $('retry').classList.add('hide');
                    $('next').classList.add('hide');
                    $('next').textContent='ממשיכים ←';
                    $('hint').classList.remove('hide');
                    const s=stages[stage];
                    $('stageTitle').textContent=s.title;
                    $('topicPill').textContent='📘 '+s.topic;
                    $('pagePill').textContent='עמוד '+s.page;
                    const c=$('content'); c.replaceChildren();
                    const explain=make('div','lead'); explain.innerHTML=s.explain;
                    c.append(explain);
                    if (s.queue !== null) c.append(renderQueue(s.queue));
                    if (s.code) c.append(make('pre','',s.code));
                    const question=make('div','question');
                    question.append(make('strong','',s.question));
                    const choices=make('div','choices');choices.id='choices';
                    s.options.forEach(([id,label],i) => {
                        const b=make('button','choice'); b.type='button'; b.dataset.answer=id;
                        b.append(make('span','key',String(i+1)));
                        b.append(make('span','',label));
                        b.addEventListener('click',()=>choose(id,b));
                        choices.append(b);
                    });
                    question.append(choices);c.append(question);
                    const pct=Math.round(stage/stages.length*100);
                    $('bar').style.width=pct+'%';
                    $('progress').setAttribute('aria-valuenow',String(pct));
                    $('progressLabel').textContent='שלב '+(stage+1)+' מתוך '+stages.length+' · '+pct+'% הושלמו';
                    $('steps').replaceChildren();
                    stages.forEach((item,i) => {
                        const line=make('div','step'+(i===stage?' current':''));
                        line.append(make('span','symbol',i<stage?'✅':i===stage?'🔵':'◯'));
                        line.append(make('span','',item.title));
                        $('steps').append(line);
                    });
                    typeset();
                }
                function feedback(good,title,body) {
                    const f=$('feedback');f.className='feedback'+(good?' good':'');
                    f.replaceChildren(make('b','',title),make('div','',body));
                }
                function choose(id,button) {
                    if (answered) return;
                    const s=stages[stage];
                    if (id===s.right) {
                        answered=true;
                        if(!stepWrong && !usedHelp)firstTry++;
                        feedback(true,'✅ תשובה נכונה!',s.good);
                        $('hint').classList.add('hide');$('retry').classList.add('hide');
                        $('next').classList.remove('hide');
                        document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);
                        button.classList.add('selected-good');
                        $('next').focus();
                    } else {
                        mistakes++;stepWrong=true;
                        feedback(false,'🧩 ננסה לחשוב שוב',s.wrong);
                        $('retry').classList.remove('hide');
                    }
                }
                $('hint').addEventListener('click',()=>{
                    if(answered)return;
                    hints++;usedHelp=true;
                    feedback(false,'💡 רמז',stages[stage].hint.replace(/<[^>]*>/g,''));
                });
                $('retry').addEventListener('click',()=>{
                    $('retry').classList.add('hide');
                    $('feedback').className='feedback hide';
                    const first=$('choices').querySelector('button');if(first)first.focus();
                });
                $('next').addEventListener('click',()=>{
                    if(stage===stages.length){stage=0;mistakes=0;hints=0;firstTry=0;show();return;}
                    if(!answered)return;
                    stage++;
                    if(stage<stages.length){show();$('stageTitle').focus();return;}
                    finish();
                });
                function finish() {
                    $('stageTitle').textContent='🎉 השלמת את המסלול!';
                    $('topicPill').textContent='סיכום';$('pagePill').textContent='עמודים 1–10';
                    $('content').replaceChildren();
                    const summary=make('div','result-summary');
                    summary.innerHTML='<h3>מה למדנו?</h3><p>תור הוא מבנה סדור, הפועל לפי FIFO: הראשון שנכנס הוא הראשון שיוצא. Insert מוסיפה לסוף; Remove מוציאה ומחזירה מהראש; Head קוראת את הראש בלי להסיר; IsEmpty בודקת האם התור ריק.</p><p>המחלקה Queue&lt;T&gt; נלמדת דרך פעולותיה הציבוריות, בלי צורך להכיר בשלב זה את המימוש הפנימי (ADT).</p>';
                    $('content').append(summary);
                    const metrics=make('div');
                    [[String(firstTry)+'/'+stages.length,'נכון בלי רמז או שגיאה'],[String(mistakes),'בחירות שגויות'],[String(hints),'רמזים שנלקחו']].forEach(([n,l])=>{
                        const item=make('div','metric');item.append(make('b','',n),make('span','',l));metrics.append(item);
                    });
                    $('content').append(metrics);
                    $('content').append(make('p','small','השלמת המסלול אינה הוכחה לשליטה מלאה בחומר. הנתונים נשמרים בזיכרון הדף בלבד, אינם נשלחים ואינם נשמרים לאחר רענון.'));
                    $('feedback').className='feedback good';$('feedback').textContent='סיימת את כל השאלות. ניתן להתחיל שוב ולתרגל באופן עצמאי.';
                    $('hint').classList.add('hide');$('retry').classList.add('hide');
                    $('next').classList.remove('hide');$('next').textContent='🔄 התחל מחדש';
                    $('bar').style.width='100%';$('progress').setAttribute('aria-valuenow','100');
                    $('progressLabel').textContent=stages.length+' מתוך '+stages.length+' שלבים הושלמו · 100%';
                    $('steps').replaceChildren(...stages.map(s=>{const d=make('div','step');d.append(make('span','symbol','✅'),make('span','',s.title));return d;}));
                    $('next').focus();
                }
                show();
            })();
        </script>
    </body>
</html>

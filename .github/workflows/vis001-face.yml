name: VIS-001 Windows emulator face verification
on:
  push:
    paths:
      - 'calculator/**'
      - '.github/workflows/vis001-face.yml'
  pull_request:
    paths:
      - 'calculator/**'
      - '.github/workflows/vis001-face.yml'
  workflow_dispatch:
jobs:
  visual-face:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated standalone matches source
        run: python3 calculator/tools/build_standalone.py --check
      - name: Install browser
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Run browser face geometry, typography, color and pixel-parity tests
        run: python3 calculator/tests/vis001_face_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vis001-calculator-face-pngs
          path: /tmp/vis001-face-evidence
          if-no-files-found: warn

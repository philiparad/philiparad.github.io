name: REA-084 original STAT Distr P Q R normalized t
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/stat-normal.js'
      - 'calculator/js/stat-regression.js'
      - 'calculator/js/app.js'
      - 'calculator/index.html'
      - 'calculator/tests/rea084-stat-normal.cjs'
      - 'calculator/reference/rea-084/**'
      - '.github/workflows/rea084-stat-distr.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-stat-distr:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original STAT 1-VAR normal distribution and validation
        run: node calculator/tests/rea084-stat-normal.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run STAT physical-key / menu / result / model browser traces
        run: python calculator/reference/rea-084/test_stat_distr_browser.py

name: REA-011 natural result formatting
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/result-format.js'
      - 'calculator/js/app.js'
      - 'calculator/js/display.js'
      - 'calculator/index.html'
      - 'calculator/fx991_fresh_standalone.html'
      - 'calculator/reference/rea-011/**'
      - '.github/workflows/rea011-results.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  results:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test environment
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify real button sequences in modular and standalone calculators
        run: python calculator/reference/rea-011/test_natural_results_browser.py
      - name: Capture candidate REA-006 web LCD baseline for explicit review
        run: |
          python -m pip install Pillow
          python calculator/reference/rea-006/lcd_golden.py --out /tmp/rea011-candidate --capture-only
      - name: Preserve candidate baseline without auto-approving changes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea011-lcd-candidate-for-review
          path: |
            /tmp/rea011-candidate/web-golden.candidate.json
            /tmp/rea011-candidate/captured.json
          if-no-files-found: warn

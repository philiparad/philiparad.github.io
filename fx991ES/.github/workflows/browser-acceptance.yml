name: Cross-browser acceptance — M35
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'styles.css'
      - 'index.html'
      - 'tools/**'
      - '.github/workflows/browser-acceptance.yml'
jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local calculator regression suite
        run: node tests/run-node.cjs
      - name: Validate browser evidence gate
        run: python -m unittest discover -s tools/tests -v
      - name: Install browser testing dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Run actual browser matrix
        run: python tools/browser_matrix.py --out browser-evidence
      - name: Upload browser run evidence, even when blocked or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: browser-evidence/
          if-no-files-found: warn

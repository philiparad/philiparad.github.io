permissions:
  contents: read
jobs:
  standalone-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile release scripts
        id: plus038_check_01
        continue-on-error: true
        run: |
          python -m py_compile calculator/tools/build_standalone.py calculator/tests/test_rea100_standalone.py calculator/tests/rea100_browser_parity.py calculator/tests/rea105_browser_precedence.py calculator/tests/rea106_browser_stat_stability.py calculator/tests/rea113_browser_mode_keys.py calculator/tests/plus003-mode-transitions.py calculator/tests/plus004-shift-menu-keys.py calculator/tests/plus005-alpha-key-actions.py calculator/tests/plus006-eqn-browser.py calculator/tests/plus007-error-browser.py calculator/tests/plus008-stat-browser.py calculator/tests/plus009-menu-browser.py calculator/tests/plus010-matrix-browser.py calculator/tests/plus011-vector-browser.py calculator/tests/plus012-stat-browser.py calculator/tests/plus013-table-browser.py calculator/tests/plus025-keyboard-browser.py calculator/tests/plus026-matrix-browser.py calculator/tests/test_plus028_hardware_evidence.py calculator/tools/plus028_compare_hardware.py calculator/tools/plus028_reference_report.py calculator/tests/plus028-reference-browser.py calculator/tests/plus033-key-functions-browser.py calculator/tests/plus034-memory-dms-setup-browser.py calculator/tests/plus035-constants-stat-table-browser.py calculator/tests/plus036-matrix-vector-eqn-browser.py calculator/tests/plus037-numeric-browser.py
      - name: Install PNG comparison dependency
        run: python -m pip install Pillow==11.3.0
      - name: PLUS-028 verify evidence comparator and report explicitly blocked hardware status
        id: plus038_check_02
        continue-on-error: true
        run: |
          python -m unittest -v calculator/tests/test_plus028_hardware_evidence.py
          python calculator/tools/plus028_compare_hardware.py --manifest calculator/reference/plus-028/hardware-evidence.json --report /tmp/plus028-evidence-report.json
          python -c "import json; p=json.load(open('/tmp/plus028-evidence-report.json')); assert p['status']=='BLOCKED_NO_DEVICE_EVIDENCE'; assert not p['native_hardware_parity_certified']"
      - name: Fail on stale standalone, missing modules, CSS or manifest drift
        id: plus038_check_03
        continue-on-error: true
        run: |
          python calculator/tools/build_standalone.py --check
          python -m unittest discover -v -s calculator/tests -p 'test_rea100_standalone.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PLUS-only arithmetic, model identity and key contracts
        id: plus038_check_04
        continue-on-error: true
        run: |
          node calculator/tests/plus009-menu-rules.cjs
          node calculator/tests/plus008-stat-format.cjs
          node calculator/tests/plus007-error-contract.cjs
          node calculator/tests/plus013-table-boundaries.cjs
          node calculator/tests/plus014-lcd-raster.cjs
          node calculator/tests/plus015-mathio-templates.cjs
          node calculator/tests/plus016-lineio-unit.cjs
          node calculator/tests/plus017-precision-boundaries.cjs
          node calculator/tests/plus018-symbolic-corpus.cjs
          node calculator/tests/plus019-base-n-contract.cjs
          node calculator/tests/plus020-cmplx-contract.cjs
          node calculator/tests/plus021-solve-calc-contract.cjs
          node calculator/tests/plus022-constants-catalog.cjs
          node calculator/tests/plus023-metric-conversions.cjs
          node calculator/tests/plus024-dms-angle-contract.cjs
          node calculator/tests/plus025-keyboard-focus.cjs
          node calculator/tests/plus026-full-key-matrix.cjs
          node calculator/tests/plus028-casio-manual-examples.cjs
          node calculator/tests/plus032-independent-oracles.cjs
          node calculator/tests/plus037-numeric-worker.cjs
          node calculator/tests/plus029-ci-integrity.cjs
          node calculator/tests/plus012-stat-edit.cjs
          node calculator/tests/plus011-vector-expressions.cjs
          node calculator/tests/plus006-eqn-expressions.cjs
          node calculator/tests/plus001-single-model.cjs
          node calculator/tests/plus002-no-retired-runtime.cjs
          node calculator/tests/rea097-stack-precedence.cjs
          node calculator/tests/rea105-decimal-precedence.cjs
          node calculator/tests/rea106-stat-stability.cjs
          node calculator/tests/rea113-key-screen-contract.cjs
      - name: PLUS-028 ALT manufacturer-reference conformance report
        id: plus038_check_05
        continue-on-error: true
        run: python calculator/tools/plus028_reference_report.py --report /tmp/plus028-reference-report.json
      - name: Upload reproducible reference-conformance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plus028-reference-conformance
          path: /tmp/plus028-reference-report.json
          if-no-files-found: warn
      - name: Install Chromium and browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify modular and standalone keypad, model and result behavior
        id: plus038_check_06
        continue-on-error: true
        run: python calculator/tests/rea100_browser_parity.py
      - name: Verify PLUS arithmetic precedence using actual browser keypad
        id: plus038_check_07
        continue-on-error: true
        run: python calculator/tests/rea105_browser_precedence.py
      - name: Verify live STAT summary and protected Sum fields in both publications
        id: plus038_check_08
        continue-on-error: true
        run: python calculator/tests/rea106_browser_stat_stability.py
      - name: Verify PLUS physical MODE keys and EQN types 1-4
        id: plus038_check_09
        continue-on-error: true
        run: python calculator/tests/rea113_browser_mode_keys.py
      - name: PLUS-003 eight-mode selection, editor return, cancel and SETUP
        id: plus038_check_10
        continue-on-error: true
        run: python calculator/tests/plus003-mode-transitions.py
      - name: PLUS-004 shifted numeric key menus and mode stability
        id: plus038_check_11
        continue-on-error: true
        run: python calculator/tests/plus004-shift-menu-keys.py
      - name: PLUS-005 ALPHA key and input-context restrictions
        id: plus038_check_12
        continue-on-error: true
        run: python calculator/tests/plus005-alpha-key-actions.py
      - name: PLUS-006 mathematical EQN coefficient input and cursor editing
        id: plus038_check_13
        continue-on-error: true
        run: python calculator/tests/plus006-eqn-browser.py
      - name: PLUS-007 error messages and caret recovery with physical keys
        id: plus038_check_14
        continue-on-error: true
        run: python calculator/tests/plus007-error-browser.py
      - name: PLUS-008 STAT FREQ clearing and regression-type retention
        id: plus038_check_15
        continue-on-error: true
        run: python calculator/tests/plus008-stat-browser.py
      - name: PLUS-009 menu paging numbers nested cancel and selections
        id: plus038_check_16
        continue-on-error: true
        run: python calculator/tests/plus009-menu-browser.py
      - name: PLUS-010 printed MATRIX menu and STO key flows
        id: plus038_check_17
        continue-on-error: true
        run: python calculator/tests/plus010-matrix-browser.py
      - name: PLUS-011 printed VECTOR menu, dot/cross, STO key flows
        id: plus038_check_18
        continue-on-error: true
        run: python calculator/tests/plus011-vector-browser.py
      - name: PLUS-012 STAT insert, delete and clear key semantics
        id: plus038_check_19
        continue-on-error: true
        run: python calculator/tests/plus012-stat-browser.py
      - name: PLUS-013 TABLE fractional boundaries error cells and X memory
        id: plus038_check_20
        continue-on-error: true
        run: python calculator/tests/plus013-table-browser.py
      - name: PLUS-025 keyboard focus safety, browser shortcuts and native controls
        id: plus038_check_21
        continue-on-error: true
        run: python calculator/tests/plus025-keyboard-browser.py
      - name: PLUS-026 complete physical-key inventory and live browser regression
        id: plus038_check_22
        continue-on-error: true
        run: python calculator/tests/plus026-matrix-browser.py
      - name: PLUS-028 ALT capture independent reference web keylogs and LCD frames
        id: plus038_check_23
        continue-on-error: true
        run: python calculator/tests/plus028-reference-browser.py
      - name: Upload web-only reference captures and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plus028-browser-reference-captures
          path: /tmp/plus028-web-captures/
          if-no-files-found: warn
      - name: PLUS-033 mathematical keys SHIFT ALPHA and error recovery
        id: plus038_check_24
        continue-on-error: true
        run: python calculator/tests/plus033-key-functions-browser.py
      - name: Upload PLUS-033 keypad state and LCD parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plus033-keypad-function-browser-captures
          path: /tmp/plus033-browser-captures/
          if-no-files-found: warn
      - name: PLUS-034 memory DMS SETUP and mode transitions in both releases
        id: plus038_check_25
        continue-on-error: true
        run: python calculator/tests/plus034-memory-dms-setup-browser.py
      - name: Upload PLUS-034 web keypad and LCD comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plus034-memory-dms-setup-captures
          path: /tmp/plus034-browser-captures/
          if-no-files-found: warn
      - name: PLUS-035 constants conversions STAT and TABLE web reference checks
        id: plus038_check_26
        continue-on-error: true
        run: python calculator/tests/plus035-constants-stat-table-browser.py
      - name: Upload PLUS-035 reference keypad traces and LCD comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plus035-constants-stat-table-captures
          path: /tmp/plus035-browser-captures/
          if-no-files-found: warn
      - name: PLUS-036 MATRIX VECTOR and EQN web algebra reference checks
        id: plus038_check_27
        continue-on-error: true
        run: python calculator/tests/plus036-matrix-vector-eqn-browser.py
      - name: Upload PLUS-036 algebra keypad traces and LCD comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plus036-matrix-vector-eqn-captures
          path: /tmp/plus036-browser-captures/
          if-no-files-found: warn
      - name: PLUS-037 CALC SOLVE and cancellable numerical worker browser checks
        id: plus038_check_28
        continue-on-error: true
        run: python calculator/tests/plus037-numeric-browser.py
      - name: Upload PLUS-037 numerical worker traces and cancellation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plus037-numeric-browser-captures
          path: /tmp/plus037-browser-captures/
          if-no-files-found: warn
      - name: PLUS-038 final release quality gate
        if: always()
        run: |
          failed=0
          echo "### PLUS-038 release verification" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.plus038_check_01.outcome }}" != "success" ]; then
            echo "- FAIL or SKIP: Compile release scripts" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "- PASS: Compile release scripts" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.plus038_check_02.outcome }}" != "success" ]; then
            echo "- FAIL or SKIP: PLUS-028 verify evidence comparator and report explicitly blocked hardware status" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "- PASS: PLUS-028 verify evidence comparator and report explicitly blocked hardware status" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.plus038_check_03.outcome }}" != "success" ]; then
            echo "- FAIL or SKIP: Fail on stale standalone, missing modules, CSS or manifest drift" >> "$GITHUB_STEP_SUMMARY"
            failed=1
          else
            echo "- PASS: Fail on stale standalone, missing modules, CSS or manifest drift" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.plus038_check_04.outcome }}" != "success" ]; then
            echo "- FAIL or SKIP: Verify PLUS-only arithmetic, model identity and key contracts" >> "$GITHUB_STEP_SUMMARY"
            failed=1

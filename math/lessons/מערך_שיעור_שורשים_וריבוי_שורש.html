<script>
const M=x=>`\\(${x}\\)`;
const topics=[
 {n:1,title:"מושג הפונקציה וקריאת גרף",goal:"לקרוא מידע אלגברי מתוך גרף: ערכי פונקציה, חיתוכים, חיוביות ושליליות וסוג המפגש עם הצירים.",
 theory:["הגרף של פונקציה הוא אוסף הנקודות "+M("(x,f(x))")+". ערך חיובי נמצא מעל ציר "+M("x")+" וערך שלילי מתחתיו.","נקודת חיתוך עם ציר "+M("x")+" מתקבלת כאשר "+M("f(x)=0")+". חיתוך עם ציר "+M("y")+" מתקבל בהצבת "+M("x=0")+".","כאשר הגרף עובר מצד אחד של ציר "+M("x")+" לצד האחר יש שינוי סימן; כאשר הוא נוגע וחוזר אין שינוי סימן."],
 graph:{box:[-4,6,7,-5],f:x=>(x+2)*(x-1)*(x-4)/8,roots:[-2,1,4]},
 gen:()=>baseGraphQuestions()},
 {n:2,title:"חזקות וזוגיות המעריך",goal:"להבין כיצד זוגיות החזקה משפיעה על הסימן ועל צורת הגרף משני צדי השורש.",
 theory:["בחזקה זוגית, "+M("u^{2k}\\ge 0")+" לכל "+M("u")+". לכן הסימן אינו מתחלף סביב "+M("u=0")+".","בחזקה אי־זוגית, "+M("u^{2k+1}")+" מקבל את סימנו של "+M("u")+" ולכן הסימן מתחלף סביב האפס.","הפונקציות "+M("(x-r)^m")+" מתקבלות מהזזת "+M("x^m")+" אל השורש "+M("r")+"."],
 graph:{box:[-3,3,7,-5],multi:true},
 gen:()=>powerQuestions()},
 {n:3,title:"פולינום: דרגה, מקדם מוביל והצגות",goal:"לזהות פולינום, לקבוע דרגה ומקדם מוביל ולעבור בין הצגה מפורקת להצגה מפותחת.",
 theory:["בפולינום מפותח הדרגה היא החזקה הגבוהה ביותר שמקדמה אינו אפס; המקדם שלה הוא המקדם המוביל.","במכפלה, הדרגות מתחברות והמקדם המוביל הוא מכפלת המקדמים המובילים של הגורמים.","הצגה מפורקת חושפת שורשים; הצגה מפותחת חושפת מיד את הדרגה, המקדם המוביל והאיבר החופשי."],
 gen:()=>degreeQuestions()},
 {n:4,title:"משוואת מכפלה ונקודות האפס של הפונקציה",goal:"לפתור משוואה פולינומית מפורקת באמצעות עקרון המכפלה המתאפסת.",
 theory:["עקרון המכפלה המתאפסת: אם "+M("A\\cdot B=0")+" אז "+M("A=0")+" או "+M("B=0")+".","מן הגורם "+M("(x-r)")+" מתקבל השורש "+M("x=r")+". יש להיזהר בסימן: מן "+M("(x+5)")+" מתקבל "+M("x=-5")+".","מוצאים את כל הגורמים המתאפסים; מקדם קבוע שאינו אפס אינו יוצר שורש."],
 gen:()=>zeroQuestions()},
 {n:5,title:"ריבוי של שורש",goal:"לזהות את ריבויו של כל שורש ולהבחין בין מספר השורשים השונים לבין סכום הריבויים.",
 theory:["אם "+M("(x-r)^m")+" מחלק את הפולינום אך "+M("(x-r)^{m+1}")+" אינו מחלק אותו, אז "+M("r")+" הוא שורש מריבוי "+M("m")+".","בפולינום מפורק לגורמים לינאריים, סכום הריבויים שווה לדרגה.","אותו שורש עלול להופיע בכמה גורמים שקולים; תחילה מאחדים אותם ורק אז קובעים את הריבוי."],
 gen:()=>multiplicityQuestions()},
 {n:6,title:"התנהגות מקומית ליד שורש",goal:"לקבוע אם הגרף חוצה, נוגע או משתטח ליד כל שורש לפי ריבויו.",
 theory:["ריבוי אי־זוגי גורם לחציית ציר "+M("x")+"; ריבוי זוגי גורם לנגיעה וחזרה לאותו צד.","ריבוי "+M("1")+" יוצר חצייה רגילה, "+M("2")+" נגיעה דמוית פרבולה, "+M("3")+" חצייה שטוחה ו־"+M("4")+" נגיעה שטוחה.","הגורמים האחרים והמקדם קובעים מאיזה צד הגרף מגיע, אך זוגיות הריבוי קובעת אם מתרחש שינוי סימן."],
 graph:{box:[-3,3,5,-5],local:true},
 gen:()=>localQuestions()},
 {n:7,title:"שינוי סימן וטבלת סימנים",goal:"לבנות טבלת סימנים לפולינום ולהסיק תחומי חיוביות ושליליות.",
 theory:["מסמנים את כל השורשים על ציר המספרים ומחלקים אותו לתחומים.","אפשר להציב נקודת בדיקה בכל תחום. לחלופין, עוברים משמאל לימין: הסימן מתחלף בשורש מריבוי אי־זוגי ונשמר בשורש מריבוי זוגי.","מקדם שלילי הופך את כל הסימנים. טבלת הסימנים חייבת להתאים למיקום הגרף מעל או מתחת לציר "+M("x")+"."],
 gen:()=>signQuestions()},
 {n:8,title:"התנהגות קצוות",goal:"לקבוע את כיוון שני קצות הגרף מתוך זוגיות הדרגה וסימן המקדם המוביל.",
 theory:["כאשר "+M("|x|")+" גדול, האיבר המוביל "+M("a_nx^n")+" שולט בהתנהגות הפולינום.","דרגה זוגית: שני הקצוות באותו כיוון. דרגה אי־זוגית: הקצוות בכיוונים מנוגדים.","מקדם מוביל חיובי קובע שהקצה הימני עולה; מקדם מוביל שלילי קובע שהקצה הימני יורד."],
 graph:{box:[-3,3,6,-6],ends:true},
 gen:()=>endQuestions()},
 {n:9,title:"השפעת המקדם והגורמים",goal:"לטפל נכון במקדמים, בגורמים הפוכים ובחיתוך עם ציר y.",
 theory:["כפל ב־"+M("-1")+" משקף את הגרף ביחס לציר "+M("x")+" ואינו משנה את השורשים.","הזהות "+M("(r-x)=-(x-r)")+" משנה את סימן המקדם המוביל. מספר אי־זוגי של גורמים הפוכים יוצר סימן שלילי כולל.","חיתוך עם ציר "+M("y")+" מתקבל מן "+M("f(0)")+" ומשמש להכרעה בין גרפים בעלי אותם שורשים וריבויים."],
 gen:()=>coefficientQuestions()},
 {n:10,title:"בניית סקיצה מן ההצגה המפורקת",goal:"לשלב שורשים, ריבויים, סימנים, חיתוך עם ציר y וקצוות לסקיצה עקבית.",
 theory:["סדר עבודה יעיל: דרגה ומקדם מוביל; שורשים וריבויים; סוג מפגש; טבלת סימנים; "+M("f(0)")+"; התנהגות קצוות.","מסמנים תחילה רק מידע ודאי. את הקטעים בין השורשים מחברים בעקומה רציפה וחלקה המתאימה לפולינום.","אין לקבוע מיקום מדויק של נקודות קיצון ללא כלי נוסף; הסקיצה היא איכותנית."],
 graph:{box:[-4,5,8,-6],f:x=>-.12*(x+3)*Math.pow(x-1,2)*(x-3),roots:[-3,1,3]},
 gen:()=>sketchQuestions()},
 {n:11,title:"התאמה בין משוואה לגרף",goal:"להתאים גרף לפולינום באמצעות כמה מאפיינים ולנסח נימוק מתמטי מלא.",
 theory:["מתחילים במאפיינים החזקים ביותר: מיקום השורשים וסוג המפגש בכל שורש.","אחר כך בודקים התנהגות קצוות, סימן בתחומים וחיתוך עם ציר "+M("y")+".","נימוק מלא מציין לפחות שני מאפיינים בלתי תלויים; מראה כללי בלבד אינו הוכחה."],
 graph:{box:[-4,5,7,-6],match:true},
 gen:()=>matchQuestions()},
 {n:12,title:"הסקה הפוכה: מן הגרף לפולינום",goal:"להציע פונקציה אפשרית מתוך גרף ולהבחין בין מידע ודאי לבין בחירה אפשרית.",
 theory:["מחצייה מסיקים ריבוי אי־זוגי; מנגיעה מסיקים ריבוי זוגי. הגרף לבדו בדרך כלל אינו קובע את הריבוי המדויק.","מן הקצוות מסיקים את זוגיות הדרגה ואת סימן המקדם המוביל.","בונים פולינום מן הצורה "+M("f(x)=a(x-r_1)^{m_1}(x-r_2)^{m_2}\\cdots(x-r_n)^{m_n}")+" ובוחרים את "+M("a")+" בעזרת נקודה נוספת, למשל חיתוך עם ציר "+M("y")+"."],
 graph:{box:[-4,5,7,-6],reverse:true},
 gen:()=>reverseQuestions()}
];

function range(a,b){return Array.from({length:b-a+1},(_,i)=>a+i)}
function shuffledSigns(i){return i%2===0?1:-1}
function baseGraphQuestions(){
 const q=[],a=[]; const pts=[-3,-2,-1,0,1,2,3,4,5];
 pts.slice(0,8).forEach((x,i)=>{q.push(`קבע אם הנקודה שבה ${M("x="+x)} נמצאת מעל ציר ${M("x")}, מתחתיו או עליו בגרף שבעמוד התאוריה.`);a.push(["מתחת","על הציר","מעל","מעל","על הציר","מתחת","מתחת","על הציר"][i]);});
 q.push(`רשום את כל חיתוכי הגרף עם ציר ${M("x")}.`);a.push(M("(-2,0),(1,0),(4,0)"));
 q.push(`קבע באילו תחומים ${M("f(x)>0")}.`);a.push(M("(-2,1)\\cup(4,\\infty)"));
 q.push(`קבע באילו תחומים ${M("f(x)<0")}.`);a.push(M("(-\\infty,-2)\\cup(1,4)"));
 q.push(`האם הסימן מתחלף ליד ${M("x=1")}? נמק מן הגרף.`);a.push("כן; הגרף חוצה את הציר.");
 q.push(`מצא מן הגרף את ערך ${M("f(-2)")}.`);a.push(M("0"));
 q.push(`כמה שורשים ממשיים שונים נראים בגרף?`);a.push("3");
 q.push(`תאר במילים את התנהגות הגרף ליד ${M("x=4")}.`);a.push("חוצה מלמטה למעלה.");
 q.push(`האם ייתכן ש־${M("f(3)>0")}?`);a.push("לא; בגרף הערך שלילי.");
 q.push(`בחר נקודה אחת שבה ${M("f(x)=0")}.`);a.push("כל אחד מן הערכים "+M("-2,1,4")+".");
 q.push(`האם הגרף מייצג פונקציה? השתמש במבחן הקו האנכי.`);a.push("כן; כל קו אנכי חותך לכל היותר פעם אחת.");
 q.push(`סדר את השורשים מן הקטן לגדול.`);a.push(M("-2<1<4"));
 q.push(`כמה תחומי סימן נוצרים על ידי שלושת השורשים?`);a.push("4");
 q.push(`אם נשקף את הגרף ביחס לציר ${M("x")}, מה יהיו השורשים?`);a.push("אותם שורשים.");
 q.push(`אם נזיז את הגרף שתי יחידות ימינה, מה יהיו השורשים החדשים?`);a.push(M("0,3,6"));
 q.push(`נסח תנאי אלגברי לנקודת חיתוך עם ציר ${M("x")}.`);a.push(M("f(x)=0"));
 q.push(`הצע מכפלה פשוטה בעלת אותם שורשים.`);a.push(M("(x+2)(x-1)(x-4)"));
 q.push(`מה ניתן להסיק בוודאות על שינוי הסימן בכל אחד מן השורשים?`);a.push("הסימן מתחלף בשלושתם.");
 return [q,a];
}
function powerQuestions(){
 const q=[],a=[]; const vals=[[2,4],[-3,2],[-2,3],[3,3],[ -1,4],[2,5],[ -2,6],[3,4]];
 vals.forEach(([x,n])=>{q.push(`חשב: ${M(`${x}^{${n}}`)}.`);a.push(M(String(Math.pow(x,n))));});
 [[2,0], [3,-1],[4,2],[5,-3]].forEach(([n,r])=>{q.push(`קבע אם ${M(`(x${r>=0?'-'+r:'+'+(-r)})^{${n}}`)} מחליף סימן סביב השורש.`);a.push(n%2?"כן":"לא");});
 range(1,4).forEach((k)=>{q.push(`קבע את סימן ${M(`u^{${2*k}}`)} כאשר ${M("u<0")}.`);a.push("חיובי");});
 range(1,4).forEach((k)=>{q.push(`קבע את סימן ${M(`u^{${2*k+1}}`)} כאשר ${M("u<0")}.`);a.push("שלילי");});
 q.push(`השווה את הסימנים של ${M("(x-2)^4")} משני צדי ${M("x=2")}.`);a.push("חיוביים בשני הצדדים.");
 q.push(`השווה את הסימנים של ${M("(x+1)^3")} משני צדי ${M("x=-1")}.`);a.push("שלילי משמאל וחיובי מימין.");
 q.push(`איזו פונקציה שטוחה יותר ליד האפס: ${M("x^3")} או ${M("x^7")}?`);a.push(M("x^7"));
 q.push(`איזו פונקציה נוגעת בציר ואינה חוצה: ${M("x^5")} או ${M("x^6")}?`);a.push(M("x^6"));
 q.push(`תאר את ההזזה מ־${M("x^4")} אל ${M("(x-3)^4")}.`);a.push("3 יחידות ימינה.");
 q.push(`תאר את ההזזה מ־${M("x^3")} אל ${M("(x+2)^3")}.`);a.push("2 יחידות שמאלה.");
 q.push(`מצא את כל ${M("x")} שעבורם ${M("(x-5)^8=0")}.`);a.push(M("x=5"));
 return [q,a];
}
function degreeQuestions(){

 ["(x-1)(x+2)","שני שורשים פשוטים"],["(x-2)^2(x+1)","נגיעה ב־2"],["-x(x-3)","פרבולה הפונה כלפי מטה"],["(x+2)^3","חצייה שטוחה"],["(x-1)^2(x+3)^2","שתי נקודות נגיעה"],["-(x+1)^3(x-2)","דרגה זוגית ושני הקצוות למטה"],["x(x-2)^2(x+3)","פולינום ממעלה 4"],["-(x-1)(x+2)(x-4)","פולינום ממעלה 3 ומקדם מוביל שלילי"]
 ];fs.forEach(e=>{q.push(`שרטט סקיצה איכותנית של ${M("f(x)="+e[0])}; סמן שורשים וקצוות.`);a.push(e[1]);});
 q.push(`שרטט פונקציה ממעלה 3 ששורשיה ${M("-2,1,4")} ומקדמה המוביל חיובי.`);a.push(M("(x+2)(x-1)(x-4)"));
 q.push(`שרטט פונקציה ממעלה 4 הנוגעת ב־${M("-1")} וב־${M("3")}.`);a.push(M("(x+1)^2(x-3)^2"));
 q.push(`שרטט פונקציה שחוצה ב־${M("0")} ונוגעת ב־${M("2")}, והקצה הימני עולה.`);a.push(M("x(x-2)^2"));
 q.push(`שרטט פונקציה שחוצה חצייה שטוחה ב־${M("-2")} ונוגעת ב־${M("1")}.`);a.push(M("(x+2)^3(x-1)^2"));
 range(1,5).forEach(i=>{q.push(`ל־${M(`f_${i}(x)=(x-${i})^2(x+${i})`)}: רשום לפני השרטוט דרגה, שורשים, ${M("f(0)")} וקצוות.`);a.push(`דרגה 3; שורשים ${M(`${i},-${i}`)}; חשב ${M("f(0)")}.`);});
 q.push(`שרטט סקיצה אפשרית לפולינום ממעלה 5 עם שלושה שורשים שונים וריבויים ${M("1,2,2")}.`);a.push("כל סקיצה עקבית; דוגמה "+M("(x+2)(x-1)^2(x-3)^2")+".");
 q.push(`שרטט סקיצה אפשרית לפולינום ממעלה 6 עם שני שורשים נוגעים ושורש חוצה.`);a.push("בלתי אפשרי אם החצייה אי־זוגית וסכום הריבויים 6; יש להשלים ריבויים בהתאם.");
 q.push(`מצא ושרטט פונקציה מינימלית שחוצה ב־${M("-3")} וב־${M("2")} ונוגעת ב־${M("0")}.`);a.push(M("(x+3)x^2(x-2)"));
 q.push(`מצא ושרטט פונקציה בעלת אותם שורשים של ${M("(x-1)^2(x+2)")} אך כל הקצוות והסימנים הפוכים.`);a.push(M("-(x-1)^2(x+2)"));
 q.push(`הסבר מדוע סקיצה לפי שורשים בלבד עלולה להיות שגויה.`);a.push("חסרים ריבויים, סימן מקדם וקצוות.");
 q.push(`הסבר מדוע אין לקבוע מיקום מדויק של קיצון מן ההצגה המפורקת בלבד.`);a.push("המידע האיכותני אינו נותן קואורדינטות מדויקות.");
 q.push(`בנה רשימת בדיקה בת שישה שלבים לפני שרטוט.`);a.push("דרגה, מקדם, שורשים, ריבויים, סימנים, חיתוך y וקצוות.");
 q.push(`בדוק אם סקיצה ששני קצותיה למעלה יכולה להתאים ל־${M("-x^4+x^2")}.`);a.push("לא; המקדם המוביל שלילי.");
 q.push(`בדוק אם סקיצה החוצה ב־${M("1")} יכולה להתאים ל־${M("(x-1)^4(x+2)")}.`);a.push("לא; ב־1 יש נגיעה.");

function matchQuestions(){
 const q=[],a=[];const pairs=[
 ["(x-1)^2(x+2)","נגיעה ב־1 וחצייה ב־‎-2"],["-(x+1)(x-3)^2","חצייה ב־‎-1 ונגיעה ב־3"],["x^3(x-2)","חצייה שטוחה ב־0 וחצייה ב־2"],["(x+2)^2(x-1)^2","שתי נגיעות ושני הקצוות למעלה"],["-(x-4)^3","חצייה שטוחה והקצה הימני למטה"],["(2-x)(x+1)^2","נגיעה ב־‎-1 וחצייה ב־2"],["x(x^2-9)","חצייה ב־‎-3, ב־0 וב־3"],["-x^2(x-2)","נגיעה ב־0 וחצייה ב־2"]
 ];pairs.forEach(e=>{q.push(`כתוב ארבעה מאפייני גרף המאפשרים לזהות את ${M("f(x)="+e[0])}.`);a.push(e[1]);});
 q.push(`גרף נוגע ב־${M("-2")}, חוצה ב־${M("1")} ושני קצותיו למעלה. הצע משוואה.`);a.push(M("(x+2)^2(x-1)^2")+" אינו חוצה; לכן למשל "+M("(x+2)^2(x-1)(x^2+1)")+" מדרגה 5 לא קצוות זהים — אין אפשרות עם רק גורמים אלה; נדרש שורש אי־זוגי נוסף.");
 q.push(`גרף נוגע ב־${M("0")}, חוצה ב־${M("3")} וקצהו הימני עולה. הצע משוואה מינימלית.`);a.push(M("x^2(x-3)"));
 q.push(`גרף חוצה ב־${M("-1,2")} ושני קצותיו למטה. האם קיים פולינום מינימלי עם רק שני שורשים אלה?`);a.push(M("-(x+1)(x-2)"));
 q.push(`גרף חוצה חצייה שטוחה ב־${M("1")} והקצה הימני למטה. הצע משוואה.`);a.push(M("-(x-1)^3"));
 range(1,5).forEach(i=>{q.push(`השווה בין ${M(`f(x)=(x-${i})^2(x+1)`)} ובין ${M(`g(x)=-(x-${i})(x+1)^2`)} לפי שורשים, מפגשים וקצוות.`);a.push("אותם מיקומי שורשים אך הריבויים והקצוות שונים.");});
 q.push(`שני גרפים חולקים שורשים וריבויים. בגרף א׳ ${M("f(0)>0")} ובב׳ ${M("g(0)<0")}. מה הקשר האפשרי?`);a.push("מקדמים מובילים בסימנים הפוכים.");
 q.push(`איזה מאפיין עדיף לבדוק ראשון: נקודת קיצון משוערת או מיקום שורשים?`);a.push("מיקום שורשים.");
 q.push(`איזה מאפיין מכריע בין ${M("(x-1)^2(x+2)")} ל־${M("-(x-1)^2(x+2)")}?`);a.push("כיוון הקצוות או סימן בנקודה שאינה שורש.");
 q.push(`נמק מדוע גרף החוצה בכל שלושת השורשים אינו יכול להתאים ל־${M("(x+1)^2x(x-2)")}.`);a.push("ב־"+M("-1")+" הריבוי זוגי ולכן יש נגיעה.");
 q.push(`נמק מדוע גרף ששני קצותיו עולים אינו מתאים לפולינום ממעלה 5.`);a.push("דרגה אי־זוגית מחייבת קצוות מנוגדים.");
 q.push(`מצא טעות: התאימו גרף נוגע ב־${M("2")} לפונקציה ${M("(x-2)^3(x+1)")}.`);a.push("ריבוי 3 גורם לחצייה.");
 q.push(`מצא טעות: התאימו גרף ימני עולה ל־${M("-(x+1)^2(x-3)")}.`);a.push("המקדם המוביל שלילי בדרגה 3, ולכן הימני יורד.");
 q.push(`נסח תבנית לנימוק התאמה מלא.`);a.push("שורשים ומפגשים; קצוות; סימן או חיתוך y.");
 q.push(`כמה מאפיינים בלתי תלויים רצוי לציין בנימוק?`);a.push("לפחות שניים.");
 q.push(`האם דמיון חזותי לבדו מוכיח התאמה?`);a.push("לא.");
 return [q,a];
}
function reverseQuestions(){
 const q=[],a=[];const desc=[
 ["חצייה ב־‎-2 וב־1","(x+2)(x-1)"],["נגיעה ב־0 וחצייה ב־3","x^2(x-3)"],["חצייה שטוחה ב־‎-1","(x+1)^3"],["נגיעה ב־‎-2 וב־2","(x+2)^2(x-2)^2"],["חצייה ב־0 והקצה הימני למטה","-x"],["נגיעה ב־1 ושני הקצוות למטה","-(x-1)^2"],["חצייה ב־‎-3 ונגיעה ב־2","(x+3)(x-2)^2"],["חצייה שטוחה ב־2 והקצה הימני למעלה","(x-2)^3"]
 ];desc.forEach(e=>{q.push(`הצע פולינום מינימלי לגרף המתואר: ${e[0]}.`);a.push(M(e[1]));});
 q.push(`גרף חוצה ב־${M("-2")} ונוגע ב־${M("1")}; ידוע ${M("f(0)=4")}. מצא פונקציה מינימלית.`);a.push(M("2(x+2)(x-1)^2"));
 q.push(`גרף נוגע ב־${M("-1")} וב־${M("3")}; ידוע ${M("f(0)=-9")}. מצא פונקציה מינימלית.`);a.push(M("-(x+1)^2(x-3)^2"));
 q.push(`גרף חוצה ב־${M("0,2")} ועובר ב־${M("(1,3)")}. מצא פונקציה ריבועית.`);a.push(M("-3x(x-2)"));
 q.push(`גרף חוצה חצייה שטוחה ב־${M("1")} ועובר ב־${M("(0,2)")}. מצא פונקציה ממעלה 3.`);a.push(M("-2(x-1)^3"));
 range(1,5).forEach(i=>{q.push(`לגרף שורש נוגע ב־${M(i)} ושורש חוצה ב־${M(-i)}. כתוב משפחת פולינומים מינימלית.`);a.push(M(`a(x-${i})^2(x+${i}),\\ a\\ne0`));});
 q.push(`מן הגרף ידועים רק שורשים ${M("-1,2")}, ושניהם חוצים. האם המשוואה יחידה?`);a.push("לא; למשל "+M("a(x+1)(x-2)")+" לכל "+M("a\\ne0")+".");
 q.push(`מה ניתן להסיק בוודאות מנגיעה רגילה למראה?`);a.push("ריבוי זוגי; לא בהכרח בדיוק 2.");
 q.push(`מה ניתן להסיק בוודאות מחצייה שטוחה?`);a.push("ריבוי אי־זוגי גדול מ־1; בדרך כלל לפחות 3.");
 q.push(`גרף בעל שני קצוות למעלה ושלוש חציות. האם הוא אפשרי?`);a.push("לא; שלוש חציות גוררות סכום ריבויים אי־זוגי, ולכן דרגה אי־זוגית אם אין שורשים נוספים.");
 q.push(`גרף בעל שני קצוות למטה ושתי נגיעות. הצע פונקציה.`);a.push(M("-(x-a)^2(x-b)^2"));
 q.push(`מצא מקדם ${M("a")} במשפחה ${M("a(x+2)^2(x-1)")} אם הגרף עובר ב־${M("(0,-8)")}.`);a.push(M("a=2"));
 q.push(`האם ניתן לקבוע את כל נקודות הקיצון מן השורשים בלבד?`);a.push("לא.");
 q.push(`הבחן בין מסקנה ודאית לאפשרית: הגרף נוגע בציר ב־${M("x=2")}.`);a.push("ודאי: ריבוי זוגי. אפשרי: ריבוי 2.");
 q.push(`בנה פונקציה ממעלה הנמוכה ביותר המתאימה לחצייה ב־${M("-2,0,3")} ולחיתוך ${M("f(1)=8")}.`);a.push(M("-2(x+2)x(x-3)"));
 q.push(`בנה פונקציה עם אותה צורה איכותנית אך מתיחה אנכית כפולה.`);a.push("כפל הפונקציה ב־"+M("2")+".");
 return [q,a];
}

function footer(topic,page){return `<div class="footer"><span>שורשים וריבוי שורש • 5 יח״ל</span><span>נושא ${topic} • עמוד ${page}</span></div>`}
function theoryPage(t,pageNo){
 return `<section class="page"><div class="band"><small>נושא ${t.n} מתוך 12</small><h1>${t.title}</h1><p>למידה עצמית • תאוריה, דוגמה ובקרת הבנה</p></div>
 <div class="goal"><b>מטרת הלמידה:</b> ${t.goal}</div>
 <div class="two_"><div><h3>הרעיונות המרכזיים</h3><ol>${t.theory.map(x=>`<li>${x}</li>`).join("")}</ol>
 <h3>שיטת עבודה</h3><ul><li>קרא כל כלל וכתוב דוגמה משלך.</li><li>פתור את שאלת הבקרה בלי להביט בתשובה.</li><li>עבור לתרגול רק לאחר שאתה מסוגל להסביר את הכלל במילים.</li></ul>
<div style="height:30px;"></div>
 <div>${t.graph?`<div id="board-${t.n}" class="board" aria-label="גרף המחשה לנושא ${t.n}"></div>`:`<div class="card"><h3>דוגמה מודרכת</h3><p>עבור ${M("f(x)=-2(x-1)^2(x+3)")}: מתחילים בזיהוי הצורה, ממשיכים למידע המבוקש, ולבסוף בודקים שהתוצאה עקבית עם הסימנים והדרגה.</p><p class="formula">${M("algebra\\;\\longleftrightarrow\\;graph")}</p></div>`}
 </div></div>${footer(t.n,pageNo)}</section>`;
}
function exercisePage(t,items,start,level,pageNo){
 return `<section class="page"><div class="exercise-head"><div><h2>${t.n}. ${t.title}</h2><span>תרגול מדורג • שאלות ${start+1}–${start+items.length}</span></div><span class="level ${level.cls}">${level.name}</span></div>
 <ol class="exercises" start="${start+1}">${items.map(x=>`<li>${x}</li>`).join("")}</ol>
 <div class="tip"><b>הנחיה ללמידה עצמית:</b> כתוב נימוק קצר בכל שאלה מושגית. אם טעית, חזור לכלל המתאים בעמוד התאוריה ופתור שוב ללא העתקה.</div>${footer(t.n,pageNo)}</section>`;
}
function answerPage(t,answers,pageNo){
 return `<section class="page"><div class="band"><small>בקרה עצמית</small><h1>תשובות קצרות — ${t.title}</h1><p>בדוק רק לאחר ניסיון מלא. תשובה קצרה אינה מחליפה דרך ונימוק.</p></div>
 <div class="answer-grid">${answers.map((x,i)=>`<div class="answer"><span class="num">${i+1}.</span> ${x}</div>`).join("")}</div>
 <div class="tip"><b>סיכום אישי:</b> סמן שלוש שאלות שבהן טעית, כתוב ליד כל אחת את מקור הטעות, ופתור אותן מחדש למחרת.</div>${footer(t.n,pageNo)}</section>`;
}
function renderBook(){
 let html="",page=1;
 html+=`<section class="page"><div class="band"><small>חוברת ללמידה עצמית • 5 יח״ל</small><h1>שורשים וריבוי שורש בפונקציות פולינום</h1><p>12 יחידות לימוד • 300 תרגילים • תאוריה, גרפים ומפתח תשובות</p></div>
 <div class="goal"><b>כיצד להשתמש בחוברת:</b> בכל יחידה קרא את התאוריה, חקור את גרף ההמחשה, פתור 8 שאלות קלות, 9 בינוניות ו־8 קשות, ורק אז בדוק תשובות.</div>
 <h2>מפת הלמידה</h2><div class="checklist">${topics.map(t=>`<div class="check"><b>${t.n}. ${t.title}</b><br><span class="lead">${t.goal}</span></div>`).join("")}</div>
 <div class="tip"><b>כלל זהב:</b> בכל פולינום שאל לפי הסדר: מהי הדרגה? מהו המקדם המוביל? מהם השורשים וריבוייהם? היכן הסימן מתחלף? כיצד מתנהגים הקצוות?</div>${footer("מבוא",page++)}</section>`;
 topics.forEach(t=>{let [q,a]=t.gen(); if(q.length<25||a.length<25) throw new Error(`Topic ${t.n}: expected at least 25 exercises, got ${q.length}/${a.length}`); q=q.slice(0,25); a=a.slice(0,25);
   html+=theoryPage(t,page++);html+=exercisePage(t,q.slice(0,8),0,{name:"קל",cls:"easy"},page++);html+=exercisePage(t,q.slice(8,17),8,{name:"בינוני",cls:"medium"},page++);html+=exercisePage(t,q.slice(17,25),17,{name:"קשה",cls:"hard"},page++);html+=answerPage(t,a,page++);
 });
 document.getElementById("book").innerHTML=html;
 initBoards();
 if(window.MathJax?.typesetPromise) MathJax.typesetPromise();
}
function initBoards(){
 topics.filter(t=>t.graph).forEach(t=>{
   const g=t.graph,b=JXG.JSXGraph.initBoard(`board-${t.n}`,{boundingbox:g.box,axis:true,showCopyright:false,showNavigation:false,keepaspectratio:false,pan:{enabled:false},zoom:{enabled:false}});
   const style={strokeColor:"#087f88",strokeWidth:3,fixed:true,highlight:false};
   if(g.multi){b.create("functiongraph",[x=>x*x],{...style,name:"x²"});b.create("functiongraph",[x=>x*x*x/2],{...style,strokeColor:"#ef9f25"});}
   else if(g.local){b.create("functiongraph",[x=>x],{...style,strokeColor:"#6f7b89"});b.create("functiongraph",[x=>x*x],{...style,strokeColor:"#087f88"});b.create("functiongraph",[x=>x*x*x],{...style,strokeColor:"#ef9f25"});b.create("functiongraph",[x=>x*x*x*x],{...style,strokeColor:"#8d4ba8"});}
   else if(g.ends){b.create("functiongraph",[x=>x*x*x/3],{...style});b.create("functiongraph",[x=>-x*x/2+2],{...style,strokeColor:"#ef9f25"});}
   else if(g.match){b.create("functiongraph",[x=>(x+2)*Math.pow(x-1,2)/5],{...style});b.create("functiongraph",[x=>-(x+2)*Math.pow(x-1,2)/5],{...style,strokeColor:"#ef9f25",dash:2});}
   else if(g.reverse){b.create("functiongraph",[x=>.2*(x+2)*Math.pow(x-1,2)],{...style});}
   else {b.create("functiongraph",[g.f],style);(g.roots||[]).forEach(r=>b.create("point",[r,0],{name:"",size:3,fillColor:"#ef9f25",strokeColor:"#b77700",fixed:true,highlight:false}));}
 });
}
window.addEventListener("load",renderBook);

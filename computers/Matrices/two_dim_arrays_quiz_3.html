<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>מטריצת עצמים</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg1: #f0f9ff;
      --bg2: #eef2ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --line: #dbe3ef;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --correct-bg: #ecfdf5;
      --correct-text: #047857;
      --correct-border: #10b981;
      --wrong-bg: #fef2f2;
      --wrong-text: #b91c1c;
      --wrong-border: #ef4444;
      --code-bg: #f8fafc;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 20px;
    }

    .screen.center {
      align-items: center;
    }

    .card {
      width: min(860px, 100%);
      background: var(--card);
      border: 2px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px;
    }

    .landing-card,
    .result-card {
      width: min(620px, 100%);
      text-align: center;
    }

    .hero-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(28px, 5vw, 38px);
    }

    h2 {
      margin: 0 0 18px;
      font-size: clamp(22px, 4vw, 30px);
      text-align: right;
    }

    p {
      line-height: 1.7;
    }

    .subtitle {
      color: var(--muted);
      font-size: 18px;
      margin: 0 0 26px;
    }

    .progress-wrap {
      margin-bottom: 24px;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0;
      transition: width 0.25s ease;
    }

    .question {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 18px;
      text-align: right;
      line-height: 1.7;
    }

    pre {
      direction: ltr;
      text-align: left;
      unicode-bidi: plaintext;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--code-bg);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      margin: 0 0 22px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-x: auto;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      width: 100%;
      text-align: right;
      padding: 15px 18px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
      line-height: 1.55;
    }

    .option:hover:not(:disabled) {
      border-color: #818cf8;
      transform: translateY(-1px);
    }

    .option:disabled {
      cursor: default;
    }

    .option.correct {
      border-color: var(--correct-border);
      background: var(--correct-bg);
    }

    .option.wrong {
      border-color: var(--wrong-border);
      background: var(--wrong-bg);
    }

    .feedback {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 16px;
      border: 2px solid transparent;
      line-height: 1.65;
    }

    .feedback.correct {
      background: var(--correct-bg);
      color: var(--correct-text);
      border-color: #a7f3d0;
    }

    .feedback.wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
      border-color: #fecaca;
    }

    .feedback-title {
      font-weight: 800;
      margin-bottom: 8px;
    }

    .correct-explanation {
      margin-top: 8px;
      color: #374151;
      font-size: 14px;
    }

    .actions {
      display: flex;
      justify-content: flex-start;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 12px 22px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn:disabled {
      background: #c7d2fe;
      color: #fff;
      cursor: not-allowed;
      transform: none;
    }

    .score {
      font-size: 23px;
      margin: 10px 0 24px;
      color: #374151;
    }

    .score strong {
      color: var(--primary);
    }

    .validation {
      margin-top: 16px;
      color: #b91c1c;
      font-size: 14px;
    }

    bdi, code, .ltr {
      direction: ltr;
      unicode-bidi: isolate;
    }

    .force-ltr {
      direction: ltr;
      text-align: left;
      unicode-bidi: isolate;
    }

    @media (max-width: 640px) {
      .screen {
        padding: 20px 12px;
      }
      .card {
        padding: 22px 16px;
        border-radius: 18px;
      }
      .question {
        font-size: 18px;
      }
      .option {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <script>

        0: "אפשר לבדוק במהירות אם תא פנוי.",
        1: "חיסכון תלוי CLR/אובייקטים.",
        2: "אין דבר כזה – חובה להישאר בגבולות."
      }
    },
    {
      id: 20,
      question: "מה היתרון בשימוש בפעולה CloneMatrix(Student[,] src) שמחזירה העתק עצמאי של המטריצה?",
      code: `Student[,] CloneMatrix(Student[,] src){
  int rows = src.GetLength(0);
  int cols = src.GetLength(1);
  Student[,] copy = new Student[rows,cols];
  for(int i=0;i<rows;i++)
    for(int j=0;j<cols;j++)
      if(src[i,j]!=null)
        copy[i,j] = new Student(src[i,j]);
  return copy;
}`,
      options: [
        "שינויים בעותק לא משפיעים על המקור",
        "העתקה מהירה יותר של הפניות",
        "אין צורך בלולאות כלל בעת שכפול"
      ],
      correct: 0,
      explanation: {
        0: "יצירת אובייקטים חדשים מונעת שיתוף רפרנסים בין המקור לעותק.",
        1: "זו העתקה שטחית – לא מונעת זליגת שינויים.",
        2: "לולאות נדרשות להעתקה של כל תא במטריצה."
      }
    },
    {
      id: 21,
      question: "איך סופרים תלמידים עם Grade>90 כאשר חלק מהתאים ריקים?",
      code: `for(int i=0;i<a.GetLength(0);i++)
  for(int j=0;j<a.GetLength(1);j++)
    if (a[i,j] != null && a[i,j].Grade > 90) count++;`,
      options: [
        "לבצע בדיקת null מפורשת לפני כל גישה לשדה",
        "להניח שכל התאים מאוכלסים כדי לחסוך בדיקות",
        "לעטוף את הגישה ב-try/catch במקום בדיקת null"
      ],
      correct: 0,
      explanation: {
        0: "בדיקת null מפורשת מונעת ניסיון גישה לשדה על תא ריק.",
        1: "הנחה כזו מסוכנת ועלולה לגרום לשגיאות בזמן ריצה.",
        2: "טיפול בשגיאות יקר ומיותר כשהמניעה פשוטה עם בדיקת null."
      }
    },
    {
      id: 22,
      question: "מהי דרך טובה לאתחול אולם ריק בגודל r×c?",
      code: `Visitor[,] hall = new Visitor[r,c];`,
      options: [
        "כל התאים מאותחלים ל-null כברירת מחדל",
        "יש למלא ידנית null בכל תא",
        "יש ליצור רשימת רשימות"
      ],
      correct: 0,
      explanation: {
        0: "מטריצה של רפרנסים מאותחלת ל-null.",
        1: "מיותר – CLR עושה זאת.",
        2: "אפשרי אך לא מטריצה סטטית."
      }
    },
    {
      id: 23,
      question: "מה עושה הקוד הבא?",
      code: `bool AnyLate(Student[,] cls){\n  for(int i=0;i<cls.GetLength(0);i++)\n    for(int j=0;j<cls.GetLength(1);j++)\n      if(cls[i,j]?.Late == true) return true;\n  return false;\n}`,
      options: ["בודק אם קיים תלמיד מאחר לפחות אחד", "סופר את כלל התלמידים", "מחשב ממוצע ציונים"],
      correct: 0,
      explanation: {
        0: "ברגע שמוצאים Late==true מוחזרים true.",
        1: "אין כאן ספירה.",
        2: "אין חישוב ציונים."
      }
    },
    {
      id: 24,
      question: "מה היתרון בשימוש בפעולה FindFirstEmpty(Student[,] cls) להחזרת מיקום פנוי?",
      code: `int[] FindFirstEmpty(Student[,] cls){
  for(int i=0;i<cls.GetLength(0);i++)
    for(int j=0;j<cls.GetLength(1);j++)
      if(cls[i,j]==null) return new int[]{i,j};
  return null;
}`,
      options: [
        "מאפשרת איתור מיקום זמין בצורה מרוכזת ונוחה לשימוש חוזר",
        "תמיד מחזירה null ולכן בטוחה לשימוש",
        "מונעת הקצאת זיכרון חדשה"
      ],
      correct: 0,
      explanation: {
        0: "הפעולה מרכזת את הלוגיקה ומאפשרת שימוש חוזר במציאת תא פנוי.",
        1: "היא מחזירה null רק כשאין מקום פנוי, לא תמיד.",
        2: "היא יוצרת מערך חדש של אינדקסים ולכן דווקא מקצה זיכרון קטן."
      }
    },
    {
      id: 25,
      question:
        "מהו כלל זהב בעבודה עם מטריצת עצמים ?",
      options: [
        "בדיקות גבול, null ויושרה בין שדות לפני כל גישה/החלפה",
        "לסמוך על כך שהמידע תמיד עקבי",
        "להימנע לחלוטין ממחלקות מורכבות"
      ],
      correct: 0,
      explanation: {
        0: "זה מיישם את שלושת העקרונות בתמונה: ארגון, מניעת טעויות, והרחבה קלה.",
        1: "אסור להניח עקביות.",
        2: "מחלקות מאפשרות הרחבה וניקיון."
      }
    }
  ];

    let page = "landing";
    let qIndex = 0;
    const answers = {};

    const app = document.getElementById("app");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatInlineBiDi(text) {
      const escaped = escapeHtml(text);

      // Keep common programming/API fragments readable inside Hebrew text.
      return escaped
        .replace(/(\[[,\]]+Student|Student\[[,\]]+|Visitor\[[,\]]+|Person\[[,\]]+)/g, '<bdi dir="ltr">$1</bdi>')
        .replace(/([A-Za-z_][A-Za-z0-9_.]*(?:&lt;|&gt;|==|!=|&gt;=|&lt;=)[A-Za-z0-9_.-]+)/g, '<bdi dir="ltr">$1</bdi>')
        .replace(/([A-Za-z_][A-Za-z0-9_.]*\([^)]*\))/g, '<bdi dir="ltr">$1</bdi>');
    }

    function validateQuestions() {
      const issues = [];

      if (questions.length !== 25) {
        issues.push(`צפויות 25 שאלות, בפועל: ${questions.length}`);
      }

      const ids = new Set();
      const seen = [];

      questions.forEach((q) => {
        if (ids.has(q.id)) issues.push(`מזהה שאלה כפול: id=${q.id}`);
        ids.add(q.id);
        seen.push(q.id);

        if (!Array.isArray(q.options) || q.options.length !== 3) {
          issues.push(`שאלה id=${q.id} צריכה 3 אפשרויות`);
        }

        if (!(Number.isInteger(q.correct) && q.correct >= 0 && q.correct < q.options.length)) {
          issues.push(`אינדקס תשובה נכונה מחוץ לטווח בשאלה id=${q.id}`);
        }

        q.options.forEach((_, i) => {
          if (!q.explanation || typeof q.explanation[i] !== "string" || q.explanation[i].length === 0) {
            issues.push(`חסר הסבר לאפשרות ${i} בשאלה id=${q.id}`);
          }
        });

        if (q.code !== undefined && String(q.code).trim().length === 0) {
          issues.push(`שדה code ריק בשאלה id=${q.id}`);
        }
      });

      [...seen].sort((a, b) => a - b).forEach((id, i) => {
        if (id !== i + 1) issues.push(`מזהה שאלה אינו רציף: ציפיתי ל-${i + 1} בפועל ${id}`);
      });

      if (issues.length) {
        console.warn("QUIZ TESTS FAILED:", issues);
      } else {
        console.info("QUIZ TESTS PASSED ✔");
      }

      return issues;
    }

    const validationIssues = validateQuestions();

    function getCorrectCount() {
      return Object.keys(answers).filter((key) => {
        const index = Number(key);
        return questions[index].correct === answers[index];
      }).length;
    }

    function render() {
      if (page === "landing") renderLanding();
      else if (page === "result") renderResult();
      else renderQuiz();
    }

    function renderLanding() {
      app.innerHTML = `
        <section class="screen center">
          <div class="card landing-card">
            <div class="hero-icon" aria-hidden="true">📊</div>
            <h1>מטריצת עצמים</h1>
            <p class="subtitle">שאלות על מטריצות של עצמים: ארגון נתונים, חיפוש, ספירה ובדיקות גבול.</p>
            ${validationIssues.length ? `<div class="validation">יש בעיות בתיקוף השאלות (${validationIssues.length}). פרטים בקונסול.</div>` : ""}
            <div class="actions" style="justify-content:center">
              <button class="btn btn-primary" id="startBtn">🚀 התחל מבדק</button>
            </div>
          </div>
        </section>
      `;

      document.getElementById("startBtn").addEventListener("click", () => {
        page = "quiz";
        qIndex = 0;
        render();
      });
    }

    function renderQuiz() {
      const current = questions[qIndex];
      const answered = answers[qIndex] !== undefined;
      const selected = answers[qIndex];
      const progress = ((qIndex + 1) / questions.length) * 100;

      const optionsHtml = current.options.map((opt, i) => {
        let cls = "option";
        if (answered) {
          if (i === current.correct) cls += " correct";
          else if (i === selected) cls += " wrong";
        }

        const forceLtr = current.id === 9 && i === 0;
        return `
          <button class="${cls} ${forceLtr ? "force-ltr" : ""}" data-option="${i}" ${answered ? "disabled" : ""}>
            ${formatInlineBiDi(opt)}
          </button>
        `;
      }).join("");

      let feedbackHtml = "";
      if (answered) {
        const isCorrect = selected === current.correct;
        if (isCorrect) {
          feedbackHtml = `
            <div class="feedback correct" aria-live="polite">
              <div class="feedback-title">תשובה נכונה ✅</div>
            </div>
          `;
        } else {
          feedbackHtml = `
            <div class="feedback wrong" aria-live="polite">
              <div class="feedback-title">תשובה שגויה ❌</div>
              <div>${formatInlineBiDi(current.explanation[selected])}</div>
              <div class="correct-explanation">
                <strong>הסבר לתשובה הנכונה:</strong>
                ${formatInlineBiDi(current.explanation[current.correct])}
              </div>
            </div>
          `;
        }
      }

      app.innerHTML = `
        <section class="screen">
          <div class="card">
            <div class="progress-wrap">
              <div class="progress-text">
                <span>שאלה ${qIndex + 1} מתוך ${questions.length}</span>
                <span>${Math.round(progress)}%</span>
              </div>
              <div class="progress" aria-label="התקדמות במבדק">
                <div class="progress-bar" style="width:${progress}%"></div>
              </div>
            </div>

            <h2>שאלה ${qIndex + 1}</h2>
            <div class="question">${formatInlineBiDi(current.question)}</div>

            ${current.code !== undefined ? `<pre><code>${escapeHtml(current.code)}</code></pre>` : ""}

            <div class="options">
              ${optionsHtml}
            </div>

            ${feedbackHtml}

            <div class="actions">
              <button class="btn btn-primary" id="nextBtn" ${answered ? "" : "disabled"}>
                ${qIndex === questions.length - 1 ? "סיום" : "לשאלה הבאה"}
              </button>
            </div>
          </div>
        </section>
      `;

      document.querySelectorAll("[data-option]").forEach((button) => {
        button.addEventListener("click", () => {
          if (answers[qIndex] !== undefined) return;
          answers[qIndex] = Number(button.dataset.option);
          render();
        });
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        if (answers[qIndex] === undefined) return;

        if (qIndex < questions.length - 1) {
          qIndex += 1;
          render();
        } else {
          page = "result";
          render();
        }
      });
    }

    function renderResult() {
      const correctCount = getCorrectCount();

      app.innerHTML = `
        <section class="screen center">
          <div class="card result-card">
            <div class="hero-icon" aria-hidden="true">⭐</div>
            <h1>תוצאות</h1>
            <p class="score">ענית נכון על <strong>${correctCount}</strong> מתוך <strong>${questions.length}</strong> שאלות.</p>
            <div class="actions" style="justify-content:center">
              <button class="btn btn-primary" id="restartBtn">🔁 התחל מחדש</button>
            </div>
          </div>
        </section>
      `;

      document.getElementById("restartBtn").addEventListener("click", () => {
        for (const key of Object.keys(answers)) delete answers[key];
        qIndex = 0;
        page = "quiz";
        render();
      });
    }

    render();
  </script>
</body>
</html>

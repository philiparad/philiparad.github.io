<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" href="philip_favicon.png"/>
    <title>Queue Quest | תרגול תורים ב-C#</title>
    <meta name="description" content="חידון אינטראקטיבי של 30 שאלות על תורים ב-C#, הדמיית תור, משוב והמלצות לתרגול.">
    <style>
        :root {
            --bg: #f4f7fb;
            --paper: #ffffff;
            --ink: #18283f;
            --muted: #5e6d83;
            --navy: #172c4b;
            --indigo: #5148d8;
            --indigo-dark: #3e35b8;
            --indigo-light: #eeedff;
            --mint: #087d68;
            --mint-light: #e4f7f1;
            --coral: #b63741;
            --coral-light: #fff0f0;
            --amber: #8f5605;
            --amber-light: #fff6df;
            --border: #dbe4ef;
            --shadow: 0 18px 45px rgba(31, 54, 93, .085);
            --radius: 22px;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: "Arial", "Noto Sans Hebrew", "Segoe UI", sans-serif;
            font-size: 1rem;
            line-height: 1.62;
            color: var(--ink);
            background: var(--bg);
        }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .55; }
        :focus-visible { outline: 3px solid #e9a83d; outline-offset: 3px; }
        a { color: var(--indigo-dark); text-decoration-thickness: 2px; }
        a:hover { text-decoration: underline; }
        [hidden], .hidden { display: none !important; }
        .app-shell { min-height: 100vh; }
        .topbar {
            background: rgba(255,255,255,.96);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 3px 14px rgba(16, 33, 61, .035);
        }
        .top-inner { width: min(1140px, calc(100% - 32px)); margin: auto; min-height: 76px; display: flex; align-items: center; gap: 20px; justify-content: space-between; flex-wrap: wrap; padding-block: 10px; }
        .brand { display: flex; gap: 11px; align-items: center; min-width: 0; }
        .brand-mark { width: 47px; height: 47px; border-radius: 15px; display: grid; place-items: center; color: white; background: linear-gradient(135deg, #5148d8, #087d68); font-size: 24px; }
        .brand-name { font-weight: 900; letter-spacing: -.03em; font-size: 1.17rem; }
        .brand-caption { font-size: .76rem; color: var(--muted); }
        nav { display: flex; gap: 6px; flex-wrap: wrap; }
        .nav-btn { border: 2px solid transparent; color: #45546b; background: transparent; border-radius: 12px; padding: 8px 14px; font-weight: 750; }
        .nav-btn.active { color: var(--indigo-dark); background: var(--indigo-light); border-color: #dedaff; }
        .zoom-controls { display: flex; gap: 4px; align-items: center; }
        .zoom-controls button { min-width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--border); background: white; font-weight: 900; }
        .container { width: min(1140px, calc(100% - 32px)); margin: auto; }
        main { padding: 30px 0 54px; }
        .panel { background: var(--paper); border: 2px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: clamp(18px,3vw,32px); }
        .eyebrow { display: inline-flex; gap: 8px; align-items: center; border: 2px solid #cce8df; background: #eafaf4; color: #096b59; border-radius: 30px; padding: 5px 12px; font-size: .88rem; font-weight: 800; }
        h1, h2, h3 { line-height: 1.25; letter-spacing: -.025em; }
        h1 { font-size: clamp(2.1rem,4.5vw,3.5rem); margin: 18px 0 16px; }
        h2 { font-size: clamp(1.36rem, 2.6vw, 1.85rem); margin: 0 0 15px; }
        h3 { font-size: 1.1rem; margin: 0 0 10px; }
        p { margin: 10px 0; }
        .lead { font-size: 1.12rem; color: #42536c; max-width: 55ch; }
        .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 22px; align-items: stretch; }
        .hero-copy { padding: clamp(22px,4vw,42px); border-radius: 28px; background: linear-gradient(140deg,#fff,#f4f7ff 60%,#e9faf4); border: 2px solid #d8e2f3; }
        .hero-visual { border-radius: 28px; background: linear-gradient(160deg,#25345e,#1e3560 62%,#174f60); color: #fff; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; min-height: 300px; overflow: hidden; }
        .queue-pictogram { display: flex; flex-direction: row; justify-content: center; gap: 8px; margin-block: 34px 24px; direction: rtl; }
        .queue-pictogram .tile { width: 68px; height: 68px; display: grid; place-items:center; font-size: 1.4rem; font-weight: 850; border: 2px solid rgba(255,255,255,.38); background: rgba(255,255,255,.14); border-radius: 16px; }
        .queue-pictogram .tile:first-child { border-color: #66e2c1; box-shadow: 0 0 0 3px rgba(102,226,193,.12); }
        .queue-legend { display: flex; justify-content: space-between; gap: 8px; font-size: .87rem; color: #cddff7; }
        .lighttext { color: #dfeaff; }
        .stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 13px; margin: 18px 0 24px; }
        .stat { border: 2px solid var(--border); border-radius: 17px; background: white; padding: 17px; }
        .stat strong { display: block; font-weight: 900; font-size: 1.55rem; line-height: 1.3; }
        .stat span { color: var(--muted); font-size: .88rem; }
        .start-panel { margin-top: 20px; }
        .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
        .mode-card { text-align: right; border: 2px solid var(--border); background: white; border-radius: 17px; padding: 17px; color: var(--ink); }
        .mode-card strong { display: block; font-size: 1.1rem; }
        .mode-card span { display: block; font-size: .9rem; color: var(--muted); margin-top: 3px; }
        .mode-card.active { background: var(--indigo-light); border-color: var(--indigo); box-shadow: 0 0 0 2px #e2dfff; }
        .inline-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 47px; padding: 10px 20px; border: 2px solid transparent; border-radius: 13px; font-weight: 800; text-decoration: none; }
        .btn-primary { background: var(--indigo); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--indigo-dark); }
        .btn-secondary { background: white; border-color: #cbd5e7; color: #334565; }
        .btn-secondary:hover:not(:disabled) { background: #f5f7ff; }
        .btn-mint { background: var(--mint); color: white; }
        .btn-mint:hover:not(:disabled) { background: #065d4d; }
        .btn-danger { background: #fff; border-color: #e1abb2; color: #9f2531; }
        .form-select, .form-input { border: 2px solid #c7d4e4; background: white; color: var(--ink); border-radius: 12px; padding: 9px 12px; min-height: 47px; }
        .section-title { margin: 29px 0 16px; }
        .feature-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; }
        .feature { padding: 18px; border-radius: 18px; background: white; border: 2px solid var(--border); }
        .feature .emoji { font-size: 1.65rem; }
        .feature p { color: var(--muted); font-size: .92rem; }
        .note { border: 2px solid #cfdbec; border-radius: 15px; background: #f5f8fe; padding: 13px 17px; margin-top: 16px; }
        .muted { color: var(--muted); }
        .small { font-size: .88rem; }
        .quiz-layout { display: grid; grid-template-columns: minmax(0,1fr) 260px; gap: 20px; align-items: start; }
        .quiz-layout > * { min-width: 0; }
        .question-kicker { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .topic-pill, .level-pill { display: inline-block; padding: 4px 10px; border-radius: 99px; font-weight: 800; font-size: .78rem; background: #edf4fc; color: #27527d; }
        .level-pill { background: #f7f0ff; color: #6640a2; }
        .question-heading { font-size: clamp(1.25rem,2.5vw,1.66rem); line-height: 1.5; font-weight: 850; margin: 22px 0; }
        .progress-track { height: 10px; background: #e4eaf3; border-radius: 25px; overflow: hidden; margin: 15px 0 8px; }
        .progress-fill { height: 100%; border-radius: 25px; background: linear-gradient(90deg,#087d68,#5850d9); transition: width .25s; }
        .answer-options { display: grid; gap: 11px; margin: 18px 0; }
        .option { width: 100%; display: flex; flex-direction: row; align-items: flex-start; text-align: right; gap: 14px; border: 2px solid #d9e2ee; border-radius: 16px; padding: 17px 18px; background: #fff; font-weight: 600; color: #23324a; min-height: 65px; }
        .option:hover:not(:disabled) { border-color: #8e89ec; background: #faf9ff; }
        .option.chosen { border-color: var(--indigo); background: #f4f2ff; box-shadow: 0 0 0 2px #ece9ff; }
        .option.good { border-color: #0b8b6c; background: #e9fbf3; }
        .option.bad { border-color: #c34750; background: #fff0f1; }
        .option .letter { display: grid; place-items: center; flex: 0 0 31px; width:31px; height:31px; border-radius: 50%; border: 2px solid #b9c7da; font-size: .82rem; background: #f6f8fc; }
        .option.chosen .letter { background: var(--indigo); color: white; border-color: var(--indigo); }
        .option.good .letter { background: var(--mint); color: white; border-color: var(--mint); }
        .option.bad .letter { background: var(--coral); color: white; border-color: var(--coral); }
        .option:disabled { opacity: 1; }
        .option-label { flex: 1; }
        .option-state { font-size: .77rem; white-space: nowrap; font-weight: 800; }
        .feedback { border: 2px solid var(--border); border-radius: 16px; padding: 16px 18px; margin-top: 15px; }
        .feedback.good { border-color: #a6e4d2; background: var(--mint-light); }
        .feedback.bad { border-color: #f0bdc2; background: var(--coral-light); }
        .feedback h3 { font-size: 1.08rem; }
        .feedback p { margin: 8px 0 0; }
        .hint-box { background: var(--amber-light); border: 2px solid #efd79f; border-radius: 15px; padding: 12px 16px; margin-top: 14px; }
        .hint-box summary { cursor: pointer; font-weight: 800; }
        .hint-box p { margin-bottom: 0; }
        .code-panel { border: 2px solid #abc5e5; background: #192b43; color: #e2f1ff; border-radius: 16px; padding: 18px; margin-block: 16px 19px; }
        .code-panel .code-title { font-size: .85rem; font-weight: 800; margin-bottom: 10px; color: #9fdfd6; }
        .code-panel pre, .code-panel code { margin: 0; font-family: Consolas, 'Courier New', monospace; font-size: .95rem; direction: ltr; text-align: left; unicode-bidi: isolate; white-space: pre-wrap; word-break: normal; tab-size: 4; line-height: 1.65; }
        .math-inline, mjx-container { direction: ltr; unicode-bidi: isolate; display: inline-block; vertical-align: baseline; }
        .question-footer { margin-top: 24px; padding-top: 20px; border-top: 2px solid #edf1f5; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .sidebar { position: sticky; top: 100px; }
        .sidebar .panel { padding: 19px; box-shadow: 0 6px 30px rgba(31,54,93,.04); }
        .question-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 7px; margin: 18px 0; }
        .qnav { aspect-ratio: 1; border: 2px solid #d9e2ee; color: #58677c; background: #f8fafd; border-radius: 10px; font-weight: 850; }
        .qnav.active { outline: 2px solid var(--indigo); outline-offset: 2px; }
        .qnav.answered { background: #e5f5ef; color: #096451; border-color: #a4ddc9; }
        .qnav.wrong { background: #fff1f1; color: #a52e39; border-color: #ebc2c5; }
        .qnav.pending { background: #f0eeff; color: var(--indigo-dark); border-color: #c8c3ff; }
        .sidebar-caption { font-size: .79rem; color: var(--muted); }
        .keytip { font-size: .78rem; color: #66768c; margin-top: 12px; }
        .lab-layout { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
        .queue-flow { min-height: 140px; display: flex; justify-content: flex-start; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 17px; padding: 16px; border-radius: 16px; background: linear-gradient(140deg,#eff5fc,#edfcf5); border: 2px dashed #b6c9dc; }
        .queue-cell { min-width: 58px; height: 62px; border-radius: 14px; border: 2px solid #718dc6; background: #fff; display: grid; place-items: center; font-size: 1.22rem; font-weight: 900; box-shadow: 0 6px 16px rgba(30,54,89,.06); animation: pop .3s ease-out; }
        .queue-cell.front { border-color: #0f8d72; background: #dff9ef; }
        .lab-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 17px 0; }
        .lab-controls .form-input { width: 115px; direction: ltr; text-align: center; }
        .live-message { min-height: 52px; padding: 10px 13px; border-radius: 12px; border: 2px solid #d5e0ed; background: #f8fbff; margin-top: 12px; }
        .step-list { padding-inline-start: 21px; margin: 0; }
        .step-list li { margin-bottom: 7px; }
        .result-hero { text-align: center; padding: 22px; border-radius: 19px; background: linear-gradient(130deg,#e6faf3,#eef1ff); border: 2px solid #cde3e6; margin-bottom: 20px; }
        .score { font-weight: 950; font-size: clamp(3.2rem,7vw,5.3rem); color: #3431a5; line-height: 1.1; }
        .meter-row { margin: 12px 0; }
        .meter-row > div:first-child { display: flex; justify-content: space-between; align-items: center; gap: 9px; }
        .meter-row .progress-track { margin: 5px 0 0; height: 8px; }
        .review-item { border: 2px solid var(--border); border-radius: 17px; padding: 17px; margin-bottom: 11px; background: #fff; }
        .review-item.review-wrong { border-color: #edc3c6; }
        .review-item.review-correct { border-color: #b4e2d1; }
        .review-item h3 { line-height: 1.48; }
        .review-pair { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
        .review-pair div { background: #f5f8fc; border-radius: 10px; padding: 10px; }
        .review-pair small { display: block; color: #5f6f85; }
        .review-pair strong { font-size: .95rem; }
        .filter-row { margin: 21px 0 12px; display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn { border-radius: 12px; padding: 8px 17px; border: 2px solid #d4dbea; background:white; font-weight: 800; }
        .filter-btn.active { border-color:var(--indigo); background:var(--indigo-light); color:var(--indigo-dark); }
        .footer-note { color: #6b798d; text-align: center; font-size: .8rem; padding: 20px; }
        .print-only { display: none; }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        @keyframes pop { from {transform: scale(.86); opacity: .6;} to {transform: scale(1);opacity:1;} }
        @media (max-width: 920px) {
            .hero, .lab-layout { grid-template-columns: 1fr; }
            .quiz-layout { grid-template-columns: 1fr; }
            .sidebar { position: static; }
            .feature-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 630px) {
            .top-inner { align-items: flex-start; }
            .topbar nav { width: 100%; }
            .brand-caption { display: none; }
            main { padding-top: 15px; }
            .hero-visual { min-height: 220px; }
            .choice-grid, .review-pair { grid-template-columns: 1fr; }
            .stats-grid { gap: 7px; }
            .stat { padding: 11px; }
            .stat strong { font-size: 1.22rem; }
            .question-footer .btn { flex: 1 1 44%; }
            .queue-pictogram .tile { width: 55px; height: 58px; }
            .option { padding: 13px; }
            .panel { padding: 18px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
        }
        @page { size: A4; margin: 14mm; }
        @media print {
            html, body { background: white; font-size: 11pt; }
            .topbar, main, .footer-note, .no-print { display: none !important; }
            #printSheet { display: block !important; color: #111; }
            .print-page { break-after: page; page-break-after: always; min-height: 250mm; padding: 1mm; }
            .print-page:last-child { break-after: auto; page-break-after: auto; }
            .print-page h1 { font-size: 21pt; }
            .print-page h2 { font-size: 16pt; }
            .print-row { border: 1px solid #aaa; padding: 11px; margin-bottom: 10px; break-inside: avoid; page-break-inside: avoid; }
            .print-row h3 { font-size: 11pt; margin: 0 0 5px; }
            .print-row p { margin: 2px 0; }
            .progress-track { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
        }
    </style>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
            startup: { typeset: false }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
</head>
<body>
    <div class="app-shell">
        <header class="topbar no-print">
            <div class="top-inner">
                <div class="brand">
                    <div class="brand-mark" aria-hidden="true">▤</div>
                    <div>
                        <div class="brand-name">Queue Quest</div>
                        <div class="brand-caption">מתרגלים תורים. מבינים קוד. מתקדמים.</div>
                    </div>
                </div>
                <nav aria-label="ניווט ראשי">
                    <button class="nav-btn" type="button" data-action="home">⌂ בית</button>
                    <button class="nav-btn" type="button" data-action="lab">◫ מעבדת תורים</button>
                    <button class="nav-btn" type="button" data-action="resume" id="navQuiz">◉ החידון</button>
                </nav>
                <div class="zoom-controls" aria-label="גודל טקסט">
                    <button type="button" data-action="smaller" aria-label="הקטן טקסט">א−</button>
                    <button type="button" data-action="bigger" aria-label="הגדל טקסט">א+</button>
                </div>
            </div>
        </header>
        <main id="mainContent" class="container" tabindex="-1">
            <div id="app" aria-live="off"></div>
        </main>
        <footer class="footer-note no-print">חידון לימודי עצמאי • אין צורך בחשבון או בשרת • ניתן להשתמש גם במקלדת</footer>
        <div id="printSheet" class="print-only" aria-hidden="true"></div>

"אין לולאה כפולה על כל האיברים, לכן לא O(n^2)."},"why":"עוברים על כל אחד מ־n האיברים מספר קבוע של פעמים, ולכן זמן הריצה ליניארי.","hint":"העריכו כמה פעמים מעבדים כל איבר, ולא כמה תורים יש.","topic":"שיטת תור עזר","level":"יסודות"},{"id":6,"question":"איזו פעולה מתבצעת לכל איבר בתור בשיטת התור הזמני?","options":["הוצאה מראש והכנסה חזרה לתור הזמני","גישה ישירה באמצע","השמטה מוחלטת מהתור"],"correct":0,"explanation":{"1":"אין גישה ישירה באמצע התור.","2":"האיברים לא מושמטים אלא מוחזרים בסוף."},"why":"מוציאים מהתור המקורי ומכניסים לתור הזמני. לאחר העיבוד מחזירים את כולם, לפי סדרם.","hint":"הבחינו בין הפעולה על התור המקורי לפעולה על תור העזר.","topic":"שיטת תור עזר","level":"יסודות"},{"id":7,"question":"בשיטת הגלגול, מה עושים עם כל איבר שמוצא מהתור?","options":["מוחקים אותו לצמיתות","מכניסים אותו לסוף התור","שומרים אותו ברשימה חיצונית"],"correct":1,"explanation":{"0":"לא מוחקים את האיבר אלא מזיזים אותו.","2":"לא שומרים ברשימה חיצונית אלא מחזירים לסוף התור."},"why":"בגלגול, כל איבר שהוצא מראש התור מוכנס לסופו. לאחר סיבוב מלא נשמר הסדר.","hint":"בדקו מה קורה למיקום של איבר אחד כשהוא מוצא מראש התור.","topic":"שיטת הגלגול","level":"יסודות"},{"id":8,"question":"מה תפקידו של סמן ייחודי המוכנס לסוף התור בשיטת הגלגול?","options":["לזהות מתי עובדו כל האיברים המקוריים","למחוק את כל איברי התור","לשנות את סדר האיברים לתמיד"],"correct":0,"explanation":{"1":"הסמן אינו מנקה את התור; הוא משמש גבול לסריקה.","2":"בסיום מסירים את הסמן ושומרים על סדר האיברים המקורי."},"why":"סמן ייחודי שמתווסף לסוף התור מאפשר לזהות שסיימנו לעבד את כל האיברים המקוריים.","hint":"חשבו כיצד אפשר לדעת מתי עברתם על כל התור בלי מונה.","topic":"שיטת הגלגול","level":"יסודות"},{"id":9,"question":"הוספנו סמן ייחודי לסוף התור. מתי מסיימים את סריקת הגלגול?","options":["כאשר התור כולו התרוקן","כאשר הסמן מגיע לראש התור","מיד אחרי גלגול האיבר הראשון"],"correct":1,"explanation":{"0":"אין צורך לרוקן את התור כדי לדעת שהושלם סבב.","2":"לאחר איבר אחד עדיין לא עברנו על כל האיברים המקוריים."},"why":"אחרי עיבוד וגלגול כל האיברים המקוריים, הסמן מגיע לראש; מסירים אותו כדי להשיב את התור לצורתו המקורית.","hint":"עקבו אחרי מיקום הסמן לאחר כל העברה של איבר מראש לסוף.","topic":"שיטת הגלגול","level":"יסודות"},{"id":10,"question":"מה סיבוכיות הזמן של הדפסת תור בשיטת הגלגול?","options":["O(1)","O(n)","O(n^2)"],"correct":1,"explanation":{"0":"עוברים על כל האיברים, לכן לא O(1).","2":"אין לולאה כפולה ולכן לא O(n^2)."},"why":"כל איבר עובר מראש לסוף פעם אחת; עלות הפעולות הבסיסיות קבועה ולכן הסיבוכיות ליניארית.","hint":"ספרו כמה פעולות מבצעים לכל איבר בסבב אחד.","topic":"שיטת הגלגול","level":"יסודות"},{"id":11,"question":"איזו שיטה מאפשרת לשמור על סדר האיברים ללא תור עזר נוסף?","options":["שיטת התור הזמני","שיטת הגלגול","שיטת ההיפוך"],"correct":1,"explanation":{"0":"שיטת התור הזמני כן דורשת תור נוסף.","2":"שיטת ההיפוך אינה מוזכרת בקובץ."},"why":"גלגול מסובב את האיברים בתוך אותו תור; אין צורך להקצות תור נוסף.","hint":"בדקו האם השיטה מאחסנת איברים מחוץ לתור המקורי.","topic":"השוואת שיטות","level":"הבנה"},{"id":12,"question":"מה ההבדל בין סריקת תור בעזרת תור עזר לבין גלגול איברים?","options":["תור עזר דורש מבנה נוסף וגלגול לא","גלגול דורש שני תורים","אין הבדל כלל"],"correct":0,"explanation":{"1":"גלגול לא דורש שני תורים, רק תור אחד וסמן.","2":"יש הבדל ברור בין השיטות."},"why":"תור עזר צורך מקום נוסף לאיברים זמניים; גלגול משמר את הסדר בתוך התור הקיים.","hint":"השוו בין צריכת הזיכרון של שתי השיטות.","topic":"השוואת שיטות","level":"הבנה"},{"id":13,"question":"מהו התנאי החשוב ביותר בבחירת ערך סמן לתור של מספרים שלמים?","options":["שהסמן יהיה המספר הגדול ביותר","שהסמן יהיה ערך שאינו מופיע בתור","שהסמן יהיה תמיד אפס"],"correct":1,"explanation":{"0":"הערך הגדול ביותר עלול להופיע בנתונים ולכן אינו בהכרח מתאים.","2":"אפס עשוי להיות איבר רגיל בתור ולכן אינו סמן בטוח."},"why":"כדי לאתר את סוף הסבב על ידי השוואת ערכים, הסמן חייב להיות ייחודי ולא להופיע בין הנתונים.","hint":"חשבו על תור שבו כל ערך מספרי עשוי להופיע, גם אפס.","topic":"השוואת שיטות","level":"הבנה"},{"id":14,"question":"מה יתרון שיטת הגלגול על פני שימוש בתור זמ de":"Queue<int> q = new Queue<int>();\nq.Insert(3);\nq.Insert(5);\nq.Insert(7);\nint x = q.Remove();\nq.Insert(x);\nConsole.WriteLine(q.Head());"},{"id":23,"question":"מה מצב התור המקורי אחרי סיום הלולאה?","options":["התור ריק","התור עדיין מכיל את שלושת האיברים","התור מכיל רק את האיבר הראשון"],"correct":0,"explanation":{"1":"כל איבר הוצא מהתור המקורי והוכנס לתור העזר.","2":"הלולאה ממשיכה עד שהתור המקורי מתרוקן."},"why":"כל הפעלה של Remove() מקטינה את התור המקורי, והלולאה אינה מחזירה אליו איברים.","hint":"שימו לב איזה תור מקבל את Insert() ואיזה תור מאבד איברים.","topic":"מעקב אחר קוד","level":"יישום","code":"Queue<int> q = new Queue<int>();\nq.Insert(2);\nq.Insert(4);\nq.Insert(6);\nQueue<int> temp = new Queue<int>();\nwhile (!q.IsEmpty())\n{\n    temp.Insert(q.Remove());\n}"},{"id":24,"question":"בתור יש את הערכים [[3,5,7]]. איזה סמן אפשר לבחור לגלגול, בהנחה שהוא מזוהה לפי ערכו?","options":["5","7","-1"],"correct":2,"explanation":{"0":"הערך 5 כבר נמצא בתור ועלול להיתפס כסמן.","1":"הערך 7 כבר נמצא בתור ועלול להיתפס כסמן."},"why":"הערך ‎-1 אינו מופיע בין הערכים 3, 5 ו-7 ולכן יוכל לשמש סמן ייחודי בדוגמה זו.","hint":"בדקו אילו ערכים כבר נמצאים בין איברי התור.","topic":"מעקב אחר קוד","level":"יישום"},{"id":25,"question":"מה יודפס בקוד ומה יישאר בתור לאחר הלולאה?","options":["יודפס 3 והתור יהיה ריק","יודפס 3 והתור לא ישתנה","יודפס 2 והתור יהיה ריק"],"correct":0,"explanation":{"1":"לא בוצעה החזרת איברים לתור לאחר Remove().","2":"יש שלושה איברים, והמונה גדל פעם אחת עבור כל אחד מהם."},"why":"הלולאה מוציאה שלושה איברים, מגדילה count שלוש פעמים ומשאירה את התור ריק.","hint":"ספרו את מספר הפעמים שהלולאה פועלת ובדקו אם יש בקוד פעולת Insert().","topic":"מעקב אחר קוד","level":"יישום","code":"Queue<int> q = new Queue<int>();\nq.Insert(8);\nq.Insert(1);\nq.Insert(8);\nint count = 0;\nwhile (!q.IsEmpty())\n{\n    q.Remove();\n    count++;\n}\nConsole.WriteLine(count);"},{"id":26,"question":"מה יקרה לתור אם סורקים אותו באמצעות Remove() מבלי להחזיר אליו את האיברים?","options":["הוא יישא level":"יישום"},{"id":30,"question":"מה מחזירה הפעולה עבור תור שמכיל [[7,2,9]], ומה מצב התור אחריה?","options":["תחזיר 3, והתור יישמר","תחזיר 3, והתור יתרוקן","תחזיר 9, והתור יישמר"],"correct":0,"explanation":{"1":"הלולאה השנייה מחזירה את כל האיברים מתור העזר לתור המקורי.","2":"הפעולה סופרת איברים; היא אינה מחזירה את ערך האיבר האחרון."},"why":"הפעולה מעבירה את שלושת האיברים לתור עזר, סופרת אותם ואז מחזירה אותם באותו סדר; היא מחזירה 3.","hint":"עקבו אחרי שתי הלולאות: הראשונה אוספת וסופרת, השנייה משחזרת.","topic":"מעקב אחר קוד","level":"יישום","code":"static int CountQueue(Queue<int> q)\n{\n    Queue<int> temp = new Queue<int>();\n    int count = 0;\n    while (!q.IsEmpty())\n    {\n        temp.Insert(q.Remove());\n        count++;\n    }\n    while (!temp.IsEmpty())\n    {\n        q.Insert(temp.Remove());\n    }\n    return count;\n}"}]</script>

                if (token === 'C#') return String.raw`\mathtt{C\#}`;

            const TOKEN_RE = /(\[\[[^\]]+\]\]|Queue<(?:int|string)>|Stack<(?:int|string)>|O\(n\^2\)|O\(n\)|O\(1\)|C#|\b(?:FIFO|LIFO|Random Access|PrintWithTempQueue|PrintWithRoll|placeholder|sentinel|dummy|Stack|ArrayList|Queue|CountQueue|CSV|count)\b|(?:Insert|Remove|Head|IsEmpty)\([a-zA-Z0-9, ]*\))/g;

                if (window.MathJax && typeof window.MathJax.tex2chtmlPromise === 'function') {

                } else if (!mathRetryPending) {

                const chunks=[];
                for (let i=0;i<rows.length;i+=6) chunks.push(rows.slice(i,i+6));
                return `<section class="print-page" aria-label="דוח תוצאות"><h1>דוח תוצאות - תורים ב-${inline('C#')}</h1><p>תאריך: ${esc(date)}</p><h2>ציון: ${pct}%</h2><p>${correct} מתוך ${total} תשובות נכונות; ${wrong.length} טעויות לתרגול.</p><h2>מפת שליטה בנושאים</h2>${topicStats(rows)}<p>דוח לימודי אישי. אין כאן שמירת שמות או שליחת מידע לשרת.</p></section>`+
                chunks.map((chunk,i)=>`<section class="print-page" aria-label="שאלות הדוח ${i+1}"><h2>פירוט השאלות - חלק ${i+1}</h2>${chunk.map(r=>`<article class="print-row"><h3>שאלה ${r.q.id}: ${inline(r.q.question)}</h3><p><strong>תשובת התלמיד:</strong> ${inline(r.q.options[r.chosen])} (${r.right?'נכון':'שגוי'})</p><p><strong>תשובה נכונה:</strong> ${inline(r.q.options[r.q.correct])}</p><p><strong>הסבר:</strong> ${inline(r.q.why)}</p></article>`).join('')}</section>`).join('');
            }
            function render(shouldFocus=false) {
                const zoom=Math.min(1.4,Math.max(.9,state.zoom));
                document.documentElement.style.fontSize=(16*zoom)+'px';
                app.innerHTML = state.view==='home'?homeHtml():state.view==='quiz'?quizHtml():state.view==='lab'?labHtml():resultsHtml();
                document.querySelectorAll('nav .nav-btn').forEach(btn=>btn.classList.toggle('active',
                    (btn.dataset.action==='home'&&state.view==='home') || (btn.dataset.action==='lab'&&state.view==='lab') || (btn.dataset.action==='resume'&&['quiz','results'].includes(state.view))));
                const quizLink=document.getElementById('navQuiz');
                quizLink.disabled=state.qids.length===0;
                quizLink.textContent=state.finishedAt?'◉ תוצאות':'◉ החידון';
                const print=document.getElementById('printSheet');
                print.innerHTML=state.view==='results'?printReportHtml():'';
                save(); typeset();
                if (shouldFocus) focusTop();
            }
            function downloadCsv() {
                const {rows,pct}=scoreDetails();
                const record=[['שאלה','נושא','רמת קושי','נוסח השאלה','תשובה שנבחרה','תשובה נכונה','נכון/לא נכון','הסבר']];
                rows.forEach(r=>record.push([r.q.id,r.q.topic,r.q.level,r.q.question,r.q.options[r.chosen].replaceAll('[[','').replaceAll(']]',''),r.q.options[r.q.correct].replaceAll('[[','').replaceAll(']]',''),r.right?'נכון':'שגוי',r.q.why]));
                record.push(['ציון',pct+'%']);
                const csv='\uFEFF'+record.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
                const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
                const url=URL.createObjectURL(blob);
                const a=document.createElement('a'); a.href=url;a.download='queue-quiz-results.csv';a.click();
                setTimeout(()=>URL.revokeObjectURL(url),1000);
            }
            document.addEventListener('click', e=>{
                const control=e.target.closest('[data-action]'); if(!control) return;
                const action=control.dataset.action;
                if (action==='home') { setView('home'); return; }
                if (action==='lab') { setView('lab'); return; }
                if (action==='resume') {
                    if (!state.qids.length) return;
                    setView(state.finishedAt?'results':'quiz'); return;
                }
                if (action==='setmode') {state.mode=control.dataset.mode;render();return;}
                if (action==='start') {startQuiz();return;}
                if (action==='choose') {
                    const q=getCurrent();if(!q||state.mode==='practice'&&state.checked[q.id])return;
                    state.selected[q.id]=Number(control.dataset.original);render();return;
                }
                if (action==='check') {checkCurrent();return;}
                if (action==='goto') {state.current=Number(control.dataset.index);render(true);return;}
                if (action==='prev' && state.current>0) {state.current--;render(true);return;}
                if (action==='next' && state.current<state.qids.length-1) {state.current++;render(true);return;}
                if (action==='finish') {finish();return;}
                if (action==='retry') {
                    const missed=scoreDetails().wrong.map(r=>r.id);
                    if(missed.length){state.mode='practice';startQuiz(missed);}
                    return;
                }
                if (action==='filter') {state.resultsFilter=control.dataset.filter;render();return;}
                if (action==='download') {downloadCsv();return;}
                if (action==='print') {window.print();return;}
                if (action==='bigger'||action==='smaller') {state.zoom=Math.min(1.4,Math.max(.9,state.zoom+(action==='bigger'?.1:-.1)));render();return;}
                if (action==='remove') {
                    if(labQueue.length)labMessage='Remove(): הוצא מראש התור הערך '+labQueue.shift()+'.';
                    render();return;
                }
                if (action==='head') {labMessage=labQueue.length?'Head(): ראש התור הוא '+labQueue[0]+'. התור לא השתנה.':'התור ריק - אין ראש להצגה.';render();return;}
                if (action==='resetlab') {labQueue=[3,5,7];labMessage='התור אופס לערכים 3, 5, 7.';render();return;}
            });
            document.addEventListener('change', e=>{if(e.target?.id==='quizLength'){state.length=Number(e.target.value);save();}});
            document.addEventListener('submit', e=>{
                if(e.target?.id!=='insertForm')return;
                e.preventDefault();
                const input=e.target.querySelector('input[name="value"]');
                const value=Number(input.value);
                if(!Number.isInteger(value)||value < -99 || value>999) {labMessage='הכניסו מספר שלם בין ‎-99 ל־999.';render();return;}
                if(labQueue.length>=10) {labMessage='במעבדה זו התור מוגבל ל־10 איברים כדי לשמור על תצוגה ברורה.';render();return;}
                labQueue.push(value);labMessage='Insert('+value+'): הערך '+value+' נוסף לסוף התור.';render();
            });
            document.addEventListener('toggle',e=>{
                if(e.target.matches('.hint-box')&&state.view==='quiz') {
                    const q=getCurrent();if(q) {state.hints[q.id]=e.target.open;save();}
                }
            },true);
            document.addEventListener('keydown',e=>{
                if(state.view!=='quiz'||e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target?.tagName))return;
                if(['1','2','3'].includes(e.key) && !e.target.closest('button')) {
                    const q=getCurrent();if(!q||state.mode==='practice'&&state.checked[q.id])return;
                    const original=state.order[q.id][Number(e.key)-1];state.selected[q.id]=original;render();announce('נבחרה אפשרות '+e.key);return;
                }
                if(e.key==='ArrowLeft' && state.current<state.qids.length-1){state.current++;render(true);}
                if(e.key==='ArrowRight' && state.current>0){state.current--;render(true);}
                if(e.key==='Enter' && e.target===document.body && state.mode==='practice' && !state.checked[getCurrent().id])checkCurrent();
            });
            safeLoad();
            // A completed session remains available when returning to the homepage.
            if(!state.qids.length && ['quiz','results'].includes(state.view))state.view='home';
            render();
            window.addEventListener('load', () => { typeset(); });
            window.addEventListener('beforeprint',()=>{typeset();});
            // Public lightweight tests for the question bank; no build system required.
            window.QueueQuestQA = () => ({
                count:QUESTION_BANK.length,
                ids:QUESTION_BANK.every((q,i)=>q.id===i+1),
                options:QUESTION_BANK.every(q=>q.options.length===3&&new Set(q.options).size===3),
                keys:QUESTION_BANK.every(q=>Number.isInteger(q.correct)&&q.correct>=0&&q.correct<3),
                explanations:QUESTION_BANK.every(q=>[0,1,2].filter(i=>i!==q.correct).every(i=>Boolean(q.explanation[i]))),
                hints:QUESTION_BANK.every(q=>Boolean(q.hint&&q.why)),
                api:!QUESTION_BANK.some(q=>(q.code||'').includes('Enqueue(')||(q.code||'').includes('Dequeue('))
            });
        })();
    </script>
</body>
</html>

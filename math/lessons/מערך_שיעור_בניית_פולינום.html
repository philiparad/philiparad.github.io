<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="מערך שיעור ללמידה עצמית בנושא בניית פולינום לפי נתונים, ברמת 5 יחידות לימוד.">
  <title>בניית פולינום לפי נתונים — חוברת למידה עצמית</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraph.css">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true
      },
      chtml: { scale: 0.92 },
      startup: { typeset: false }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jsxgraph@1.11.1/distrib/jsxgraphcore.js"></script>
  <style>
    :root{
      --ink:#17243a;--muted:#5a6679;--navy:#183753;--blue:#2868aa;--teal:#128078;
      --gold:#d89524;--rose:#b94f67;--line:#dbe3e9;--paper:#fffefa;--soft:#f3f7fa;
      --easy:#23836f;--medium:#b77a17;--hard:#a8435a;
    }
    *{box-sizing:border-box}
    html{background:#dfe6eb}
    body{
      margin:0;color:var(--ink);background:#dfe6eb;
      font-family:Arial,"Noto Sans Hebrew",sans-serif;line-height:1.42;overflow-x:hidden
    }
    #book{width:210mm;margin:8mm auto}
    section.a4-page{
      position:relative;width:210mm;height:297mm;min-height:297mm;max-height:297mm;
      margin:0 0 8mm;padding:14mm 15mm 13mm;background:var(--paper);
      box-shadow:0 7px 25px rgba(24,55,83,.15);overflow:hidden;break-after:page;page-break-after:always
    }
    section.a4-page:last-child{break-after:auto;page-break-after:auto}
    .page-head{display:flex;align-items:center;justify-content:space-between;gap:8mm;
      margin-bottom:5mm;padding-bottom:3mm;border-bottom:.45mm solid var(--navy)}
    .page-head h1,.page-head h2{margin:0;color:var(--navy);line-height:1.15}
    .page-head h1{font-size:21pt}.page-head h2{font-size:15.5pt}
    .kicker{color:var(--teal);font-size:8.5pt;font-weight:800}
    .page-no{display:grid;place-items:center;min-width:9mm;height:9mm;border-radius:50%;
      color:#fff;background:var(--navy);font-size:8.5pt;font-weight:800}
    .footer{position:absolute;right:15mm;left:15mm;bottom:6mm;display:flex;justify-content:space-between;
      padding-top:2mm;border-top:.25mm solid var(--line);color:var(--muted);font-size:7.2pt}
    .cover{color:#fff!important;background:linear-gradient(135deg,#142b48,#226184 58%,#138078)!important}
    .cover:after{content:"f(x)";position:absolute;left:13mm;top:4mm;color:rgba(255,255,255,.075);
      font:700 86pt Georgia,serif;direction:ltr}
    .cover-inner{display:flex;height:100%;flex-direction:column;justify-content:center;position:relative;z-index:1}
    .cover .badge{width:max-content;padding:2mm 4mm;border:.3mm solid rgba(255,255,255,.4);border-radius:20mm;
      background:rgba(255,255,255,.08);font-size:9pt;font-weight:700}
    .cover h1{margin:8mm 0 4mm;max-width:165mm;font-size:35pt;line-height:1.12;letter-spacing:-.6pt}
    .cover p{max-width:150mm;color:rgba(255,255,255,.9);font-size:14pt}
    .cover-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin-top:14mm}
    .cover-stat{padding:5mm;border:.3mm solid rgba(255,255,255,.25);border-radius:4mm;background:rgba(255,255,255,.08)}
    .cover-stat strong{display:block;font-size:22pt}.cover-stat span{font-size:9pt}
    .intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
    .card{padding:4.5mm;border:.3mm solid var(--line);border-radius:3.5mm;background:#fff}
    .card.teal{border-color:#b9ded8;background:#edf8f6}
    .card.gold{border-color:#ecd7a8;background:#fff8e8}
    h3{margin:0 0 2mm;color:var(--navy);font-size:12pt}
    h4{margin:0 0 1.5mm;color:var(--navy);font-size:10pt}
    p{margin:0 0 2.7mm}
    ul,ol{margin:1.5mm 0 3mm;padding-right:5.5mm}
    li{margin-bottom:1.4mm}
    .topic-map{display:grid;grid-template-columns:1fr 1fr;gap:2.4mm;margin-top:4mm;counter-reset:item}
    .topic-map div{counter-increment:item;padding:2.5mm 3mm;border:.3mm solid var(--line);border-radius:2.5mm;background:#fff;font-size:9pt}
    .topic-map div:before{content:counter(item);display:inline-grid;place-items:center;width:6mm;height:6mm;
      margin-left:2mm;border-radius:50%;color:#fff;background:var(--blue);font-weight:800}
    .objective{padding:3.5mm 4mm;border-right:1.2mm solid var(--teal);background:#edf8f6}
    .formula-box{margin:3mm 0;padding:3.5mm 4mm;border:.3mm solid #cdddea;border-radius:3mm;background:#f2f7fb}
    .example{margin:3mm 0;padding:3.5mm 4mm;border-right:1.2mm solid var(--gold);background:#fff8e9}
    .check{margin-top:3mm;padding:3mm 4mm;border:.3mm solid #c6e2dd;border-radius:3mm;background:#f0faf8;font-size:9pt}
    .source-note{margin-top:3mm;color:var(--muted);font-size:7.6pt}
    .source-note a{color:#356d9d}
    .theory-layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:5mm}
    .theory-layout>*{min-width:0}
    .graph-card{min-width:0;padding:3mm;border:.3mm solid var(--line);border-radius:3mm;background:#fff;overflow:hidden}
    .jxgbox{width:100%;height:72mm;border:.3mm solid #cbd6df!important;border-radius:2mm;direction:ltr}
    .jxgbox .JXGtext{direction:ltr!important;unicode-bidi:isolate}
    .graph-caption{margin-top:2mm;color:var(--muted);font-size:8pt}
    .exercise-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4mm}
    .level{padding:1.7mm 4mm;border-radius:20mm;color:#fff;font-size:9pt;font-weight:800}
    .level.easy{background:var(--easy)}.level.medium{background:var(--medium)}.level.hard{background:var(--hard)}
    .exercise-list{margin:0;padding:0;list-style:none;counter-reset:ex}
    .exercise{counter-increment:ex;display:grid;grid-template-columns:8mm 1fr;gap:2mm;
      min-height:20mm;padding:2.8mm 0;border-bottom:.25mm solid var(--line);font-size:9.5pt}
    .exercise:last-child{border-bottom:0}
    .exercise:before{content:attr(data-n);display:grid;place-items:center;width:7mm;height:7mm;border-radius:50%;
      color:#fff;background:var(--blue);font-size:7.5pt;font-weight:800}
    .exercise.medium:before{background:var(--medium)}.exercise.hard:before{background:var(--hard)}
    .exercise p{margin:0}
    .exercise .parts{margin:1mm 0 0;padding-right:5mm;font-size:8.8pt}
    .mini-board{width:46mm;height:32mm;float:left;margin:0 3mm 1mm 0;border:.25mm solid var(--line)!important}
    .rubric{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;margin-top:5mm}
    .rubric div{padding:3mm;border:.3mm solid var(--line);border-radius:2.5mm;background:#fff;text-align:center;font-size:8.5pt}
    mjx-container{direction:ltr!important;text-align:inherit!important}
    mjx-container[display="true"]{margin:2.5mm 0!important}
    @media(max-width:850px){
      #book{width:210mm;transform-origin:top right}
    }
    @media print{
      @page{size:A4 portrait;margin:0}
      html,body{width:210mm;background:#fff}
      #book{width:210mm;margin:0}
      section.a4-page{margin:0;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}
    }
  </style>
</head>
<body>
  <main id="book" aria-label="חוברת למידה עצמית"></main>

  <script>
  (() => {
    "use strict";
    const $ = (sel, root=document) => root.querySelector(sel);
    const esc = s => String(s);
    const L = s => `\\(${s}\\)`;

    const sources = {
      campus: ['Campus IL — הכנה לבגרות 571', 'https://campus.gov.il/course/moe-edu-matric-571mathmatriculation5a-he/'],
      simply: ['פשוט מתמטיקה — לינאריות, ריבועיות ופולינומים', 'https://campus.gov.il/course/v1iit-acd-rfp4-simplylinear/'],
      openstax: ['OpenStax College Algebra — Chapter 5', 'https://openstax.org/books/college-algebra/pages/5-introduction-to-polynomial-and-rational-functions'],
      ti: ['Texas Instruments — Multiplicity of Zeros', 'https://education.ti.com/activity/detail/multiplicity-of-zeros-of-functions'],
      mont: ['Montgomery College — Polynomial Functions', 'https://info.montgomerycollege.edu/_documents/faculty/maronne/math165/ch4-handouts/ch4-1.pdf'],
      alamo: ['Alamo Colleges — Polynomial Functions', 'https://www.alamo.edu/contentassets/afe30946fa58450c89840c1173f3b9d0/polynomial/math1314-polynomial-functions.pdf'],
      pc12: ['Pre-Calculus 12 — Polynomial Functions', 'https://fkss.sd79.bc.ca/wp-content/uploads/sites/3/2018/02/PC12-Ch-3.pdf'],
      stuttgart: ['Universität Stuttgart — Polynomnullstellen', 'https://pnp.mathematik.uni-stuttgart.de/iadm/Zirkel/material-Schuelerseminar/Polynomnullstellen/index.html'],
      spanish: ['OpenStax Precálculo 2ed — Capítulo 3', 'https://openstax.org/books/prec%C3%A1lculo-2ed/pages/3-ejercicios-de-repaso']
    };

    const poly = [
      ['3x^4-2x^2+7',4,3],['-5x^7+x^3-1',7,-5],['2-9x^5',5,-9],['x^6-4x+8',6,1],
      ['-x^3+6x^2',3,-1],['7x^2-3x+1',2,7],['4x^8-x^4+2',8,4],['-2x^9+5',9,-2]
    ];
    const rootsSets = [
      [-3,1,4],[-2,0,5],[-5,-1,2],[1,3,6],[-4,2,7],[-6,-2,3],[0,2,8],[-7,1,5]
    ];
    const factored = rootsSets.map(r => `(x${r[0]<0?'+':''}${-r[0]})(x${r[1]<0?'+':''}${-r[1]})(x${r[2]<0?'+':''}${-r[2]})`
      .replace(/\+\-/g,'-').replace(/x0/g,'x'));
    const fmtFactor = r => r===0 ? 'x' : `(x${r<0?'+':'-'}${Math.abs(r)})`;
    const product = (rs, powers=[]) => rs.map((r,i)=>`${fmtFactor(r)}${(powers[i]||1)>1?`^{${powers[i]}}`:''}`).join('');
    const make = (arr, fn) => arr.map(fn);

    const topics = [
      {
        title:'שפת הפולינומים והייצוגים השונים',
        goal:'לזהות דרגה, מקדם מוביל ואיבר חופשי, ולעבור בביטחון בין צורה כללית לצורה מפורקת.',
        theory:[
          `פולינום הוא סכום סופי מן הצורה ${L('P(x)=a_nx^n+\\cdots+a_1x+a_0')}, כאשר ${L('a_n\\ne0')}.`,
          `הדרגה היא החזקה הגבוהה ביותר שמקדמה אינו אפס. המקדם המוביל הוא ${L('a_n')}, והאיבר החופשי הוא ${L('a_0')}.`,
          `במכפלה, הדרגות מתחברות והמקדמים המובילים מוכפלים. לכן אפשר לזהות דרגה ומקדם מוביל גם בלי לפתוח סוגריים.`
        ],
        formula:'\\deg(PQ)=\\deg(P)+\\deg(Q),\\qquad LC(PQ)=LC(P)\\cdot LC(Q)',
        example:`עבור ${L('P(x)=-2(x-1)^3(x+4)^2')}: הדרגה היא ${L('5')}, המקדם המוביל הוא ${L('-2')}, והאיבר החופשי הוא ${L('P(0)=32')}.`,
        check:'אני יודע להסביר כיצד מצאתי את הדרגה והמקדם המוביל, ולא רק לציין אותם.',
        refs:['simply','openstax','mont'],
        exercises:{
          easy: make(poly,(p,i)=>`נתון ${L(`P(x)=${p[0]}`)}. מצאו את דרגת הפולינום, המקדם המוביל והאיבר החופשי.`),
          medium: [
            `בלי לפתוח סוגריים, מצאו דרגה ומקדם מוביל של ${L('P(x)=-3(x-2)^4(x+1)^3')}.`,
            `בלי לפתוח סוגריים, מצאו דרגה ומקדם מוביל של ${L('Q(x)=2x^2(x-5)^3(x+4)')}.`,
            `פתחו וכנסו איברים: ${L('(x-3)(x^2+2x-5)')}.`,
            `פתחו וכנסו איברים: ${L('(2x+1)(x-4)^2')}.`,
            `כתבו בצורה מפורקת: ${L('x^3-4x^2-x+4')}.`,
            `כתבו בצורה מפורקת: ${L('2x^3+6x^2-8x-24')}.`,
            `מצאו ${L('a')} אם המקדם המוביל של ${L('a(x-1)^2(x+3)^4')} הוא ${L('-5')}.`,
            `מצאו ${L('m')} כך שדרגת ${L('(m-2)x^6+3x^4-x+1')} תהיה קטנה מ־${L('6')}.`,
            `האם ${L('x^{-2}+3x+1')} הוא פולינום? נמקו לפי ההגדרה.`
          ],
          hard:[
            `נתון ${L('P(x)=a(x-2)^3(x+1)^2')} והאיבר החופשי הוא ${L('32')}. מצאו את ${L('a')} ואת המקדם המוביל.`,
            `נתון ${L('P(x)=(2x-1)^3(x+4)^2')}. מצאו את שני האיברים בעלי החזקות הגבוהות ביותר בלי לפתוח את כל המכפלה.`,
            `קבעו את ${L('m')} ואת ${L('n')} אם ${L('(x-2)(x^2+mx+n)=x^3-5x^2+8x-4')}.`,
            `מצאו פולינום ממעלה רביעית שהמקדם המוביל שלו ${L('3')}, האיבר החופשי שלו ${L('-12')}, והוא מתחלק ב־${L('x^2-1')}.`,
            `הוכיחו כי לכל ${L('n\\in\\mathbb{N}')}, דרגת ${L('(x^2+1)^n(x-3)')} היא ${L('2n+1')}.`,
            `נתון ${L('P(x)+Q(x)=5x^4-2x+1')} ו־${L('P(x)-Q(x)=x^4+6x^2-3')}. מצאו את ${L('P(x)')} ואת ${L('Q(x)')}.`,
            `בנו שני פולינומים שונים ממעלה ${L('5')} בעלי אותו מקדם מוביל ואותו איבר חופשי. הסבירו מדוע תשובתכם תקפה.`,
            `מצאו את כל ערכי ${L('a')} שעבורם דרגת ${L('(a^2-4)x^5+(a-2)x^4+x+1')} היא בדיוק ${L('4')}.`
          ]
        }
      },
      {
        title:'נקודות אפס של פונקציה ונקודות חיתוך עם הצירים',
        goal:'לתרגם בין משוואה, ערך פונקציה ונקודת חיתוך עם ציר האופקי.',
        theory:[
          `המספר ${L('r')} הוא אפס של ${L('f')} אם ורק אם ${L('f(r)=0')}.`,
          `אפס ${L('r')} מתאים לנקודת החיתוך ${L('(r,0)')} עם ציר ${L('x')}. חיתוך עם ציר ${L('y')} מתקבל מהצבה ${L('x=0')}.`,
          `בצורה מפורקת מפעילים את כלל המכפלה האפסית: מכפלה שווה לאפס אם לפחות אחד מגורמיה שווה לאפס.`
        ],
        formula:'f(r)=0\\iff r\\text{ is a zero}\\iff(r,0)\\text{ is an }x\\text{-intercept}',
        example:`עבור ${L('f(x)=\\frac{1}{3}(x+3)(x-1)(x-4)')}, האפסים הם ${L('-3,1,4')}, וחיתוך ציר ${L('y')} הוא ${L('(0,4)')}.`,
        check:'אני מבחין בין “אפס” שהוא מספר לבין “נקודת חיתוך” שהיא זוג סדור.',
        refs:['campus','openstax','alamo'],
        graph:'zeros',
        exercises:{
          easy: rootsSets.map(rs=>`מצאו את האפסים ואת נקודות החיתוך עם ציר ${L('x')} של ${L(`f(x)=${product(rs)}`)}.`),
          medium:[
            `מצאו את כל חיתוכי הצירים של ${L('f(x)=x(x-2)(x+5)')}.`,
            `בדקו בהצבה אם ${L('x=3')} הוא אפס של ${L('P(x)=x^3-4x^2+x+6')}.`,
            `בדקו בהצבה אם ${L('x=-2')} הוא אפס של ${L('P(x)=2x^3+3x^2-8x-12')}.`,
            `מצאו את ערך ${L('m')} אם הנקודה ${L('(2,0)')} נמצאת על ${L('f(x)=x^3+mx^2-4x+4')}.`,
            `מצאו את ערך ${L('k')} אם חיתוך ציר ${L('y')} של ${L('f(x)=k(x-1)(x+3)')} הוא ${L('(0,12)')}.`,
            `לפונקציה ${L('f')} אפסים ${L('-4,1,5')}. כתבו שלוש נקודות השייכות לגרף בוודאות.`,
            `נתון ${L('f(2)=0')}, ${L('f(-1)=0')} ו־${L('f(0)=6')}. איזה מידע מתאר חיתוכי צירים?`,
            `פתרו ${L('(2x-3)(x+4)(x-1)=0')} ורשמו את הפתרונות בסדר עולה.`,
            `מצאו את כל האפסים הממשיים של ${L('x^4-5x^2+4')}.`
          ],
          hard:[
            `מצאו את כל ערכי ${L('m')} שעבורם ${L('x=2')} הוא אפס של ${L('P(x)=x^4-mx^2+2m-8')}.`,
            `הפולינום ${L('P(x)=x^3+ax^2+bx-6')} מתאפס ב־${L('1')} וב־${L('2')}. מצאו קשר בין ${L('a')} ל־${L('b')}.`,
            `האם ייתכן פולינום ממעלה שנייה בעל שלוש נקודות חיתוך שונות עם ציר ${L('x')}? נמקו.`,
            `מצאו פולינום ממעלה שלישית שחיתוכיו עם ציר ${L('x')} הם ${L('(-2,0),(1,0),(4,0)')} וחיתוכו עם ציר ${L('y')} הוא ${L('(0,16)')}.`,
            `נתון ${L('P(x)=x^4-2x^3-7x^2+8x+12')}. הראו כי ${L('x=-1')} ו־${L('x=2')} הם אפסים ומצאו את יתר האפסים.`,
            `פולינום ממעלה שלישית מתאפס ב־${L('-3,1,2')} ומקבל ב־${L('x=0')} את הערך ${L('-12')}. מצאו אותו.`,
            `הוכיחו: אם ${L('P(0)=0')}, אז האיבר החופשי של ${L('P')} הוא אפס.`,
            `נתון ${L('P(x)=x^3+px+q')} והנקודות ${L('(1,0),(-2,0)')} על הגרף. מצאו את ${L('p,q')} ואת האפס השלישי.`
          ]
        }
      },
      {
        title:'בניית פולינום מאפסים',
        goal:'לבנות משפחת פולינומים מאפסים נתונים ולקבוע את קבוע הכפל מנתון נוסף.',
        theory:[
          `אם האפסים הם ${L('r_1,\\ldots,r_k')}, אז כל פולינום שמכיל אותם הוא מהצורה ${L('f(x)=a(x-r_1)(x-r_2)\\cdots(x-r_k)')}, כאשר ${L('a\\ne0')}.`,
          `האפסים לבדם אינם קובעים בדרך כלל פונקציה יחידה; הקבוע ${L('a')} משפיע על מתיחה, כיווץ ושיקוף.`,
          `נקודה נוספת ${L('(x_0,y_0)')} קובעת את ${L('a')} באמצעות הצבה בצורת המכפלה.`

          <ol class="exercise-list">${ex.map((q,i)=>{
            const start=key==='easy'?1:key==='medium'?9:18;
            return `<li class="exercise ${key}" data-n="${start+i}"><p>${esc(q)}</p></li>`;
          }).join('')}</ol>
          ${footer(`יחידה ${ti+1} · ${label}`)}`);
      });
    });

    [...document.querySelectorAll('.footer-page')].forEach((el,i)=>el.textContent=`עמוד ${i+1} מתוך ${document.querySelectorAll('.a4-page').length}`);

    function initBoards(){
      if(!window.JXG) throw new Error('JSXGraph failed to load');
      JXG.Options.text.useMathJax=false;
      const common={axis:true,boundingbox:[-6,12,6,-12],showCopyright:false,showNavigation:false,keepaspectratio:false,pan:{enabled:false},zoom:{enabled:false}};
      const colors=['#2868aa','#b94f67','#128078'];
      if($('#board-zeros')){
        const b=JXG.JSXGraph.initBoard('board-zeros',common);
        b.create('functiongraph',[x=>(1/3)*(x+3)*(x-1)*(x-4),-5,5],{strokeColor:colors[0],strokeWidth:2.5});
        [-3,1,4].forEach(r=>b.create('point',[r,0],{name:`(${r}, 0)`,size:2.5,fixed:true,color:colors[1]}));
      }
      if($('#board-multiplicity')){
        const b=JXG.JSXGraph.initBoard('board-multiplicity',{...common,boundingbox:[-4,8,5,-8]});
        b.create('functiongraph',[x=>0.1*(x+2)**2*(x-1)**3,-4,4],{strokeColor:colors[0],strokeWidth:2.5});
        [-2,1].forEach(r=>b.create('point',[r,0],{name:r===-2?'נוגע':'חותך',size:2.4,fixed:true,color:r===-2?colors[2]:colors[1]}));
      }
      if($('#board-endbehavior')){
        const b=JXG.JSXGraph.initBoard('board-endbehavior',{...common,boundingbox:[-4,10,4,-10]});
        b.create('functiongraph',[x=>-0.12*x**5+0.8*x,-3.1,3.1],{strokeColor:colors[1],strokeWidth:2.5});
        b.create('text',[-3.4,7.7,'left end up'],{fixed:true,color:'#5a6679',fontSize:11});
        b.create('text',[1.25,-7.7,'right end down'],{fixed:true,color:'#5a6679',fontSize:11});
      }
      if($('#board-signs')){
        const b=JXG.JSXGraph.initBoard('board-signs',{...common,boundingbox:[-5,9,6,-9]});
        b.create('functiongraph',[x=>0.12*(x+2)*(x-1)**2*(x-4),-5,6],{strokeColor:colors[2],strokeWidth:2.5});
        [-2,1,4].forEach(r=>b.create('point',[r,0],{name:String(r),size:2.3,fixed:true,color:colors[1]}));
      }
    }

    function validate(){
      const pages=[...document.querySelectorAll('section.a4-page')];
      const overflow=pages.filter(p=>p.scrollHeight>p.clientHeight+2 || p.scrollWidth>p.clientWidth+2);
      const total=[...document.querySelectorAll('.exercise')].length;
      const boards=[...document.querySelectorAll('.jxgbox')];
      window.__BOOK_QA__={
        pages:pages.length, exercises:total, overflowPages:overflow.map((p,i)=>i+1),
        mathErrors:[...document.querySelectorAll('mjx-merror')].length,
        boards:boards.length, renderedBoards:boards.filter(b=>b.querySelector('svg')).length
      };
      document.documentElement.dataset.ready='true';
    }

    window.addEventListener('load',async()=>{
      initBoards();
      if(!window.MathJax) throw new Error('MathJax failed to load');
      await MathJax.typesetPromise();
      requestAnimationFrame(()=>requestAnimationFrame(validate));
    });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="0">
        <link rel="icon" type="image/png" href="philip_favicon.png">
        <title>שליחת הודעה בדוא״ל</title>
        <style>
            * { box-sizing: border-box; }
            body { margin: 0; padding: 28px 14px; min-height: 100vh; background: #eef3fa; font-family: Arial, sans-serif; color: #172b4d; }
            main { max-width: 580px; margin: 30px auto; padding: 32px; background: #fff; border: 2px solid #d7e3f2; border-radius: 18px; box-shadow: 0 12px 32px #20345912; }
            h1 { margin-top: 0; font-size: 1.7rem; }
            p { line-height: 1.6; color: #45556e; }
            label { display: block; margin: 18px 0 7px; font-weight: 700; }
            input, textarea { display: block; width: 100%; border: 2px solid #c5d3e4; border-radius: 9px; padding: 12px; font: inherit; background: #fff; color: #15233a; }
            input:focus, textarea:focus { outline: 3px solid #b9d4ff; border-color: #245db8; }
            textarea { min-height: 150px; resize: vertical; }
            button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 10px; background: #1956ac; color: white; font: 700 1rem Arial, sans-serif; cursor: pointer; }
            button:hover { background: #104387; }
            button:disabled { opacity: .65; cursor: progress; }
            #status { min-height: 28px; margin-top: 12px; font-weight: 700; }
            .error { color: #ac2424; }
            .info { color: #225c9b; }
            small { display: block; margin-top: 20px; line-height: 1.6; color: #58677e; }
        </style>
    </head>
    <body>
        <main>
            <h1>✉️ שליחת הודעה</h1>
            <p>ההודעה תישלח אל <strong dir="ltr">philip.arad@gmail.com</strong>.</p>
            <form id="emailForm" action="https://formsubmit.co/philip.arad@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="הודעה חדשה מטופס האתר">
                <input type="hidden" name="_captcha" value="true">
                <input type="hidden" name="_template" value="table">
                <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">

                <label for="senderName">שם השולח</label>
                <input id="senderName" name="name" type="text" maxlength="100" autocomplete="name" required>

                <label for="senderEmail">כתובת הדוא״ל של השולח</label>
                <input id="senderEmail" name="email" type="email" dir="ltr" maxlength="254" autocomplete="email" required>

                <label for="subject">נושא</label>
                <input id="subject" name="subject" type="text" maxlength="150" required>

                <label for="message">תוכן ההודעה</label>
                <textarea id="message" name="message" maxlength="10000" required></textarea>

                <button type="submit" id="sendButton">שליחת הודעה</button>
                <div id="status" role="status" aria-live="polite"></div>
            </form>
            <small>השליחה מתבצעת באמצעות FormSubmit, שירות חיצוני. בפעם הראשונה בעל כתובת הנמען יצטרך לאשר הודעת הפעלה שתגיע לתיבת הדוא״ל. לאחר לחיצה על שליחה תועברו לדף השירות להצגת התוצאה או לאימות אנושי. אין לשלוח מידע רגיש בטופס.</small>
        </main>
        <script>
            const form = document.getElementById('emailForm');
            const button = document.getElementById('sendButton');
            const status = document.getElementById('status');
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    form.reportValidity();
                    return;
                }
                button.disabled = true;
                button.textContent = 'מעביר לשירות השליחה…';
                status.textContent = 'נפתח תהליך השליחה; השלמתו תלויה בשירות FormSubmit ובאימות הנמען.';
                status.className = 'info';
                // Normal POST follows. The page deliberately does not claim the email was sent.
            });
        </script>
    </body>
</html>

name: Cross-browser acceptance — M41
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'styles.css'
      - 'index.html'
      - 'tools/**'
      - '.github/workflows/browser-acceptance.yml'
permissions:
  contents: read
jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local calculator regression suite
        run: node tests/run-node.cjs
      - name: Validate browser evidence gate
        run: python -m unittest discover -s tools/tests -v
      - name: Install browser testing dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Validate release candidate source inventory
        run: python tools/release_gate.py verify
      - name: Run actual browser matrix
        run: python tools/browser_matrix.py --out browser-evidence
      - name: Audit captured browser evidence against this checkout
        if: always()
        run: python tools/evidence_review.py browser-evidence --out browser-evidence/evidence-review.json
      - name: Generate a human-readable fail-closed release decision
        if: always()
        run: python tools/release_report.py --evidence browser-evidence --out release-evidence
      - name: Generate actionable CI diagnostics even if evidence is missing
        if: always()
        run: python tools/ci_diagnostics.py --matrix browser-evidence/matrix-run.json --decision release-evidence/release-decision.json --out release-evidence/ci-diagnostics.json
      - name: Verify release report module unit tests
        if: always()
        run: python -m unittest discover -s tools/tests -v
      - name: Upload browser run evidence, even when blocked or failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            browser-evidence/
            release-evidence/
          if-no-files-found: warn
name: CASIO three-model reference parity and browser evidence
permissions:
  contents: read
  issues: write
on:
  workflow_dispatch:
  push:
    paths:
      - 'calculator/index.html'
      - 'calculator/fx991_fresh_standalone.html'
      - 'calculator/parity-lab.html'
      - 'calculator/js/model-profiles.js'
      - 'calculator/js/menu-model.js'
      - 'calculator/js/keypad.js'
      - 'calculator/reference/device-parity/**'
      - '.github/workflows/casio-three-model-parity.yml'
  pull_request:
    paths:
      - 'calculator/index.html'
      - 'calculator/parity-lab.html'
      - 'calculator/js/**'
      - 'calculator/reference/device-parity/**'
      - '.github/workflows/casio-three-model-parity.yml'
jobs:
  source-and-model-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check model and math source syntax
        run: |
          node --check calculator/js/model-profiles.js
          node --check calculator/js/math-engine.js
          node --check calculator/reference/device-parity/test_model_contract.cjs
          node --check calculator/reference/device-parity/test_scientific_features.cjs
          node --check calculator/reference/device-parity/test_edition_gates.cjs
          node --check calculator/reference/device-parity/test_manual_rounding.cjs
          node --check calculator/reference/device-parity/test_native_screen_layout.cjs
          node --check calculator/reference/device-parity/test_high_resolution_lcd.cjs
      - name: Test model capabilities, keys, math and statistics
        run: |
          node calculator/reference/device-parity/test_model_contract.cjs
          node calculator/reference/device-parity/test_scientific_features.cjs
          node calculator/reference/device-parity/test_edition_gates.cjs
          node calculator/reference/device-parity/test_manual_rounding.cjs
          node calculator/reference/device-parity/test_native_screen_layout.cjs
          node calculator/reference/device-parity/test_high_resolution_lcd.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-comparison dependency
        run: python -m pip install Pillow
      - name: Verify evidence validation rejects unreviewed or forged references
        run: python -m unittest discover -s calculator/reference/device-parity -p 'test_evidence.py' -v
      - name: Check normalized LCD comparator (synthetic fixtures)
        run: python -m unittest discover -s calculator/reference/device-parity -p 'test_lcd_compare.py' -v
      - name: Check canonical standalone build
        run: python3 calculator/tools/build_standalone.py --check
  browser-key-and-lcd-evidence:
    runs-on: ubuntu-latest
    needs: source-and-model-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Generate browser-only keyflow and LCD evidence for all 3 models
        run: python calculator/reference/device-parity/run_browser.py
      - name: Evaluate evidence provenance without inventing native measurements
        if: always()
        run: |
          if [ -f calculator/reference/device-parity/browser-evidence/report.json ]; then
            python calculator/reference/device-parity/verify_evidence.py calculator/reference/device-parity/browser-evidence/report.json --output calculator/reference/device-parity/browser-evidence/verified.json
          fi
      - name: Upload browser screenshots, trace JSON and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casio-three-model-browser-evidence
          path: calculator/reference/device-parity/browser-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Record browser CI observations in REA-123
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'calculator/reference/device-parity/browser-evidence/report.json';
            const outcome = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : null;
            const failures = outcome ? outcome.records.filter(r => !r.browser_pass) : [];
            const total = outcome ? outcome.records.length : 0;
            const passed = outcome ? outcome.pass_count : 0;
            const modelSummary = outcome
              ? [...new Set(outcome.records.map(r => r.model))].map(model => {
                  const rows = outcome.records.filter(r => r.model === model);
                  return '- ' + model + ': ' + rows.filter(r => r.browser_pass).length + '/' + rows.length + ' browser scenarios';
                }).join('\n')
              : '- No browser report was generated; inspect the CI logs.';
            const issues = failures.slice(0, 12).map(r =>
              '- ' + r.model + '/' + r.scenario_id + ': ' + JSON.stringify(r.problems || [])
            ).join('\n');
            const body = [
              '### Three-model browser verification (CI runner)',
              '- Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- Commit: ' + context.sha,
              '- Browser scenarios: **' + passed + '/' + total + ' passed**',
              '- Hardware/device parity: **NOT VERIFIED** (no physical reference captured)',
              '- Evidence: workflow artifact \`casio-three-model-browser-evidence\` (keylogs, LCD PNGs, hashes, report.json)',
              modelSummary,
              ...(failures.length ? ['Failures:', issues] : []),
              '',
              'All screenshots and key logs are generated by the independent web calculator; none are native CASIO hardware observations.'
            ].join('\n');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: 77,
              body
            });

name: Teaching Board regression suite
on:
  push:
    paths:
      - 'teaching-board/**'
      - '.github/workflows/teaching-board-tests.yml'
  pull_request:
    paths:
      - 'teaching-board/**'
      - '.github/workflows/teaching-board-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teaching-board:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript module syntax
        run: |
          for file in teaching-board/js/*.js; do
            node --check "$file"
          done
      - name: Run Teaching Board tests
        run: node --test teaching-board/tests/*.test.mjs
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve repository as deployed static files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/teaching-board-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/teaching-board/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/teaching-board-http.log
          exit 1
      - name: Test browser editing, text layout and A4 flow
        env:
          TEACHING_BOARD_BROWSER: ${{ matrix.browser }}
        run: node teaching-board/browser-tests/smoke.browser.mjs
      - name: Pixel compare editor rendering and SVG export
        env:
          TEACHING_BOARD_BROWSER: ${{ matrix.browser }}
        run: node teaching-board/browser-tests/visual-parity.browser.mjs
      - name: Upload inspectable golden scene PNGs and difference maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-board-visual-${{ matrix.browser }}
          path: /tmp/teaching-board-visual-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Ensure independent PDF raster tools are available
        if: matrix.browser == 'chromium'
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Render actual A4 print output to PDF and check each rasterized page
        if: matrix.browser == 'chromium'
        run: node teaching-board/browser-tests/pdf-print.browser.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: teaching-board-${{ matrix.browser }}-failure
          path: |
            /tmp/teaching-board-browser-failure.png
            /tmp/teaching-board-visual-parity-failure.png
            /tmp/teaching-board-http.log
          if-no-files-found: ignore

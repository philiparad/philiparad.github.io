<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>מורה אישי — בנייה וסריקה של רשימות מקושרות</title><style>
:root{font-family:Arial,'Segoe UI',sans-serif;color:#18314b;background:#edf5ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf5ff,#f9f7ed);font-size:18px;line-height:1.7}header{background:#183c67;color:white;padding:17px max(24px,calc((100vw - 1200px)/2));border-bottom:5px solid #5cb6e8}header h1{font-size:27px;margin:0}header small{color:#d7eeff}main{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:18px;padding:0 16px}.panel{background:white;border:2px solid #cadbee;border-radius:18px;padding:24px;box-shadow:0 6px 18px #17335416;min-width:0}.label{font-size:14px;color:#295c91;font-weight:bold;background:#e7f2ff;border-radius:18px;padding:4px 12px;display:inline-block}h2{font-size:26px;line-height:1.35;margin:12px 0}h3{font-size:20px;margin:15px 0 8px}.explain{border-right:5px solid #4f9ed0;padding:8px 15px;background:#f2f8ff;border-radius:10px}.demo{background:#f6faff;border:2px solid #d5e6f5;border-radius:12px;padding:14px;margin:16px 0}.source{font-weight:bold;direction:ltr;text-align:center;unicode-bidi:isolate}.visual{display:flex;justify-content:center;align-items:center;gap:6px;direction:ltr;flex-wrap:wrap;margin:12px 0}.node{border:2px solid #3476ab;background:white;border-radius:9px;min-width:45px;text-align:center;padding:4px 7px;font-weight:bold;color:#143c66}.arrow{font-weight:bold;color:#326fa6}.null{color:#7a4967}pre{direction:ltr;text-align:left;overflow:auto;background:#142b46;color:#f0f8ff;padding:15px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre}details{margin:10px 0}summary{cursor:pointer;color:#175b95;font-weight:bold}.question{margin-top:18px;border-top:2px solid #e4ecf4;padding-top:12px}.choices{display:grid;gap:10px;margin-top:12px}button{font:inherit;cursor:pointer;border-radius:11px;border:2px solid #b5cce6;background:white;padding:10px 14px;text-align:right;color:#173957}button:hover:not(:disabled){border-color:#2876ad;background:#eef8ff}button:focus-visible{outline:3px solid #eb9d37;outline-offset:2px}button:disabled{cursor:default;opacity:.75}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.primary{background:#176aab;color:white;border-color:#176aab}.primary:hover:not(:disabled){background:#11578c;color:white}.feedback{background:#fff3e2;border-right:5px solid #d4872c;padding:12px;margin:14px 0;border-radius:8px}.feedback.good{background:#e8f8ed;border-right-color:#31895a}.tip{background:#fff8df;border-right:5px solid #d0a53a;padding:12px;margin-top:10px;border-radius:8px}.hidden{display:none!important}.progress{height:12px;background:#d9e5f1;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#2c92bf;transition:width .3s}#steps{padding:0;list-style:none;font-size:14px;line-height:1.4;max-height:60vh;overflow:auto}#steps li{padding:8px 5px;border-bottom:1px solid #e7edf3}#steps .active{color:#155e9b;font-weight:bold;background:#f0f8ff}#steps .done{color:#227446}.small{font-size:14px;color:#52687d}.complete{text-align:center;padding:25px 5px}@media(max-width:760px){main{grid-template-columns:1fr}.panel{padding:17px}header h1{font-size:23px}#steps{max-height:none}}
</style></head><body><header><h1>שרשרת חוליות — מורה אישי אינטראקטיבי</h1><small>תרגילי בנייה וסריקה · לפי עמודים 19–32 · C#</small></header><main><section class="panel" id="lesson"><span class="label">מורה אישי מדומה · תרגול מונחה</span><h2 id="title"></h2><div id="content"></div><div id="feedback" role="status" aria-live="polite" aria-atomic="true" class="hidden"></div><div id="hintbox" class="tip hidden"></div><div class="buttons"><button type="button" id="hint">💡 תן לי רמז</button><button type="button" id="retry" class="hidden">נסה שוב</button><button type="button" id="next" class="primary hidden">ממשיכים ←</button></div>
</section><aside class="panel"><h3>מסלול הלמידה</h3><div class="progress"><div class="bar" id="bar"></div></div><div class="small" id="progresslabel"></div><ol id="steps"></ol><h3>מטרת השיעור</h3><p class="small">לבנות, להעתיק, לסנן ולסרוק רשימות מקושרות; להבין ראש רשימה, קישורים ומקרי קצה.</p></aside></main><script>
const stages=[{"title": "1. ממערך לרשימה — סדר רגיל", "page": "עמ׳ 19–20", "ex": "המטרה היא להעתיק את איברי המערך לרשימה חדשה באותו הסדר. בכל צעד יוצרים חוליה ומקשרים אותה אחרי החוליה האחרונה שנבנתה.", "source": "[1,2,3,4,5]", "output": "1→2→3→4→5→null", "q": "מה יהיה הערך בחוליה הראשונה?", "options": ["1", "5", "null"], "right": 0, "hint": "התחל באיבר הראשון במערך.", "wrong": "ברשימה בסדר רגיל האיבר הראשון נשאר ראשון.", "good": "הראש מכיל 1, כמו arr[0].", "code": null}, {"title": "2. שני מצביעים בבנייה", "page": "עמ׳ 20", "ex": "head שומר את תחילת הרשימה, ואילו current מצביע לחוליה האחרונה שנוספה כדי שאפשר יהיה לחבר אחריה חוליה חדשה.", "source": "[1,2,3]", "output": "head → 1→2→3→null", "q": "למה צריך לשמור את head?", "options": ["כדי להחזיר את תחילת הרשימה", "כדי למיין את המערך", "כדי למחוק את הרשימה"], "right": 0, "hint": "חשוב מה צריך להחזיר בסוף הפעולה.", "wrong": "current זז במהלך הבנייה; אם לא נשמור את הראש, לא נדע מאיפה להתחיל.", "good": "head נשאר בחוליה הראשונה.", "code": "static Node<int> CreateList(int[] arr)\n{\n    if (arr == null || arr.Length == 0)\n        return null;\n    Node<int> head = new Node<int>(arr[0]);\n    Node<int> current = head;\n    int i = 1;\n    while (i < arr.Length)\n    {\n        current.SetNext(new Node<int>(arr[i]));\n        current = current.GetNext();\n        i++;\n    }\n    return head;\n}"}, {"title": "3. מה עושים כשאין איברים?", "page": "עמ׳ 20", "ex": "אם המערך ריק או שהוא null, אין חוליה ראשונה. לכן הפעולה בדוגמה מחזירה null.", "source": "[]", "output": "null", "q": "מה מחזירה CreateList עבור מערך ריק?", "options": ["חוליה עם 0", "null", "חוליה עם -1"], "right": 1, "hint": "אין ערך שממנו אפשר ליצור את החוליה הראשונה.", "wrong": "הקוד בודק arr == null או Length == 0 ומחזיר null.", "good": "null מציין רשימה ריקה.", "code": null}, {"title": "4. בנייה בסדר הפוך", "page": "עמ׳ 21–22", "ex": "כדי לקבל רשימה הפוכה, בכל צעד יוצרים חוליה חדשה שה־next שלה מצביע לראש הישן. לאחר מכן החוליה החדשה הופכת לראש.", "source": "[1,2,3,4,5]", "output": "5→4→3→2→1→null", "q": "מה תהיה החוליה הראשונה ברשימה ההפוכה?", "options": ["1", "3", "5"], "right": 2, "hint": "מי הוכנס אחרון לראש הרשימה?", "wrong": "בכל שלב מכניסים בראש, ולכן האיבר האחרון במערך הופך לראש.", "good": "החוליה הראשונה מכילה 5.", "code": null}, {"title": "5. משמעות ההכנסה לראש", "page": "עמ׳ 22", "ex": "הביטוי new Node<int>(arr[i], head) יוצר חוליה שהערך שלה הוא arr[i] והקישור שלה מצביע לראש הקודם.", "source": "[1,2,3]", "output": "3→2→1→null", "q": "אחרי שקלטנו 1 ואז 2, מהי הרשימה?", "options": ["1→2→null", "2→1→null", "2→null"], "right": 1, "hint": "החוליה החדשה מצביעה לראש הקודם.", "wrong": "הכנסה בראש אינה משמרת את סדר הקלט.", "good": "2 היא הראש, והיא מצביעה ל־1.", "code": "static Node<int> CreateReversedList(int[] arr)\n{\n    if (arr == null || arr.Length == 0)\n        return null;\n    Node<int> head = null;\n    int i = 0;\n    while (i < arr.Length)\n    {\n        head = new Node<int>(arr[i], head);\n        i++;\n    }\n    return head;\n}"}, {"title": "6. קליטת תווים עד זקיף", "page": "עמ׳ 23–24", "ex": "הפעולה קוראת תווים עד התו $. הזקיף מסמן סיום ואינו נכנס לרשימה. מהתווים שנקלטו בונים רשימה רגילה ורשימה הפוכה.", "source": "A B C $", "output": "A→B→C→null", "q": "איזה תו יופיע בראש הרשימה ההפוכה?", "options": ["A", "$", "C"], "right": 2, "hint": "הזקיף אינו איבר ברשימה.", "wrong": "רשימת ההיפוך מכילה רק את התווים שלפני $.", "good": "C מופיע ראשון ברשימה ההפוכה.", "code": null}, {"title": "7. שיכפול — Clone", "page": "עמ׳ 25–26", "ex": "שיכפול יוצר חוליות חדשות עם אותם ערכים ובאותו סדר. החוליות של הרשימה החדשה אינן אותן חוליות של המקור.", "source": "2→4→6", "output": "2→4→6→null", "q": "מה חייב להיות נכון לגבי הרשימה המשוכפלת?", "options": ["אותם ערכים, חוליות חדשות", "אותם אובייקטים בדיוק", "סדר הפוך"], "right": 0, "hint": "להעתיק ערך לא אומר להשתמש באותה חוליה.", "wrong": "שינוי קישור ברשימה המקורית לא אמור לשנות את קישורי העותק.", "good": "הערכים והסדר נשמרים, אך נוצרות חוליות נפרדות.", "code": null}, {"title": "8. מקרה קצה בשיכפול", "page": "עמ׳ 26", "ex": "בקוד שבמקור ניגשים מיד אל current.GetValue(). אם head הוא null, קריאה זו אינה תקינה. לפני ההעתקה צריך לטפל ברשימה ריקה.", "source": "null", "output": "null", "q": "מה צריך לבדוק לפני current.GetValue()?", "options": ["head == null", "head.GetValue() == 0", "current.HasNext()"], "right": 0, "hint": "אפשר לקרוא פעולה על חוליה שאינה קיימת?", "wrong": "כאשר head הוא null, אין אובייקט שאפשר להפעיל עליו GetValue.", "good": "הבדיקה head == null מונעת גישה לאובייקט חסר.", "code": "static Node<int> CloneList(Node<int> head)\n{\n    if (head == null) return null;\n    Node<int> copy = new Node<int>(head.GetValue());\n    Node<int> tail = copy;\n    Node<int> current = head.GetNext();\n    while (current != null)\n    {\n        tail.SetNext(new Node<int>(current.GetValue()));\n        tail = tail.GetNext();\n        current = current.GetNext();\n    }\n    return copy;\n}"}, {"title": "9. סינון מספרים חיוביים", "page": "עמ׳ 27–28", "ex": "הפעולה FilterPositives יוצרת רשימה חדשה רק מערכים הגדולים מ־0. אפס ומספרים שליליים אינם מועתקים.", "source": "-2→3→0→5→-1", "output": "3→5→null", "q": "איזה ערך לא יופיע ברשימה החדשה?", "options": ["3", "5", "0"], "right": 2, "hint": "התנאי הוא גדול ממש מאפס.", "wrong": "0 אינו מספר חיובי לפי התנאי current.GetValue() > 0.", "good": "רק 3 ו־5 מועתקים.", "code": null}, {"title": "10. ראש דמה", "page": "עמ׳ 28", "ex": "dummyHead היא חוליית עזר שאינה חלק מתוצאת הסינון. tail מתחיל בה, וההחזרה מתבצעת באמצעות dummyHead.GetNext().", "source": "dummy(0)→3→5", "output": "3→5→null", "q": "למה מחזירים dummyHead.GetNext()?", "options": ["כדי לדלג על חוליית העזר", "כדי למחוק את 3", "כדי להחזיר את האפס"], "right": 0, "hint": "החוליה המדומה אינה נתון אמיתי.", "wrong": "אם נחזיר את dummyHead עצמו, האפס המדומה יופיע בראש.", "good": "GetNext מחזיר את הראש האמיתי של התוצאה.", "code": "static Node<int> FilterPositives(Node<int> head)\n{\n    Node<int> dummyHead = new Node<int>(0);\n    Node<int> tail = dummyHead;\n    Node<int> current = head;\n    while (current != null)\n    {\n        if (current.GetValue() > 0)\n        {\n            tail.SetNext(new Node<int>(current.GetValue()));\n            tail = tail.GetNext();\n        }\n        current = current.GetNext();\n    }\n    return dummyHead.GetNext();\n}"}, {"title": "11. סריקה — שני מספרים גדולים", "page": "עמ׳ 29–30", "ex": "הפעולה סופרת כמה חוליות מכילות ערך הגדול מהמספר שהתקבל. ברגע שמגיעים לשתיים, היא מחזירה true.", "source": "[4,9,2,7], num=6", "output": "4→9→2→7→null", "q": "מה מחזירה הפעולה עבור num=6?", "options": ["false", "true", "null"], "right": 1, "hint": "ספור את הערכים הגדולים ממש מ־6.", "wrong": "9 ו־7 גדולים מ־6, ולכן נמצאו שתי חוליות מתאימות.", "good": "התוצאה true.", "code": null}, {"title": "12. משמעות ״שני מספרים שונים״", "page": "עמ׳ 29–30", "ex": "נוסח השאלה בעמ׳ 29 אומר ״2 מספרים שונים״, אך הקוד בעמ׳ 30 סופר שתי חוליות מתאימות גם אם הערכים שווים. זו אי־התאמה שחשוב לזהות.", "source": "[8,8], num=5", "output": "8→8→null", "q": "מה יחזיר הקוד המופיע במקור?", "options": ["true", "false", "שגיאת קומפילציה"], "right": 0, "hint": "הסתכל על count: האם הוא בודק שוויון בין הערכים?", "wrong": "הקוד אינו בודק שהערכים שונים; הוא רק סופר שתי חוליות.", "good": "הקוד מחזיר true. אם רוצים שני ערכים שונים, נדרש תנאי נוסף.", "code": "static bool Has2NumsGreaterThan(Node<int> head, int num)\n{\n    int count = 0;\n    Node<int> current = head;\n    while (current != null)\n    {\n        if (current.GetValue() > num)\n        {\n            count++;\n            if (count >= 2) return true;\n        }\n        current = current.GetNext();\n    }\n    return false;\n}"}, {"title": "13. סדר יורד במחרוזות", "page": "עמ׳ 31–32", "ex": "הפעולה IsSortedDescending משווה כל שם עיר לשם הבא באמצעות CompareTo. אם שם נוכחי קטן משם הבא, הסדר היורד הופר.", "source": "Zoo→Tel→Acre", "output": "Zoo→Tel→Acre→null", "q": "מתי הפעולה מחזירה false?", "options": ["כאשר current.CompareTo(next) < 0", "כאשר current.CompareTo(next) > 0", "תמיד ברשימה של שלוש ערים"], "right": 0, "hint": "בסדר יורד השם הנוכחי לא אמור להיות קטן מהבא.", "wrong": "תוצאה שלילית ב־CompareTo פירושה שהשם הנוכחי קודם לַבא בסדר ההשוואה.", "good": "ערך שלילי מסמן הפרת סדר יורד.", "code": null}, {"title": "14. מקרה קצה בסריקת ערים", "page": "עמ׳ 32", "ex": "בדוגמת המקור מופיע while (current.HasNext()). כאשר head הוא null, אין current שאפשר לקרוא עליו HasNext. יש לבדוק קודם שרשימה אינה ריקה.", "source": "null", "output": "null", "q": "איזו בדיקה מגנה על הסריקה ברשימה ריקה?", "options": ["current != null && current.HasNext()", "current.GetValue() != null", "current.GetNext() == null"], "right": 0, "hint": "יש לבדוק שהאובייקט קיים לפני הפעלת מתודה.", "wrong": "קריאה ל־HasNext על null אינה תקינה.", "good": "תנאי משולב מגן על רשימה ריקה וגם על סוף הרשימה.", "code": "static bool IsSortedDescending(Node<string> head)\n{\n    Node<string> current = head;\n    while (current != null && current.HasNext())\n    {\n        if (current.GetValue().CompareTo(\n                current.GetNext().GetValue()) < 0)\n            return false;\n        current = current.GetNext();\n    }\n    return true;\n}"}];
let stage=0,answered=false,mistakes=0,hints=0;
const $=id=>document.getElementById(id);
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function makeDiagram(s){const v=s.output.split('→');return '<div class="visual" aria-label="'+esc(s.output)+'">'+v.map((x,i)=>'<span class="'+(x==='null'?'null':'node')+'">'+esc(x)+'</span>'+(i<v.length-1?'<span class="arrow">→</span>':'')).join('')+'</div>';}
function progress(done=false){$('bar').style.width=((done?stages.length:stage)/stages.length*100)+'%';$('progresslabel').textContent=(done?stages.length:stage)+' מתוך '+stages.length+' שלבים הושלמו';$('steps').innerHTML=stages.map((s,i)=>'<li class="'+(i<stage||done?'done':i===stage?'active':'')+'">'+(i<stage||done?'✅':i===stage?'🔵':'◯')+' '+esc(s.title)+'</li>').join('');}
function show(){answered=false;const s=stages[stage];$('title').textContent=s.title;$('content').innerHTML='<span class="small">מקור: '+esc(s.page)+'</span><div class="explain">'+esc(s.ex)+'</div><div class="demo"><div class="small">קלט / דוגמה: <span dir="ltr">'+esc(s.source)+'</span></div>'+makeDiagram(s)+'</div>'+(s.code?'<details><summary>הצג דוגמת קוד C#</summary><pre><code>'+esc(s.code)+'</code></pre><p class="small">דוגמה לימודית מותאמת ללולאות while; במקרים המסומנים הוספה בדיקת null.</p></details>':'')+'<div class="question"><strong>'+esc(s.q)+'</strong><div class="choices" id="choices">'+s.options.map((o,i)=>'<button type="button" data-answer="'+i+'">'+String.fromCharCode(1488+i)+'. '+esc(o)+'</button>').join('')+'</div></div>';
$('choices').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.answer))));$('feedback').className='hidden';$('feedback').textContent='';$('hintbox').className='tip hidden';$('hintbox').textContent='';$('next').classList.add('hidden');$('retry').classList.add('hidden');$('hint').classList.remove('hidden');progress();}
function choose(i){if(answered)return;const s=stages[stage];if(i===s.right){answered=true;$('feedback').className='feedback good';$('feedback').textContent='✅ '+s.good;$('choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('next').classList.remove('hidden');$('hint').classList.add('hidden');$('retry').classList.add('hidden');$('hintbox').classList.add('hidden');}else{mistakes++;$('feedback').className='feedback';$('feedback').textContent='כדאי לבדוק שוב: '+s.wrong;$('retry').classList.remove('hidden');}}
$('hint').onclick=()=>{if(answered)return;hints++;$('hintbox').className='tip';$('hintbox').textContent='💡 '+stages[stage].hint;};$('retry').onclick=()=>{$('feedback').classList.add('hidden');$('retry').classList.add('hidden');};$('next').onclick=()=>{if(!answered)return;stage++;if(stage<stages.length)show();else finish();};
function finish(){progress(true);$('title').textContent='סיימת את מסלול הלמידה';$('content').innerHTML='<div class="complete"><h2>🎓 כל הכבוד על השלמת התרגול</h2><p>תרגלת בנייה בסדר רגיל והפוך, קליטת תווים, שיכפול, סינון באמצעות ראש דמה, חיפוש וסדר יורד.</p><p><strong>בחירות שגויות: '+mistakes+' · לחיצות על רמז: '+hints+'</strong></p><p>השלמת המסלול היא תרגול והיכרות, לא מדד מסכם לשליטה מלאה.</p><button class="primary" type="button" id="restart">מתחילים מחדש</button></div>';$('feedback').classList.add('hidden');$('hintbox').classList.add('hidden');$('next').classList.add('hidden');$('retry').classList.add('hidden');$('hint').classList.add('hidden');$('restart').onclick=()=>{stage=0;mistakes=0;hints=0;show();};}
show();
</script></body></html>

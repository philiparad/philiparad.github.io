<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>fx-991ES PLUS — physical reference field sheets</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="reference-field-sheet.css">
</head>
<body>
    <header class="field-sheet-toolbar">
        <h1>CASIO reference collection — field sheets</h1>
        <p>50 planned, unobserved scenarios. This is a human data-collection worksheet, not CASIO hardware evidence or a manufacturer's keystroke instruction sheet.</p>
        <div class="actions">
            <label for="area-filter">Category</label>
            <select id="area-filter"><option value="all">All 50 planned cases</option></select>
            <button type="button" id="print-sheets" class="button">Print A4 field sheets</button>
            <button type="button" id="export-blank-csv" class="button secondary">Download blank CSV template</button>
            <a href="device.html" class="button secondary">Open observation workbench</a>
        </div>
        <p id="sheet-summary" role="status" aria-live="polite"></p>
    </header>
    <main id="field-sheets">
        <p>Loading planned scenarios…</p>
    </main>
    <script src="../src/reference-plan.js"></script>
    <script src="reference-field-sheet.js"></script>
</body>
</html>

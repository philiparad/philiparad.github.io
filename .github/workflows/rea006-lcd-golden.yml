name: REA-006 deterministic LCD golden frames
on:
  push:
    branches: [main]
    paths:
      - 'calculator/reference/rea-006/**'
      - 'calculator/js/**'
      - 'calculator/index.html'
      - 'calculator/styles.css'
      - '.github/workflows/rea006-lcd-golden.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lcd-golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pixel comparison dependencies
        run: |
          python -m pip install playwright==1.56.0 Pillow
          python -m playwright install --with-deps chromium
      - name: Run synthetic pixel-diff unit tests
        run: |
          python -m py_compile calculator/reference/rea-006/lcd_golden.py calculator/reference/rea-006/test_lcd_golden.py
          python -m unittest discover -v -s calculator/reference/rea-006 -p 'test_*.py'
      - name: Capture and compare immutable golden frames
        shell: bash
        run: |
          set -euo pipefail
          ROOT=calculator/reference/rea-006
          mkdir -p /tmp/rea006-test
          if [[ -f "$ROOT/web-golden.json" ]]; then
            python "$ROOT/lcd_golden.py" --out /tmp/rea006-test
          else
            python "$ROOT/lcd_golden.py" --capture-only --out /tmp/rea006-test
            cp /tmp/rea006-test/web-golden.candidate.json "$ROOT/web-golden.json"
            python - <<'PY'
          import importlib.util
          from pathlib import Path
          module=Path("calculator/reference/rea-006/lcd_golden.py")
          spec=importlib.util.spec_from_file_location("rea006",module)
          r=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(r)
          result=r.compare(Path("/tmp/rea006-test"),Path("calculator/reference/rea-006/web-golden.json"))
          assert result["passed"] == len(r.CASES),result
          assert result["failed"]==0,result
          print("Provisional web-only golden baseline:",result["passed"],"captured frames")
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ROOT/web-golden.json"
            git commit -m "REA-006: pin initial web-only LCD golden frames"
            git push origin HEAD:main
          fi
      - name: Export comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea006-lcd-golden-report
          path: |
            /tmp/rea006-test/captured.json
            /tmp/rea006-test/comparison.json
            /tmp/rea006-test/comparison.md
            /tmp/rea006-test/*.diff.png
          if-no-files-found: warn

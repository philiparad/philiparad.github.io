main{max-width:1000px;padding:26px 20px 45px;margin:auto}.panel{border:2px solid var(--border);border-radius:18px;background:white;padding:clamp(18px,3vw,30px);box-shadow:0 8px 24px #152e5110}.hero{background:linear-gradient(120deg,#eaf4ff,#fff);border:2px solid #caddf7;border-radius:14px;padding:18px;margin-bottom:20px}.hero h2{margin:0 0 12px;font-size:23px}.hero p{line-height:1.7;margin:0}.start-actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}.primary{background:var(--blue);color:white;border:2px solid var(--blue);padding:12px 22px;border-radius:10px;font-weight:700}.secondary{background:white;color:#24549d;border:2px solid #bcd1ef;padding:12px 18px;border-radius:10px}.ghost{border:0;background:none;color:#dbeafe;text-decoration:underline}.muted{color:#5d718a}.tag{display:inline-block;border:1px solid #bed6f4;background:#e9f3ff;border-radius:22px;padding:6px 12px;font-size:13px;font-weight:bold;color:#1c559a}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.meter{height:11px;background:#e1eaf6;border-radius:99px;overflow:hidden;margin:18px 0}.meter>div{background:linear-gradient(90deg,#2563eb,#38bdf8);height:100%;transition:width .2s}.question-title{font-size:clamp(20px,2.4vw,27px);line-height:1.5;margin:18px 0}.code{direction:ltr;text-align:left;white-space:pre-wrap;background:#101e36;color:#e2ebfa;padding:16px 20px;border-radius:10px;border:2px solid #334b75;font:15px/1.6 Consolas,"Courier New",monospace;overflow:auto;margin:14px 0 20px}.choices{display:grid;gap:11px;margin-top:20px}.option{width:100%;text-align:right;background:#fafcff;border:2px solid #dbe6f4;border-radius:12px;padding:14px 17px;color:#1c2d48;display:flex;align-items:center;gap:12px;min-height:58px}.option:hover:not(:disabled){border-color:#6b9aff;background:#eff6ff}.option.selected{background:#e7f0ff;border-color:#2563eb}.option.correct{background:#e5f7ee;border-color:#129465}.option.incorrect{background:#fff0f0;border-color:#d94652}.letter{flex:0 0 29px;width:29px;height:29px;border:2px solid #afc5e1;display:grid;place-items:center;border-radius:50%;font-weight:bold;color:#37547b}.option .choiceText{flex:1;line-height:1.55}.feedback{border:2px solid #b7cbea;padding:15px;border-radius:12px;background:#f4f8ff;margin:18px 0;line-height:1.7}.feedback.good{border-color:#9dd7bb;background:#ecfff4}.feedback.bad{border-color:#e8b2ba;background:#fff4f4}.controls{border-top:1px solid var(--border);padding-top:20px;margin-top:24px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.numbers{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px;margin:20px 0}.num{background:white;border:2px solid #dbe6f4;padding:10px 3px;border-radius:9px}.num.active{border-color:#1c5bce;background:#deecff}.num.answered{background:#e9f7ef;border-color:#80bda0}.num.active.answered{border-color:#1c5bce}.resultScore{font-size:58px;color:#17498f;font-weight:800;margin:14px 0}.reviewItem{border:2px solid var(--border);border-radius:12px;padding:15px;margin:12px 0;background:#fcfdff}.reviewItem.wrong{border-color:#e8c4c8}.reviewItem strong{line-height:1.5}.reviewItem p{margin:8px 0;line-height:1.6}.resultBar{height:12px;background:#e4edf8;border-radius:10px;overflow:hidden}.resultBar div{height:100%;background:#189b6d}footer{text-align:center;color:#62748a;font-size:13px;padding:12px 0 30px}#app[hidden], [hidden]{display:none!important}@media(max-width:600px){main{padding:14px 10px}header{padding:20px 15px}.controls button{flex:1}.option{padding:12px}}

<body>
<header><div><h1>מבדק אינטראקטיבי: יעילות וסיבוכיות</h1><div class="sub">מדעי המחשב • C# • שאלון בן 25 שאלות</div></div></header>
<main id="app" aria-live="polite"></main>
<footer>מבוסס על החומר בקובץ ״יעילות וסיבוכיות #C״ • שאלות מקוריות לתרגול ולבדיקה עצמית</footer>
<script>
'use strict';
const questions=[
{topic:'יסודות',q:'מדוע זמן ריצה בשניות אינו מספיק לבדו להשוואת יעילותם של שני אלגוריתמים?',a:['כי זמן הריצה תלוי גם בחומרה ובתנאי ההרצה','כי מספר השניות אינו יכול להיות שבר','כי כל האלגוריתמים פועלים באותה מהירות','כי זמן ריצה אינו משתנה עם גודל הקלט'],correct:0,why:'משך הריצה בפועל מושפע מהמחשב ומסביבת הביצוע. כדי להשוות אלגוריתמים מנתחים את מספר פעולות היסוד כתלות בגודל הקלט.'},
{topic:'יסודות',q:'איזו מבין הפעולות הבאות היא דוגמה לפעולת יסוד?',a:['מיון מערך שלם','השוואה בין שני ערכים','מעבר על כל איברי המערך','חיפוש בכל הצמתים של עץ'],correct:1,why:'השוואה בודדת נחשבת פעולת יסוד; שאר האפשרויות עשויות לכלול מספר פעולות התלוי בקלט.'},
{topic:'גודל הקלט',q:'מהו בדרך כלל n כאשר מנתחים פעולה העוברת על כל איברי מערך?',a:['מספר המשתנים המקומיים','הערך הגדול במערך','מספר האיברים במערך','מספר ההדפסות למסך ללא קשר לקלט'],correct:2,why:'בניתוח פעולה שמקבלת מערך, n מסמן לרוב את אורך המערך.'},
{topic:'מקרה גרוע',q:'בחיפוש לינארי במערך, מתי מתקבל מספר ההשוואות המרבי?',a:['כשהפריט נמצא בתא הראשון','כשהמערך מכיל רק מספרים חיוביים','כשהפריט נמצא בתא השני','כשהפריט אינו נמצא במערך'],correct:3,why:'אם הערך אינו מופיע, האלגוריתם בודק כל איבר במערך.'},
{topic:'פונקציית יעילות',q:'נתונה פונקציית יעילות f(n) = 4n + 2. כמה פעולות היא מתארת עבור n = 10?',a:['42','40','14','400'],correct:0,why:'מציבים: 4·10 + 2 = 42.'},
{topic:'סיבוכיות',q:'מהי סיבוכיות הזמן של f(n) = 7n + 4?',a:['O(1)','O(n)','O(n²)','O(n³)'],correct:1,why:'האיבר המוביל הוא 7n. בסיבוכיות מתעלמים ממקדם קבוע ומאיברים מסדר נמוך.'},
{topic:'סיבוכיות',q:'מהי סיבוכיות הזמן של f(n) = 6n² + 3n + 1?',a:['O(1)','O(n)','O(n²)','O(n³)'],correct:2,why:'האיבר הדומיננטי כאשר n גדל הוא 6n².'},
{topic:'סיבוכיות',q:'מהי סיבוכיות הזמן של f(n) = 2n³ + 100n² + 5?',a:['O(n)','O(n²)','O(1)','O(n³)'],correct:3,why:'החזקה הגבוהה ביותר בפולינום היא 3.'},
{topic:'קוד C#',q:'מהי סיבוכיות הזמן של הקוד הבא?',code:'for (int i = 0; i < n; i++)\n{\n    Console.WriteLine(i);\n}',a:['O(n)','O(1)','O(n²)','O(n³)'],correct:0,why:'הלולאה מבצעת n איטרציות, ובכל איטרציה עבודה קבועה.'},
{topic:'קוד C#',q:'מהי סיבוכיות הזמן של שתי הלולאות הבאות?',code:'for (int i = 0; i < n; i++)\n    Console.WriteLine(i);\n\nfor (int j = 0; j < n; j++)\n    Console.WriteLine(j);',a:['O(n²)','O(n)','O(1)','O(n³)'],correct:1,why:'הלולאות מתבצעות זו אחרי זו, ולכן סך האיטרציות הוא 2n ולא n².'},
{topic:'קוד C#',q:'מהי סיבוכיות הזמן של הלולאות?',code:'for (int i = 0; i < n; i++)\n{\n    for (int j = 0; j < n; j++)\n        Console.WriteLine(i + j);\n}',a:['O(n)','O(1)','O(n²)','O(n³)'],correct:2,why:'לכל אחת מ-n האיטרציות החיצוניות מתבצעות n איטרציות פנימיות, בסך הכול n².'},
{topic:'קוד C#',q:'מהי סיבוכיות הזמן של הקטע הבא?',code:'for (int i = 0; i < n; i++)\n    for (int j = 0; j < n; j++)\n        for (int k = 0; k < n; k++)\n            Console.WriteLine(i + j + k);',a:['O(n)','O(n²)','O(1)','O(n³)'],correct:3,why:'שלוש לולאות מקוננות של n איטרציות יוצרות n·n·n פעולות.'},
{topic:'קוד C#',q:'מהי סיבוכיות הזמן של הקוד הבא, כתלות בשני גדלים בלתי תלויים?',code:'for (int i = 0; i < n; i++)\n    for (int j = 0; j < m; j++)\n        Console.WriteLine(i + j);',a:['O(nm)','O(n + m)','O(n²) תמיד','O(1)'],correct:0,why:'הלולאה החיצונית פועלת n פעמים והפנימית m פעמים עבור כל i; יחד nm איטרציות.'},
{topic:'קוד C#',q:'מהי סיבוכיות הזמן של פעולה זו?',code:'static int First(int[] arr)\n{\n    return arr[0];\n}',a:['O(n)','O(1)','O(n²)','O(n³)'],correct:1,why:'גישה לאיבר על פי אינדקס קבוע אינה תלויה באורך המערך (בהנחה שהמערך אינו ריק).'},
{topic:'קוד C#',q:'מהי סיבוכיות הזמן של הקוד?',code:'for (int i = 0; i < n; i++)\n{\n    for (int j = i + 1; j < n; j++)\n        Console.WriteLine(i + j);\n}',a:['O(n)','O(n³)','O(n²)','O(1)'],correct:2,why:'מספר איטרציות הלולאה הפנימית הוא n−1, n−2, ... , 0. הסכום הוא n(n−1)/2 ולכן O(n²).'},
{topic:'קוד C#',q:'מהי סיבוכיות הזמן של הקוד הבא?',code:'for (int i = 0; i < n; i++)\n    Console.WriteLine(i);\n\nfor (int i = 0; i < n; i++)\n    for (int j = 0; j < n; j++)\n        Console.WriteLine(i + j);',a:['O(n)','O(1)','O(n³)','O(n²)'],correct:3,why:'סך העבודה הוא n+n², והאיבר הריבועי דומיננטי.'},
{topic:'מיון',q:'מהי סיבוכיות הזמן במקרה הגרוע של מיון בועות רגיל?',a:['O(n²)','O(n)','O(1)','O(n³)'],correct:0,why:'במקרה הגרוע מתבצעות סדרות של השוואות באורך n−1, n−2, ..., 1.'},
{topic:'מיון',q:'מהי סיבוכיות הזמן של מיון בחירה (Selection Sort) במקרה הגרוע?',a:['O(1)','O(n²)','O(n³)','O(n)'],correct:1,why:'בכל שלב מחפשים את האיבר הקטן בחלק שנותר; מספר ההשוואות הכולל ריבועי.'},
{topic:'מיון',q:'מהי סיבוכיות הזמן במקרה הגרוע של מיון הכנסה (Insertion Sort)?',a:['O(n)','O(1)','O(n²)','O(n³)'],correct:2,why:'כאשר נדרשות הזזות רבות בכל הכנסת איבר, סך ההזזות גדל כמו סכום 1+2+…+(n−1).'},
{topic:'רקורסיה',q:'מהי סיבוכיות הזמן של הפעולה הבאה עבור n חיובי?',code:'static void Print(int n)\n{\n    if (n <= 0) return;\n    Print(n - 1);\n    Console.WriteLine(n);\n}',a:['O(1)','O(n²)','O(n³)','O(n)'],correct:3,why:'בכל קריאה n קטן ב-1; יש n קריאות פעילות ועבודה קבועה בכל אחת.'},
{topic:'רקורסיה',q:'מהי סיבוכיות הזמן של הפונקציה הזו?',code:'static int F(int n)\n{\n    if (n <= 1) return 1;\n    return F(n - 1) + F(n - 1);\n}',a:['O(2ⁿ)','O(n)','O(n²)','O(1)'],correct:0,why:'בכל קריאה שאינה בסיס נוצרים שני ענפים, ולכן מספר הקריאות גדל באופן מעריכי.'},
{topic:'ניתוח מדויק',q:'כמה פעמים בדיוק מופעלת פעולת ההדפסה עבור n = 5?',code:'for (int i = 0; i < n; i++)\n    for (int j = i + 1; j < n; j++)\n        Console.WriteLine(i + j);',a:['25','10','5','15'],correct:1,why:'מספר ההדפסות הוא 4+3+2+1+0 = 10.'},
{topic:'ניתוח מדויק',q:'מהו מספר האיטרציות הכולל של הלולאה הפנימית, עבור n≥1?',code:'for (int i = 0; i < n; i++)\n    for (int j = 0; j < i; j++)\n        Console.WriteLine(j);',a:['n²','2n','n(n−1)/2','n(n+1)'],correct:2,why:'מספר האיטרציות הוא 0+1+…+(n−1) = n(n−1)/2.'},
{topic:'חשיבה אלגוריתמית',q:'בפעולה אחת עוברים על המערך פעם אחת, ובשנייה עוברים על כל זוג איברים. איזו טענה נכונה?',a:['שתיהן בהכרח O(1)','הפעולה על זוגות היא תמיד O(n)','שתי הפעולות בהכרח O(n³)','הראשונה O(n), והשנייה בדרך כלל O(n²)'],correct:3,why:'מעבר יחיד על n איברים הוא לינארי; מעבר על כל הזוגות יוצר סדר גודל ריבועי.'},
{topic:'ניתוח לולאות',q:'בלולאות מקוננות שמקדמות את אותו מונה i בלבד, ללא איפוס שלו, מהו הדבר החשוב ביותר לבדוק?',code:'int i = 0;\nwhile (i < n)\n{\n    while (i < n && IsSameGroup(i))\n        i++;\n    if (i < n) i++;\n}',a:['כמה פעמים i מתקדם בסך הכול — לכל היותר n','רק כמה לולאות מופיעות בקוד','האם יש יותר משני משתנים','האם הפעולה מחזירה bool'],correct:0,why:'למרות הקינון, i רק גדל ואינו מתאפס, ולכן מספר ההתקדמויות הכולל אינו עולה על n. מניחים ש-IsSameGroup מבצעת עבודה קבועה.'}
];
let state={screen:'intro',index:0,answers:Array(questions.length).fill(null),submitted:false};
const app=document.getElementById('app');
const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function save(){try{sessionStorage.setItem('efficiencyQuiz25',JSON.stringify(state));}catch(e){}}
function restore(){try{const raw=sessionStorage.getItem('efficiencyQuiz25');if(raw){const x=JSON.parse(raw);if(Array.isArray(x.answers)&&x.answers.length===25&&Number.isInteger(x.index)&&x.index>=0&&x.index<25&&['intro','quiz','result'].includes(x.screen))state=x;}}catch(e){}}
function start(reset){if(reset)state={screen:'quiz',index:0,answers:Array(25).fill(null),submitted:false};else state.screen='quiz';save();render();}
function pick(i){if(state.submitted)return;state.answers[state.index]=i;save();render();}
function jump(i){state.index=i;save();render();}
function next(){if(state.index<24){jump(state.index+1)}else finish();}
function previous(){if(state.index>0)jump(state.index-1)}
function finish(){state.screen='result';state.submitted=true;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function resultCount(){return state.answers.reduce((s,a,i)=>s+(a===questions[i].correct?1:0),0)}
function render(){
if(state.screen==='intro'){
app.innerHTML=`<section class="panel"><div class="hero"><h2>25 שאלות על יעילות וסיבוכיות זמן</h2><p>שאלות אמריקאיות בעברית, דוגמאות ב־C#, ניתוח לולאות, פונקציות יעילות, מיון ורקורסיה. <b>אין שאלות על סיבוכיות לוגריתמית.</b></p></div><div class="row"><span class="tag">25 שאלות</span><span class="tag">4 אפשרויות לכל שאלה</span><span class="tag">משוב מיידי לכל תשובה</span><span class="tag">שמירת התקדמות בלשונית</span></div><p class="muted" style="line-height:1.7">בחרו תשובה אחת לכל שאלה. מיד לאחר הבחירה תופיע הודעה אם התשובה נכונה או שגויה, לצד התשובה הנכונה והסבר. ניתן לחזור ולשנות תשובות. בסיום יופיע הציון הכולל.</p><div class="start-actions"><button class="primary" onclick="start(true)">התחלת המבדק</button></div></section>`;return;}
if(state.screen==='result'){
const score=resultCount(),pct=Math.round(score/25*100),answered=state.answers.filter(x=>x!==null).length;
app.innerHTML=`<section class="panel"><div class="row"><h2>תוצאות המבדק</h2><span class="tag">${answered} מתוך 25 שאלות נענו</span></div><div class="resultScore">${score} / 25</div><h3>${pct}% תשובות נכונות</h3><div class="resultBar"><div style="width:${pct}%"></div></div><p class="muted">להלן משוב על כל 25 השאלות, כולל התשובה הנכונה והנימוק.</p><div class="start-actions"><button class="primary" onclick="start(true)">מבדק חדש</button><button class="secondary" onclick="window.print()">הדפסת התוצאות</button><button class="secondary" onclick="state.screen='quiz';state.submitted=false;save();render()">עיון ושינוי תשובות</button></div><div id="reviews">${questions.map((q,i)=>{const a=state.answers[i],ok=a===q.correct;return `<article class="reviewItem ${ok?'':'wrong'}"><strong>${i+1}. ${esc(q.q)}</strong>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}<p>${ok?'✅':'❌'} התשובה שלך: ${a===null?'לא נבחרה':esc(q.a[a])}</p><p><b>התשובה הנכונה:</b> ${esc(q.a[q.correct])}</p><p>${esc(q.why)}</p></article>`}).join('')}</div></section>`;return;}
const q=questions[state.index],sel=state.answers[state.index],answered=state.answers.filter(x=>x!==null).length;
app.innerHTML=`<div class="row" style="margin-bottom:14px"><span class="tag">שאלה ${state.index+1} מתוך 25</span><span class="muted">נענו ${answered} / 25</span></div><div class="meter" role="progressbar" aria-valuenow="${answered}" aria-valuemin="0" aria-valuemax="25" aria-label="התקדמות המבדק"><div style="width:${answered*4}%"></div></div><section class="panel"><div class="row"><span class="tag">${esc(q.topic)}</span><span class="muted">בחרו תשובה אחת</span></div><h2 class="question-title">${esc(q.q)}</h2>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}<div class="choices" role="group" aria-label="אפשרויות תשובה">${q.a.map((a,i)=>`<button class="option ${sel!==null&&i===q.correct?'correct':sel===i?'incorrect':''} ${sel===i?'selected':''}" aria-pressed="${sel===i}" onclick="pick(${i})"><span class="letter">${'אבגד'[i]}</span><span class="choiceText">${esc(a)}</span>${sel!==null&&i===q.correct?'<span aria-label="תשובה נכונה">✓</span>':sel===i?'<span aria-label="תשובה שגויה">✗</span>':''}</button>`).join('')}</div>${sel!==null?`<div class="feedback ${sel===q.correct?'good':'bad'}" role="status" aria-live="polite"><strong>${sel===q.correct?'✓ תשובה נכונה!':'✗ תשובה שגויה.'}</strong>${sel!==q.correct?`<div><b>התשובה הנכונה:</b> ${esc(q.a[q.correct])}</div>`:''}<div><b>הסבר:</b> ${esc(q.why)}</div></div>`:''}<div class="controls"><button class="secondary" onclick="previous()" ${state.index===0?'disabled':''}>→ שאלה קודמת</button><button class="primary" onclick="next()">${state.index===24?'סיום ובדיקת תשובות':'שאלה הבאה ←'}</button></div></section><details style="margin-top:20px"><summary style="cursor:pointer;font-weight:bold">ניווט מהיר בין שאלות</summary><div class="numbers">${questions.map((x,i)=>`<button class="num ${i===state.index?'active':''} ${state.answers[i]!==null?'answered':''}" onclick="jump(${i})" title="שאלה ${i+1}">${i+1}</button>`).join('')}</div></details><div class="row" style="margin-top:18px"><span class="muted">אפשר לסיים גם אם לא נענו כל השאלות.</span><button class="secondary" onclick="finish()">סיום המבדק</button></div>`;
}
restore();render();
</script>
</body></html>

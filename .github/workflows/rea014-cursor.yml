name: REA-014 structured cursor and overwrite
on:
  push:
    branches: [main]
    paths:
      - 'calculator/js/structured-editor.js'
      - 'calculator/js/app.js'
      - 'calculator/fx991_fresh_standalone.html'
      - 'calculator/reference/rea-014/**'
      - '.github/workflows/rea014-cursor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cursor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test insert/overwrite and nested field cursor behavior
        run: python calculator/reference/rea-014/test_cursor_browser.py

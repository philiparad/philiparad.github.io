<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milestone 19 Acceptance Tests</title><link rel="stylesheet" href="../styles.css"></head>
<body><header><h1>Milestone 19 — Acceptance Runner</h1><p>Internal implementation tests. For manual and physical-device reference comparisons, use <a href="reference.html">Reference Compatibility Laboratory</a>.</p></header><main style="display:block;max-width:850px"><section class="panel"><button id="run" class="button">Run all tests</button><a class="button secondary" href="../index.html">Return to simulator</a><div id="summary" class="stats"></div><div id="results"></div></section></main>
<script src="../src/natural-editor.js"></script>
<script src="../src/decimal15.js"></script>
<script src="../src/display.js"></script>
<script src="../src/kernel.js"></script><script src="../src/keymap.js"></script><script src="../src/state-machine.js"></script><script src="../src/numerical.js"></script>
<script src="../src/modes.js"></script><script src="../src/c-edition.js"></script><script src="../src/reference.js"></script>
<script src="../src/differential.js"></script><script src="../src/release-audit.js"></script><script src="../src/release-candidate.js"></script><script src="../src/device-validation.js"></script><script src="cases.js"></script><script>
function run(){const r=FX991_TESTS.run();document.getElementById('summary').textContent=r.passed+' / '+r.total+' passed; '+r.failed+' failed';const box=document.getElementById('results');box.replaceChildren();r.details.forEach(t=>{const d=document.createElement('div');d.className='test';const label=document.createElement('span');label.textContent=t.name+(t.error?' — '+t.error:'');const status=document.createElement('span');status.className=t.pass?'pass':'fail';status.textContent=t.pass?'PASS':'FAIL';d.append(label,status);box.append(d)})}document.getElementById('run').onclick=run;run();
</script></body></html>
